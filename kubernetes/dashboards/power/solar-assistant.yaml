---
# Battery + grid dashboard for the SolarAssistant feed. The vendor's own
# dashboard is built around PV production, which this system does not have,
# so this one keeps to power flow, battery health, grid quality and energy
# totals. Source metrics come from mqtt2prometheus in home-automation.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: solar-assistant
spec:
  folder: Power
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Battery + grid view of the SolarAssistant feed (no PV on this system). Data via mosquitto bridge \u2192 mqtt2prometheus.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Right now",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "title": "Grid import",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4000
                  },
                  {
                    "color": "red",
                    "value": 8000
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_grid_power_watts{sensor=\"inverter_1\"})",
              "refId": "A",
              "legendFormat": "Grid import"
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          }
        },
        {
          "title": "Load",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_load_power_watts{sensor=\"inverter_1\"})",
              "refId": "A",
              "legendFormat": "Load"
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          }
        },
        {
          "title": "Battery",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 35
                  },
                  {
                    "color": "green",
                    "value": 60
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_battery_state_of_charge_percent{sensor=\"battery_1\"})",
              "refId": "A",
              "legendFormat": "Battery"
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          }
        },
        {
          "title": "Battery power",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "description": "positive = charging, negative = discharging"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_battery_power_watts{sensor=\"battery_1\"})",
              "refId": "A",
              "legendFormat": "Battery power"
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          }
        },
        {
          "title": "Runtime at current load",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4
                  },
                  {
                    "color": "green",
                    "value": 12
                  }
                ]
              },
              "decimals": 1,
              "description": "Usable charge (above the inverter's stop-discharge floor) divided by the load right now"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max(solar_assistant_battery_capacity_amp_hours) * 51.2 / 1000) * clamp_min(max(solar_assistant_battery_state_of_charge_percent) - max(solar_assistant_inverter_stop_battery_discharge_capacity_percent), 0) / 100 * 1000 / clamp_min(max(solar_assistant_inverter_load_power_watts), 50)",
              "refId": "A",
              "legendFormat": "Runtime at current load"
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          }
        },
        {
          "title": "Runtime at last-hour load",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4
                  },
                  {
                    "color": "green",
                    "value": 12
                  }
                ]
              },
              "decimals": 1,
              "description": "Same, divided by the average load over the past hour"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max(solar_assistant_battery_capacity_amp_hours) * 51.2 / 1000) * clamp_min(max(solar_assistant_battery_state_of_charge_percent) - max(solar_assistant_inverter_stop_battery_discharge_capacity_percent), 0) / 100 * 1000 / clamp_min(max(avg_over_time(solar_assistant_inverter_load_power_watts[1h])), 50)",
              "refId": "A",
              "legendFormat": "Runtime at last-hour load"
            }
          ],
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          }
        },
        {
          "title": "Power flow",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "title": "Grid, load and battery",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "grid import"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "load"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "battery (+charge / \u2212discharge)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_grid_power_watts{sensor=\"inverter_1\"})",
              "legendFormat": "grid import",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_load_power_watts{sensor=\"inverter_1\"})",
              "legendFormat": "load",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_battery_power_watts{sensor=\"battery_1\"})",
              "legendFormat": "battery (+charge / \u2212discharge)",
              "refId": "C"
            }
          ],
          "description": "Where the power is coming from and going. With no PV, load = grid import \u2212 battery charge (+ battery discharge).",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 6
          }
        },
        {
          "title": "Grid import per leg",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "fillOpacity": 30,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_grid_power_l1_watts{sensor=\"inverter_1\"})",
              "legendFormat": "L1",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_grid_power_l2_watts{sensor=\"inverter_1\"})",
              "legendFormat": "L2",
              "refId": "B"
            }
          ],
          "description": "Leg balance on the 240 V split-phase feed",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          }
        },
        {
          "title": "Inverter load",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_inverter_load_percent{sensor=\"inverter_1\"})",
              "legendFormat": "load %",
              "refId": "A"
            }
          ],
          "description": "Load as a share of inverter capacity",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          }
        },
        {
          "title": "Battery",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "title": "State of charge",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0,
              "max": 100
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "SoC"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (sensor) (solar_assistant_battery_state_of_charge_percent{sensor=\"battery_1\"})",
              "legendFormat": "SoC",
              "refId": "A"
            }
          ],
          "description": "Discharge is allowed down to 35 % (stop_battery_discharge_capacity); output shuts down at 20 %",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 24
          }
        },
        {
          "title": "Charge / discharge",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "fillOpacity": 40,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "charging"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "discharging"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "clamp_min(max by (sensor) (solar_assistant_battery_power_watts{sensor=\"battery_1\"}), 0)",
              "legendFormat": "charging",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "clamp_max(max by (sensor) (solar_assistant_battery_power_watts{sensor=\"battery_1\"}), 0)",
              "legendFormat": "discharging",
              "refId": "B"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 24
          }
        },
        {
          "title": "Estimated runtime",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "at current load"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "at last-hour avg load"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "at last-24h avg load"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max(solar_assistant_battery_capacity_amp_hours) * 51.2 / 1000) * clamp_min(max(solar_assistant_battery_state_of_charge_percent) - max(solar_assistant_inverter_stop_battery_discharge_capacity_percent), 0) / 100 * 1000 / clamp_min(max(solar_assistant_inverter_load_power_watts), 50)",
              "legendFormat": "at current load",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max(solar_assistant_battery_capacity_amp_hours) * 51.2 / 1000) * clamp_min(max(solar_assistant_battery_state_of_charge_percent) - max(solar_assistant_inverter_stop_battery_discharge_capacity_percent), 0) / 100 * 1000 / clamp_min(max(avg_over_time(solar_assistant_inverter_load_power_watts[1h])), 50)",
              "legendFormat": "at last-hour avg load",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max(solar_assistant_battery_capacity_amp_hours) * 51.2 / 1000) * clamp_min(max(solar_assistant_battery_state_of_charge_percent) - max(solar_assistant_inverter_stop_battery_discharge_capacity_percent), 0) / 100 * 1000 / clamp_min(max(avg_over_time(solar_assistant_inverter_load_power_watts[24h])), 50)",
              "legendFormat": "at last-24h avg load",
              "refId": "C"
            }
          ],
          "description": "Hours of battery left if the grid dropped now: usable kWh above the stop-discharge floor \u00f7 load. Current-load line is noisy by nature; the averages are the planning numbers.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 24
          }
        },
        {
          "title": "Voltage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
