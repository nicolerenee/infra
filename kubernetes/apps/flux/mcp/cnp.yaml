---
# Tightly-scoped ingress: only the tailnet envoy gateway pods (not all of
# gateway-system). The chart's bundled NetworkPolicy can only filter by
# namespace, hence this replacement scoped by pod label too.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-mcp-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator-mcp
  ingress:
    # Agents in ai-agents (kagent) read Flux state through this server —
    # the local ones, and fairy's over Cluster Mesh (policy-default-local-
    # cluster is on, so a remote peer must be named by its cluster label).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-agents
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: ai-agents
            k8s:app.kubernetes.io/part-of: kagent
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateway-system
            gateway.envoyproxy.io/owning-gateway-name: tailnet
      toPorts:
        - ports:
            - port: http
              protocol: TCP
