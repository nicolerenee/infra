---
# Tightly-scoped ingress: only the MCP gateway's envoy pods (not all of
# gateway-system). The chart's bundled NetworkPolicy can only filter by
# namespace, hence this replacement scoped by pod label too.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-mcp-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator-mcp
  ingress:
    # Only the MCP gateway on fairy, which fronts this server for both
    # clusters: named by cluster label so the rule also matches when the Envoy
    # is a Cluster Mesh peer (atlantis instance of this dir). The server now
    # carries write tools, so this list is the whole security story.
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: gateway-system
            gateway.envoyproxy.io/owning-gateway-name: mcp
        # Container runs' read-only proxies (ToolHive MCPRemoteProxy in ai-mcp
        # on fairy, C-333): only the two proxies for this server, by name.
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: ai-mcp
            app: mcpremoteproxy
          matchExpressions:
            - key: toolhive-name
              operator: In
              values: [flux-fairy, flux-atlantis]
        # The agents' agentgateway proxy (Gateway agent-mcp in ai-mcp on
        # fairy) that replaces the ToolHive proxies. One proxy fronts every
        # agent MCP server; the cockpit decides per call (ExtMcp) and Flux
        # tools are also limited to reads in the gateway's own policy.
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: ai-mcp
            gateway.networking.k8s.io/gateway-name: agent-mcp
      toPorts:
        - ports:
            - port: http
              protocol: TCP
