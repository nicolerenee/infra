---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator-mcp
spec:
  interval: 10m
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator-mcp
  ref:
    tag: 0.61.0
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/controlplaneio-fluxcd/charts.*$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The server has cluster-admin RBAC (chart default) and now serves its
  # write tools too: it is reachable only through the MCP gateway, whose
  # human route exposes everything to a signed-in sysadmin and whose agents'
  # route filters it down to the read-only tools.
  values:
    readonly: false
    transport: http
    # Chart's NetworkPolicy can only filter by namespace; we want
    # pod-label scoping (only the MCP gateway's envoy pods, not all of
    # gateway-system). See cnp.yaml in this dir for the replacement.
    networkPolicy:
      create: false
    # No route of its own: clients reach this server only through the MCP
    # gateway (kubernetes/apps/networking/mcp-gateway).
    httpRoute:
      enabled: false
