---
# Tailscale funnel to the notification-controller. GitHub no longer uses it:
# its push hooks go to the Cloudflare tunnel route (httproute.yaml). Kept for
# the generic-hmac image Receivers whose external callers still POST here
# (janet-manifests-image-receiver, hedgehog-image-receiver).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-webhook-funnel
  namespace: flux-system
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:public-webhook"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - ${CLUSTER_NAME}-flux-webhook
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
