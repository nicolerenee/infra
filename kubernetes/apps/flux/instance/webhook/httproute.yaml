---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/gateway.networking.k8s.io/httproute_v1.json
#
# Public via the Cloudflare tunnel gateway, for GitHub's push webhooks to the
# github Receivers. Only /hook/ is routed: that is all the notification-
# controller serves, and every path under it is a sha256 of the Receiver's
# token, with GitHub's HMAC signature checked on top.
#
# Cluster-scoped hostname because the cert only covers one wildcard level:
# `*.freckle.services` would not match `flux-webhook.fairy.freckle.services`,
# but each cluster's own `*.${CLUSTER_SUBDOMAIN}.freckle.services` does.
#
# sectionName pins the https listener: the gateway's http listener only admits
# routes from gateway-system, so without it this route would also report as
# not allowed on that listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
spec:
  hostnames:
    - flux-webhook.${CLUSTER_SUBDOMAIN}.freckle.services
  parentRefs:
    - name: tunnel
      namespace: gateway-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
