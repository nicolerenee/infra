---
# Token for both GitHub Receivers (github-receiver, github-receiver-private).
# Generated by tofu (freckleapps/tofu platform/flux-receiver.tf), which also
# owns the GitHub hooks and derives their /hook/ paths from this same value, so
# it is never copied by hand. Stored as a raw hex string, hence no `property`.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-receiver-token
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: flux-receiver-token
  data:
    - secretKey: token
      remoteRef:
        key: flux-receiver-${CLUSTER_NAME}
