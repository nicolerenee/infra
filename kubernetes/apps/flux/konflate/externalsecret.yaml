---
# HMAC secret for konflate's inbound GitHub webhook.
#
# Generated by tofu and stored in Google Secret Manager as
# `konflate-webhook-<cluster>` (private repo, tofu/platform/konflate-webhook.tf),
# one per cluster because each konflate instance renders one cluster and gets
# its own GitHub webhook. Read through the konflate namespace's gcp-sm
# SecretStore, whose SA is bound as secretAccessor on exactly this one secret.
#
# The key name is what the chart's `secret.existingSecret` expects verbatim —
# konflate reads KONFLATE_WEBHOOK_SECRET out of the mounted Secret. Setting it
# turns on POST /hooks; without it that endpoint answers 501 and konflate falls
# back to polling on its refreshInterval backstop.
#
# The SAME value must be set as the webhook secret on the GitHub side — there
# is no github provider in the tofu, so that half is manual.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-webhook
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: konflate-webhook
  data:
    - secretKey: KONFLATE_WEBHOOK_SECRET
      remoteRef:
        key: konflate-webhook-${CLUSTER_NAME}
