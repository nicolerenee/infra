---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Paperless-ngx with its two document-conversion sidecars (Gotenberg, Tika).
# Runs rootless as UID 1000 (the image supports an arbitrary `user:`; don't
# combine with USERMAP_* or extra OCR languages). Postgres is the shared
# pg-18a cluster (managed role + Database CR in clusters/fairy-k8s01/apps/db),
# the broker is the Dragonfly CR next door, and the built-in AI features talk
# to the in-cluster AI gateway so documents never leave the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.1@sha256:1a08d8dfc2b51a08de09652dd86ad4d0c611c362382f944533ad38b73125fbc4
            env:
              PAPERLESS_URL: https://paperless.${CLUSTER_SUBDOMAIN}.freckle.tools
              # TLS terminates at the gateway; tell Django the original scheme.
              PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
              PAPERLESS_TIME_ZONE: America/Chicago
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_PORT: "8000"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              PAPERLESS_THREADS_PER_WORKER: "2"
              # Storage layout inside the single backed-up PVC (subPath mounts).
              PAPERLESS_DATA_DIR: /usr/src/paperless/data
              PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
              PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
              PAPERLESS_EXPORT_DIR: /usr/src/paperless/export
              # Database: shared pg-18a; user/password come from the secret.
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: pg-18a-rw.db.svc.cluster.local
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: paperless
              # Office/email documents via the sidecars.
              PAPERLESS_TIKA_ENABLED: "true"
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              # SSO via Freckle ID (provider JSON lives in the secret). Group
              # sync mirrors the pocket-id groups onto same-named Django groups,
              # which must exist first — create `paperless_users` in the admin
              # once, then membership follows the groups claim on every login.
              # paperless_admins grants superuser directly (no Django group needed).
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP: paperless_admins
              PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
              PAPERLESS_ACCOUNT_SESSION_REMEMBER: "true"
              # Built-in AI: suggestions + chat through the local AI gateway,
              # RAG index with the local Hugging Face embedding model (downloaded
              # once into the data dir).
              #
              # Model: Qwen3.8 Flash-Next (2-node LWS behind the gateway). Paperless
              # demands a tool call (tool_choice=required) for every suggestion; the
              # qwen3_coder parser enforces it (Qwen3.6's XML parser did not, so thin
              # scans came back as prose). Chosen over Nemotron Lightning after a
              # 22-document side-by-side: Lightning bled the RAG "similar documents"
              # context into ~1/3 of its suggestions; Flash-Next was clean on all.
              PAPERLESS_AI_LLM_MODEL: nvidia/Qwen3.8-Flash-Next-NVFP4
              PAPERLESS_AI_LLM_API_KEY: local
              PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "600"
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: huggingface
              # Nemotron thinks before every reply by default; suggestions are
              # short structured output that doesn't need it and it multiplies
              # latency. Paperless passes this JSON as keyword args to the OpenAI
              # SDK, so vLLM-only fields must ride inside `extra_body` (a bare
              # chat_template_kwargs is a TypeError). Drop the line to compare
              # quality with thinking on.
              PAPERLESS_AI_LLM_EXTRA_PARAMS: '{"extra_body": {"chat_template_kwargs": {"enable_thinking": false}}}'
            envFrom:
              - secretRef:
                  name: paperless-secrets
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/
                    port: 8000
                  failureThreshold: 60
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/
                    port: 8000
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/
                    port: 8000
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
            # The chromium route only ever converts .eml/.html from the consume
            # dir; lock it down like the upstream compose file does.
            args:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=^file:///tmp/.*
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
            securityContext:
              runAsUser: 35002
              runAsGroup: 35002
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: paperless
        ports:
          http:
            port: 8000

    route:
      app:
        hostnames: ["paperless.${CLUSTER_SUBDOMAIN}.freckle.tools"]
        parentRefs:
          - name: internal
            namespace: gateway-system
        rules:
          - backendRefs:
              - name: paperless
                port: 8000

    persistence:
      # One PVC (from the volsync component) holds everything paperless
      # must keep; subPaths keep the four trees separate.
      data:
        existingClaim: ${APP}
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/data
                subPath: data
              - path: /usr/src/paperless/media
                subPath: media
              - path: /usr/src/paperless/consume
                subPath: consume
              - path: /usr/src/paperless/export
                subPath: export
      tmp:
        type: emptyDir
        advancedMounts:
          paperless:
            app:
              - path: /tmp
            gotenberg:
              - path: /tmp
            tika:
              - path: /tmp
