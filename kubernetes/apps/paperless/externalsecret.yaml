---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# All paperless secrets as env vars. Sources (GSM, tofu-generated):
#   ${CLUSTER_NAME}-paperless-app   secret_key / db_username / db_password / redis_password
#   ${CLUSTER_NAME}-paperless-oidc  client-id / client-secret (Freckle ID)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: paperless-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"
        PAPERLESS_DBUSER: "{{ .db_username }}"
        PAPERLESS_DBPASS: "{{ .db_password }}"
        PAPERLESS_REDIS: "redis://:{{ .redis_password }}@paperless-queue.paperless.svc.cluster.local:6379"
        # django-allauth OpenID Connect provider. provider_id fixes the
        # callback path (/accounts/oidc/freckle-id/login/callback/), which is
        # what the pocket-id client registers. Scope `groups` feeds
        # PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {"openid_connect": {"SCOPE": ["openid", "profile", "email", "groups"], "OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "freckle-id", "name": "Freckle ID", "client_id": "{{ index . "client-id" }}", "secret": "{{ index . "client-secret" }}", "settings": {"server_url": "https://freckle.id/.well-known/openid-configuration"}}]}}
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-paperless-app
    - extract:
        key: ${CLUSTER_NAME}-paperless-oidc
---
# Dragonfly auth. Same GSM source; the Dragonfly CR wants a single-key Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-queue-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: paperless-queue-secrets
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ${CLUSTER_NAME}-paperless-app
        property: redis_password
