---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-gsm-check
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: tuwunel-secret-gsm-check
    # Retain this unmounted comparison target when the check is retired.
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        TUWUNEL_REGISTRATION_TOKEN: "{{ .registration_token }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-matrix-tuwunel
