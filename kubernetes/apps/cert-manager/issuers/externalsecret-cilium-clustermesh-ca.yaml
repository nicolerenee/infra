---
# Shared Cilium Cluster Mesh CA (same key pair on every cluster in the mesh),
# minted by tofu in the private repo and delivered per cluster through GSM.
# cert-manager issues each cluster's clustermesh-apiserver server/client
# certificates from it; see the ClusterIssuer in issuers.yaml.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cilium-clustermesh-ca
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: cilium-clustermesh-ca
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: ${CLUSTER_NAME}-cert-manager-cilium-clustermesh-ca-crt
    - secretKey: tls.key
      remoteRef:
        key: ${CLUSTER_NAME}-cert-manager-cilium-clustermesh-ca-key
