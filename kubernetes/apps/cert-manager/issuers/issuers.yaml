---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  namespace: cert-manager
spec:
  acme:
    email: soc@freckle.family
    privateKeySecretRef:
      name: letsencrypt-production
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-token
              key: api_token
---
# CA issuer for Cilium Cluster Mesh certificates. The CA is shared across the
# meshed clusters (externalsecret-cilium-clustermesh-ca.yaml), which is what
# lets one cluster's agents authenticate to another's clustermesh-apiserver.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cilium-clustermesh-ca
spec:
  ca:
    secretName: cilium-clustermesh-ca
