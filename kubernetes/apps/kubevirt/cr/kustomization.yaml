---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
# KubeVirt CR — vendored at the same TAG as the operator. Edits beyond the
# upstream defaults live in this kustomization (patches/), not the vendored
# kubevirt-cr.yaml itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kubevirt-cr.yaml
# Upstream ships these as empty maps (`{}`) and lets the operator's webhook
# default them. Flux's server-side apply sends an empty map as null, which the
# CRD rejects ("must be of type object: null") and the Kustomization never
# reconciles. Dropping the keys lets the webhook default them exactly as the
# empty maps would have.
patches:
  - target:
      kind: KubeVirt
      name: kubevirt
    patch: |
      - op: remove
        path: /spec/certificateRotateStrategy
      - op: remove
        path: /spec/customizeComponents
      - op: remove
        path: /spec/workloadUpdateStrategy
  # ContainerPathVolumes lets a VM see files the platform projects into its
  # virt-launcher pod (a ServiceAccount token, over virtiofs). Agent VMs use
  # it to carry a cluster identity into the guest and exchange it for GCP
  # credentials through workload identity federation, so no long-lived key
  # sits on a VM disk. The gate is alpha in 1.9; drop this patch once it
  # graduates.
  - target:
      kind: KubeVirt
      name: kubevirt
    patch: |
      - op: add
        path: /spec/configuration/developerConfiguration/featureGates/-
        value: ContainerPathVolumes
