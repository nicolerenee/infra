kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
configMapGenerator:
  - name: windmill-grants
    files:
      - grants.sh=./resources/grants.sh
generatorOptions:
  disableNameSuffixHash: true
