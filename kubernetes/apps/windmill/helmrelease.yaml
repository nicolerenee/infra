---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
spec:
  interval: 1h
  chart:
    spec:
      chart: windmill
      version: 4.0.264
      sourceRef:
        kind: HelmRepository
        name: windmill
  values:
    postgresql:
      enabled: false

    windmill:
      appReplicas: 1
      databaseUrlSecretName: windmill
      baseDomain: windmill.fairy.freckle.tools
      baseProtocol: https

      workerGroups:
        - name: default
          replicas: 1
          privileged: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

      app:
        initContainers:
          - name: 01-init-db
            image: ghcr.io/home-operations/postgres-init:18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: windmill
          - name: 02-init-grants
            image: ghcr.io/home-operations/postgres-init:18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            command:
              - /bin/bash
              - -c
              - /var/run/grants.sh
            envFrom: *envFrom
            volumeMounts:
              - name: grants
                readOnly: true
                subPath: grants.sh
                mountPath: /var/run/grants.sh
        volumes:
          - name: grants
            configMap:
              name: windmill-grants
              defaultMode: 0755

    ingress:
      enabled: false
