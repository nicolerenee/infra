---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        url: "postgresql://{{ .WINDMILL_POSTGRES_USER }}:{{ .WINDMILL_POSTGRES_PASS }}@pg-17a-rw.db.svc.cluster.local:5432/windmill?sslmode=disable"
        # Postgres Init
        INIT_POSTGRES_DBNAME: windmill
        INIT_POSTGRES_HOST: pg-17a-rw.db.svc.cluster.local
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: "{{ .WINDMILL_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .WINDMILL_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: windmill-${CLUSTER_NAME}
    - extract:
        key: pg-17a-${CLUSTER_NAME}
