---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
# Shared base for all clusters, including the public Gateway. Clusters
# add their own listeners or parentRefs via patches on their Flux
# Kustomization (see atlantis and fairy gateway-configs).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./certificates.yaml
  - ./envoy.yaml
  - ./envoy-clusterip.yaml
  - ./envoy-tailscale.yaml
  - ./gw-internal.yaml
  - ./gw-public.yaml
  - ./gw-tailnet.yaml
  - ./gw-tunnel.yaml
  - ./redirect.yaml
