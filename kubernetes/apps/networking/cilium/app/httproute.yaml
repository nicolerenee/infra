apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  hostnames:
    - hubble.${CLUSTER_SUBDOMAIN}.freckle.tools
  parentRefs:
    - name: internal
      namespace: gateway-system
  rules:
    - backendRefs:
        - kind: Service
          name: hubble-ui
          port: 80
