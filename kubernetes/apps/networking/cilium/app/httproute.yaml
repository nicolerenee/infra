apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  hostnames:
    - hubble.${CLUSTER_SUBDOMAIN}.freckle.tools
    # Legacy name on the tailnet gateway — removed once the .tools name is
    # proven (internal gateway migration pilot).
    - hubble.${CLUSTER_DOMAIN}
  parentRefs:
    - name: internal
      namespace: gateway-system
    - name: tailnet
      namespace: gateway-system
  rules:
    - backendRefs:
        - kind: Service
          name: hubble-ui
          port: 80
