---
ipam:
  mode: kubernetes

nodePort:
  enabled: false
bpf:
  masquerade: true
cni:
  exclusive: false

# replace kube-proxy
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# enable IPv6
ipv6:
  enabled: true

## cilium can automatically kill and respawn pods upon ConfigMap updates or other resource changes
rollOutCiliumPods: true
envoy:
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

operator:
  dashboards:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  rollOutPods: true
  # Keep one of the two operators up through node drains (chart default
  # maxUnavailable: 1). Adding a PDB doesn't touch the pod template.
  podDisruptionBudget:
    enabled: true

# Same for the two clustermesh-apiservers. The apiserver itself (enabled,
# replicas, TLS) is set per cluster in the cilium Kustomization patches, and
# Flux deep-merges those over these values.
clustermesh:
  apiserver:
    podDisruptionBudget:
      enabled: true

dashboards:
  enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

# agent resource limits
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "6Gi"

hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
  relay:
    enabled: true
    rollOutPods: true
    prometheus:
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
    rollOutPods: true

# required for talos
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# change required for tailscale operator (https://tailscale.com/kb/1236/kubernetes-operator#cilium-in-kube-proxy-replacement-mode)
socketLB:
  hostNamespaceOnly: true
