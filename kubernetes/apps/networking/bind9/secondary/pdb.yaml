---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/policy/poddisruptionbudget_v1.json
# Keep one of the two secondaries answering while a node drains (Talos
# upgrades, descheduler), so the secondary DNS address never goes dark.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bind9-secondary
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/controller: bind9-secondary
      app.kubernetes.io/instance: bind9-secondary
