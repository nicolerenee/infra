---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Only the transfer key — secondaries never take updates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bind9-secondary-tsig
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: bind9-secondary-tsig
    template:
      data:
        tsig-keys.conf: |
          key "freckle-dns-xfr" { algorithm hmac-sha256; secret "{{ .xfr_secret }}"; };
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-dns-tsig-keys
