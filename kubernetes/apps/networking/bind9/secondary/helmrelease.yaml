---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bind9-secondary
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      bind9-secondary:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          # Keep a verified copy serving while a fresh pod transfers its zones.
          unavailable: 0
          surge: 1
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: bind9-secondary
        containers:
          app:
            image:
              repository: docker.io/internetsystemsconsortium/bind9
              tag: "9.20"
            command: ["/usr/sbin/named", "-g", "-c", "/config/named.conf"]
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5353
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "/readiness/readiness.sh"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 1
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          # Turns named's loopback statistics channel into Prometheus metrics
          # on 9119. No probes: a failing exporter must never take the pod out
          # of the DNS Service.
          exporter:
            image:
              repository: docker.io/prometheuscommunity/bind-exporter
              tag: v0.8.0@sha256:f3d3d3c85e95e752a2af50c46cebeaeee22d94493d7d7c898e2ab9d232b366d7
            args:
              - --bind.stats-url=http://127.0.0.1:8053/
              # No tasks group: BIND 9.20 has no task manager, so
              # /json/v1/tasks is a 404 that fails the whole scrape.
              - --bind.stats-groups=server,view
              - --web.listen-address=:9119
            securityContext: *sc
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      app:
        controller: bind9-secondary
        type: LoadBalancer
        labels:
          ipam.freckle.systems/lb-pool: internal
        annotations:
          lbipam.cilium.io/ips: ${DNS_SECONDARY_IP}
        # Cluster, not Local: reachability of the address matters more than
        # preserving client IPs (the site gateway is the client anyway).
        externalTrafficPolicy: Cluster
        ipFamilyPolicy: SingleStack
        ports:
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
          dns-tcp:
            port: 53
            targetPort: 5353
            protocol: TCP
      # Metrics on their own ClusterIP Service, so 9119 is never on the DNS
      # LoadBalancer address.
      metrics:
        controller: bind9-secondary
        ports:
          metrics:
            port: 9119
            protocol: TCP

    serviceMonitor:
      app:
        service:
          identifier: metrics
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    persistence:
      readiness:
        type: configMap
        name: bind9-secondary-readiness
        advancedMounts:
          bind9-secondary:
            app:
              - path: /readiness
                readOnly: true
      config:
        type: configMap
        name: bind9-secondary-config
        globalMounts:
          - path: /config
            readOnly: true
      secrets:
        type: secret
        name: bind9-secondary-tsig
        # named only: the exporter never sees the TSIG keys.
        advancedMounts:
          bind9-secondary:
            app:
              - path: /secrets
                readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
