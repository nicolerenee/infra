---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bind9-secondary
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      bind9-secondary:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 1
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: bind9-secondary
        containers:
          app:
            image:
              repository: docker.io/internetsystemsconsortium/bind9
              tag: 9.20
            command: ["/usr/sbin/named", "-g", "-c", "/config/named.conf"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5353
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness: *probe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: bind9-secondary
        type: LoadBalancer
        labels:
          ipam.freckle.systems/lb-pool: internal
        annotations:
          lbipam.cilium.io/ips: ${DNS_SECONDARY_IP}
        # Cluster, not Local: reachability of the address matters more than
        # preserving client IPs (the site gateway is the client anyway).
        externalTrafficPolicy: Cluster
        ipFamilyPolicy: SingleStack
        ports:
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
          dns-tcp:
            port: 53
            targetPort: 5353
            protocol: TCP

    persistence:
      config:
        type: configMap
        name: bind9-secondary-config
        globalMounts:
          - path: /config
            readOnly: true
      secrets:
        type: secret
        name: bind9-secondary-tsig
        globalMounts:
          - path: /secrets
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
