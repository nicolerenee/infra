---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Both TSIG keys, rendered straight into a named.conf include. Generated by
# tofu (internal-dns.tf in the private repo) and shared with the secondaries
# (xfr) and the external-dns rfc2136 instances (update).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bind9-primary-tsig
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: bind9-primary-tsig
    template:
      data:
        tsig-keys.conf: |
          key "freckle-dns-update" { algorithm hmac-sha256; secret "{{ .update_secret }}"; };
          key "freckle-dns-xfr" { algorithm hmac-sha256; secret "{{ .xfr_secret }}"; };
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-dns-tsig-keys
