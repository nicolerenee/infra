---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bind9-primary
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      bind9-primary:
        annotations:
          reloader.stakater.com/auto: "true"
        # One replica, PVC-backed: the zone journals are the source of truth.
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          init-zones:
            image: &image
              repository: docker.io/internetsystemsconsortium/bind9
              tag: "9.20"
            command: ["/bin/sh", "/init/init-zones.sh"]
            env:
              DNS_SECONDARY_FAIRY_IP: ${DNS_SECONDARY_FAIRY_IP}
              DNS_SECONDARY_ATLANTIS_IP: ${DNS_SECONDARY_ATLANTIS_IP}
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image: *image
            command: ["/usr/sbin/named", "-g", "-c", "/config/named.conf"]
            securityContext: *sc
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5353
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness: *probe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
          # Turns named's loopback statistics channel into Prometheus metrics
          # on 9119. No probes: a failing exporter must never take the pod out
          # of the DNS Service.
          exporter:
            image:
              repository: docker.io/prometheuscommunity/bind-exporter
              tag: v0.8.0@sha256:f3d3d3c85e95e752a2af50c46cebeaeee22d94493d7d7c898e2ab9d232b366d7
            args:
              - --bind.stats-url=http://127.0.0.1:8053/
              - --bind.stats-groups=server,view,tasks
              - --web.listen-address=:9119
            securityContext: *sc
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      app:
        controller: bind9-primary
        type: LoadBalancer
        labels:
          ipam.freckle.systems/lb-pool: internal
        annotations:
          lbipam.cilium.io/ips: ${DNS_PRIMARY_IP}
        ipFamilyPolicy: SingleStack
        ports:
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
          dns-tcp:
            port: 53
            targetPort: 5353
            protocol: TCP
      # Metrics on their own ClusterIP Service, so 9119 is never on the DNS
      # LoadBalancer address.
      metrics:
        controller: bind9-primary
        ports:
          metrics:
            port: 9119
            protocol: TCP

    serviceMonitor:
      app:
        service:
          identifier: metrics
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    persistence:
      config:
        type: configMap
        name: bind9-primary-config
        globalMounts:
          - path: /config
            readOnly: true
      init:
        type: configMap
        name: bind9-primary-init
        advancedMounts:
          bind9-primary:
            init-zones:
              - path: /init
                readOnly: true
      secrets:
        type: secret
        name: bind9-primary-tsig
        # named only: the exporter never sees the TSIG keys.
        advancedMounts:
          bind9-primary:
            app:
              - path: /secrets
                readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
