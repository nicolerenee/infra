---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../proxygroup
  - proxyclass.yaml
  - pdb.yaml
patches:
  - target:
      group: tailscale.com
      version: v1alpha1
      kind: ProxyGroup
    patch: |-
      - op: add
        path: /spec/proxyClass
        value: proxygroup-ha
