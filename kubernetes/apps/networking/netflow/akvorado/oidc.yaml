---
# OIDC client credentials for the Akvorado console.
#
# The pocket-id client itself is tofu-managed (`oidc_clients.akvorado_atlantis`
# in the private repo's platform config). tofu pushes a JSON blob with
# client-id + client-secret into GSM as `<cluster>-<namespace>-<name>`, so
# `dataFrom.extract` lands both as their own keys with no templating.
#
# Nothing to register by hand — a tofu apply creates the client, the secret and
# the IAM grant together. Cluster-specific because the GSM key is prefixed with
# the cluster name; the namespace's gcp-sm SecretStore is defined alongside the
# Flux pointers.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akvorado-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: akvorado-oidc
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-netflow-akvorado-oidc
---
# The console has no authentication of its own — it trusts a Remote-User
# header and assumes something in front established the identity. That makes
# this policy load-bearing, not defence in depth: getting past pocket-id is
# the whole of the access control.
#
# Gate only, no identity. This originally also carried a `jwt` provider with
# claimToHeaders, so the console would see real usernames — Envoy Gateway
# orders oauth2 (8) before jwt_authn (9), so the ID token forwarded by
# `oidc.forwardIDToken` would have been available to it.
#
# That does not work on any released Envoy Gateway. `ForwardIDToken` exists in
# the v1.8.2 API types and passes CRD validation, but nothing under internal/
# reads it — the field is declared and never implemented, so the policy reports
# Accepted=True and silently forwards nothing. jwt_authn then rejects every
# request with "Jwt is missing". Still unimplemented in v1.8.3; the wiring
# exists only on EG main (internal/gatewayapi/securitypolicy.go).
#
# So every authenticated user shares akvorado's built-in `__default` identity
# and saved filters are shared. Revisit when EG ships ForwardIDToken; the
# alternative today is an oauth2-proxy extAuth backend, which is what upstream
# akvorado documents.
#
# The targetRef is the bare `akvorado` HTTPRoute: app-template drops the key
# suffix when a release declares a single route. If that ever becomes
# `akvorado-console`, this policy silently stops applying and the console is
# exposed — check `kubectl get securitypolicy` status after chart upgrades.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: akvorado-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: akvorado
  oidc:
    provider:
      issuer: https://freckle.id
    clientIDRef:
      group: ""
      kind: Secret
      name: akvorado-oidc
    clientSecret:
      group: ""
      kind: Secret
      name: akvorado-oidc
    redirectURL: https://akvorado.${CLUSTER_SVCS_DOMAIN}/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - email
      - profile
    # Pin the ID token cookie to a fixed name. By default EG appends a random
    # suffix, which makes it impossible to name in the jwt extractFrom below.
    cookieNames:
      idToken: AkvoradoIdToken
  # Validates the ID token the browser presents as a cookie, and maps its
  # claims into the headers the console reads.
  #
  # This is the cookie route, NOT oidc.forwardIDToken — that field is declared
  # in the v1.8.2 API and never read by the translator, so it silently forwards
  # nothing and jwt_authn answers "Jwt is missing". Reading the cookie works
  # because the browser supplies it on every request after login, so it does
  # not depend on one filter mutating the request for another.
  #
  # Ordering still matters for the FIRST request: oauth2 (filter order 8) runs
  # before jwt_authn (9), so an unauthenticated request is redirected to
  # pocket-id rather than rejected for having no token.
  #
  # Bonus: envoyproxy/gateway#5414 — EG's OIDC filter does not validate the ID
  # token at all (no signature or issuer check, contrary to the OIDC spec).
  # This provider is what actually verifies it for this route.
  jwt:
    providers:
      - name: pocket-id
        issuer: https://freckle.id
        remoteJWKS:
          uri: https://freckle.id/.well-known/jwks.json
        extractFrom:
          cookies:
            - AkvoradoIdToken
        # No `audiences`: an ID token's aud is the client ID, which lives in a
        # secret and cannot be templated in here. Issuer + JWKS signature are
        # the checks that matter, and both now happen.
        claimToHeaders:
          - claim: preferred_username
            header: Remote-User
          - claim: name
            header: Remote-Name
          - claim: email
            header: Remote-Email
