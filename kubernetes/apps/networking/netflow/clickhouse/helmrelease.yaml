---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    controllers:
      clickhouse:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: clickhouse/clickhouse-server
              tag: 26.7@sha256:02287d15a42b8c640c40387244d063f736b1981410003b594692718347d1adf9
            env:
              # Akvorado's orchestrator connects as the stock `default` user
              # with no password, so skip the entrypoint's user provisioning
              # entirely. Reachable only from inside the namespace.
              CLICKHOUSE_SKIP_USER_SETUP: "1"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &httpPort 8123
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *httpPort
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # Upstream's compose grants SYS_NICE so ClickHouse can lower the
              # priority of background merge threads. It degrades gracefully
              # without it (logs "Cannot set 'nice'" and carries on), so we
              # keep the drop-ALL baseline rather than widen capabilities for
              # a scheduling nicety.
              capabilities: { drop: ["ALL"] }
              # The image entrypoint creates and chowns paths outside the data
              # volume (/var/log/clickhouse-server, /tmp, user_files) before
              # handing off to the server, so the root filesystem has to stay
              # writable.
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # uid/gid 101 is the `clickhouse` user baked into the official image.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: clickhouse
        ports:
          http:
            port: *httpPort
          native:
            port: 9000
    serviceMonitor:
      app:
        serviceName: clickhouse
        endpoints:
          - port: http
            path: /metrics
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        retain: true
        suffix: data
        advancedMounts:
          clickhouse:
            app:
              - path: /var/lib/clickhouse
      config:
        type: configMap
        name: clickhouse-config
        advancedMounts:
          clickhouse:
            app:
              - path: /etc/clickhouse-server/config.d/akvorado.xml
                subPath: akvorado.xml
                readOnly: true
              - path: /etc/clickhouse-server/config.d/observability.xml
                subPath: observability.xml
                readOnly: true
