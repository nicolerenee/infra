---
# Pod L2 attachment to the home LAN (VLAN 300).
#
# Uses the bridge CNI plugin on br-homelan (a host Linux bridge whose only
# port is the home-LAN VLAN sub-interface; see
# fairy-k8s01/talos/control-plane/40-network.yaml.tpl). Previously
# used macvlan directly on the VLAN sub-interface, but KubeVirt VMs can't share the
# macvlan-on-VLAN path (kernel MAC filter conflicts with KubeVirt's
# bridge binding), so the underlying L2 fanout was moved to a Linux
# bridge. Pods get unique MACs and static IPs via the same per-pod
# annotation as before — only the CNI plugin underneath changed.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: multus-trusted
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "multus-trusted",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "br-homelan",
          "macspoofchk": false,
          "capabilities": { "mac": true, "ips": true },
          "ipam": {
            "type": "static"
          }
        },
        {
          "type": "tuning",
          "capabilities": { "mac": true },
          "sysctl": {
            "net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen": "64"
          }
        }
      ]
    }
