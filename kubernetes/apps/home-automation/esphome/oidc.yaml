---
# ESPHome dashboard has no authentication of its own; on the internal gateway
# this policy is the access control.
# The pocket-id client is tofu-managed (`oidc_clients.esphome_<env>` in the
# private repo), which pushes client-id + client-secret into GSM as
# <cluster>-home-automation-esphome-oidc.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: esphome-oidc
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-home-automation-esphome-oidc
---
# OIDC login at the gateway; the jwt provider validates the ID-token cookie
# (EG's OIDC filter does not — envoyproxy/gateway#5414). Targets the `esphome`
# route (app-template drops the key suffix for a single route).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: esphome-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: esphome
  oidc:
    provider:
      issuer: https://freckle.id
    clientIDRef:
      group: ""
      kind: Secret
      name: esphome-oidc
    clientSecret:
      group: ""
      kind: Secret
      name: esphome-oidc
    redirectURL: https://esphome.${CLUSTER_SUBDOMAIN}.freckle.tools/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - email
      - profile
    cookieNames:
      idToken: EsphomeIdToken
  jwt:
    providers:
      - name: pocket-id
        issuer: https://freckle.id
        remoteJWKS:
          uri: https://freckle.id/.well-known/jwks.json
        extractFrom:
          cookies:
            - EsphomeIdToken
