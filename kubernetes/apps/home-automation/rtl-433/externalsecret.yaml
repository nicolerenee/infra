---
# Parameterized via postBuild ${APP} — produces <APP>-mqtt-creds Secret
# from the matching GSM secret ${CLUSTER_NAME}-home-automation-mqtt-<APP>
# ({"username":..,"password":..}), read through the namespace's gcp-sm
# SecretStore.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-mqtt-creds
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  refreshInterval: 1h
  target:
    name: ${APP}-mqtt-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MQTT_USERNAME: "{{ .username }}"
        MQTT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-${APP}
        property: username
    - secretKey: password
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-${APP}
        property: password
