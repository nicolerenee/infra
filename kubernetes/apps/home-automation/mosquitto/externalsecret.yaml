---
# Produces the mosquitto-secret Secret that the HR mounts at both
# /mosquitto/config/mosquitto.conf and /mosquitto/password/password.txt.
# Templating the whole conf via ES is what lets us keep the SolarAssistant
# bridge credentials out of git.
#
# Broker users come from GSM, one JSON secret per user
# (${CLUSTER_NAME}-home-automation-mqtt-<name>: {"username":..,"password":..}),
# read through the namespace's gcp-sm SecretStore.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-secret
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  refreshInterval: 1h
  target:
    name: mosquitto-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password.txt: |
          {{ .ha_user }}:{{ .ha_pass }}
          {{ .ha_addon_user }}:{{ .ha_addon_pass }}
          {{ .rtl_915_user }}:{{ .rtl_915_pass }}
        mosquitto.conf: |
          persistence true
          persistence_location /mosquitto/data/

          log_dest stdout

          listener 1883
          protocol mqtt

          allow_anonymous true
          password_file /mosquitto/password/password.txt

          connection SolarAssistant
          remote_username {{ .solar_user }}
          remote_password {{ .solar_pass }}
          address 192.168.84.6
          topic # in
          topic solar_assistant/# out
  data:
    - secretKey: ha_user
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-homeassistant
        property: username
    - secretKey: ha_pass
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-homeassistant
        property: password
    - secretKey: ha_addon_user
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-hass-addons
        property: username
    - secretKey: ha_addon_pass
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-hass-addons
        property: password
    - secretKey: rtl_915_user
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-rtl915
        property: username
    - secretKey: rtl_915_pass
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-rtl915
        property: password
    - secretKey: solar_user
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-solar-bridge
        property: username
    - secretKey: solar_pass
      remoteRef:
        key: ${CLUSTER_NAME}-home-automation-mqtt-solar-bridge
        property: password
