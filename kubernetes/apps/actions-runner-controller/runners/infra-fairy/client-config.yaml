---
apiVersion: v1
kind: ConfigMap
metadata:
  name: package-proxy-client
data:
  GOPROXY: "http://package-proxy.dev-platform.svc.cluster.local:8080/go"
  GOSUMDB: "sum.golang.org http://package-proxy.dev-platform.svc.cluster.local:8080/go/sumdb/sum.golang.org"
  GOPRIVATE: "github.com/frecklelabs/*"
  GONOPROXY: "github.com/frecklelabs/*"
  NPM_CONFIG_REGISTRY: "http://package-proxy.dev-platform.svc.cluster.local:8080/npm/"
  PIP_INDEX_URL: "http://package-proxy.dev-platform.svc.cluster.local:8080/pypi/simple/"
  UV_INDEX_URL: "http://package-proxy.dev-platform.svc.cluster.local:8080/pypi/simple/"
  PIP_TRUSTED_HOST: "package-proxy.dev-platform.svc.cluster.local"
  UV_INSECURE_HOST: "package-proxy.dev-platform.svc.cluster.local:8080"
