---
# Per agent: the "Bearer"-prefixed copy of its gateway token (minted into
# <agent>-gateway-token by the CronJob in token-minter.yaml; a projected token
# cannot be handed to kagent) and the RemoteMCPServer that presents it to the
# agents' route on the MCP gateway. The gateway authorizes by the token's
# subject (system:serviceaccount:ai-agents:<agent>) and audience.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-triage-mcp-gateway
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: agent-tokens
  target:
    name: cluster-triage-mcp-gateway
    template:
      data:
        Authorization: "Bearer {{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: cluster-triage-gateway-token
        property: token
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: mcp-gateway-cluster-triage
spec:
  description: Every MCP tool this agent may use, through the MCP gateway (tool names are prefixed by server, e.g. vmetrics-fairy__query)
  protocol: STREAMABLE_HTTP
  url: https://mcp-agents.fairy.freckle.services/mcp
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: cluster-triage-mcp-gateway
        key: Authorization
---
