---
# The agents authenticate to the MCP gateway with their own ServiceAccount
# tokens. kagent sends a header value exactly as stored, and a
# kubernetes.io/service-account-token Secret only carries the bare token, so
# this SecretStore reads those Secrets back and the ExternalSecrets below
# template "Bearer <token>" into a Secret kagent can reference.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway-token-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway-token-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-gateway-token-reader
subjects:
  - kind: ServiceAccount
    name: mcp-gateway-token-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agent-tokens
spec:
  provider:
    kubernetes:
      remoteNamespace: ai-agents
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: mcp-gateway-token-reader
