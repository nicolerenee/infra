---
# Webhook URL for the windmill-agent-triage receiver: Windmill's async
# flow-run endpoint with a `?token=` whose scope is limited to running
# f/agents/alert_triage. The URL is the secret (the token is in it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-alert-triage-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: windmill-alert-triage-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: url
      remoteRef:
        key: ${CLUSTER_NAME}-observability-windmill-alert-triage-webhook
