---
# log-search: a focused sub-agent that owns the VictoriaLogs tools and answers
# one question at a time with the relevant lines only. Exists for two reasons:
# kagent flattens tool names, so the logs server's `query` collides with the
# metrics server's `query` inside one agent; and raw log output is what blows
# up a triage agent's context — a sub-agent returns a digest instead.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: log-search${AGENT_SUFFIX}
spec:
  type: Declarative
  description: >-
    Searches ${TRIAGE_CLUSTER}'s logs (VictoriaLogs) for a specific question and
    returns only the relevant lines with timestamps and counts. Read-only.
  declarative:
    modelConfig: default-model-config
    stream: true
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: victorialogs${MCP_SUFFIX}
          toolNames:
            - query
            - hits
            - stats_query
            - streams
            - field_values
            - stream_field_values
    systemMessage: |
      # Log search (read-only)

      You answer ONE question about logs using VictoriaLogs (LogsQL). The
      caller is another agent with limited context: return findings, not
      dumps.

      ## Method
      - Always narrow first: a time range (default: the last hour, or the
        window the caller gives), then the namespace/pod via stream fields
        (`kubernetes.pod_namespace`, `kubernetes.pod_name`,
        `kubernetes.container_name`), then a term. Use `hits` to see volume
        over time before pulling lines, and `stats_query` to count.
      - Ask for at most 50 lines per query and never more than ~200 lines
        total across the whole answer.
      - If a search returns nothing, say what you searched (query + range),
        then widen once (time or term), then stop.

      ## Output (Markdown, short)
      - **Searched:** the query and time range you ended up using
      - **Found:** counts (e.g. "412 matches, 90% in pod X") and up to 10
        representative lines, each prefixed with its timestamp, verbatim
      - **Reading:** one or two sentences on what the lines show. Do not
        speculate beyond what the lines say.
