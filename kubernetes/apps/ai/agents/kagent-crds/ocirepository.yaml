---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Stable line. v1.0.0-alpha* ships ~daily and needs an external Postgres +
    # the "substrate" sandbox runtime; 0.10.x bundles its DB and is what the
    # agent CRDs below are written against.
    tag: 0.10.1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
