---
# Namespace-wide policy for ai-agents. Nothing here holds a credential: agents
# reach the AI gateway and the MCP gateway, and are called by Windmill.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-agents
spec:
  endpointSelector: {}
  ingress:
    # Intra-namespace (controller <-> agents <-> tools <-> bundled postgres).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai-agents
    # Windmill drives the agents over A2A (:8080) and the controller API (:8083).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: windmill
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8083"
              protocol: TCP
    # Metrics scrape.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai-agents
    # Models: the AI gateway (listener :10080 on the Envoy pods).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: inference
            gateway.envoyproxy.io/owning-gateway-name: ai
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    # The MCP gateway (gateway-system): every MCP tool an agent uses goes
    # through its agents' route (TLS on the Envoy's 10443); the agents have no
    # direct path to any MCP server.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gateway-system
            gateway.envoyproxy.io/owning-gateway-name: mcp
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: janet-mcp
            app: jina-reader
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Traces.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: otel-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
