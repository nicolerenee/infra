---
# Read-only MCP servers the agents may be given. Each Agent still opts in per
# tool via `toolNames`; defining a server here grants nothing by itself. All are
# existing in-cluster services (observability + flux-system); none hold write
# credentials. The chart's kagent-tool-server (read-only Kubernetes tools) is
# created by the kagent HelmRelease.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: victoriametrics
spec:
  description: VictoriaMetrics (PromQL queries, alerts, rules, metadata) for this cluster — read-only
  protocol: STREAMABLE_HTTP
  url: http://mcp-victoriametrics.observability.svc.cluster.local:8080/mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: victorialogs
spec:
  description: VictoriaLogs (LogsQL queries over pod and node logs) for this cluster — read-only
  protocol: STREAMABLE_HTTP
  url: http://mcp-victorialogs.observability.svc.cluster.local:8080/mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: victoriatraces
spec:
  description: VictoriaTraces (distributed traces, service dependencies) for this cluster — read-only
  protocol: STREAMABLE_HTTP
  url: http://mcp-victoriatraces.observability.svc.cluster.local:8081/mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: flux
spec:
  description: Flux Operator MCP (Kustomization / HelmRelease / source status, reconcile history) for this cluster — read-only use only
  protocol: STREAMABLE_HTTP
  url: http://flux-operator-mcp.flux-system.svc.cluster.local:9090/mcp
---
# atlantis-k8s01's servers, reached through the mcp-mesh-import global Services
# (Cluster Mesh). Same tool surface as the local ones; used by the -atlantis
# agent instances.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: victoriametrics-atlantis
spec:
  description: VictoriaMetrics (PromQL queries, alerts, rules, metadata) for atlantis-k8s01 — read-only
  protocol: STREAMABLE_HTTP
  url: http://mcp-victoriametrics-atlantis.observability.svc.cluster.local:8080/mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: victorialogs-atlantis
spec:
  description: VictoriaLogs (LogsQL queries over pod and node logs) for atlantis-k8s01 — read-only
  protocol: STREAMABLE_HTTP
  url: http://mcp-victorialogs-atlantis.observability.svc.cluster.local:8080/mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: flux-atlantis
spec:
  description: Flux Operator MCP (Kustomization / HelmRelease / source status, reconcile history) for atlantis-k8s01 — read-only use only
  protocol: STREAMABLE_HTTP
  url: http://flux-operator-mcp-atlantis.flux-system.svc.cluster.local:9090/mcp
