---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
# ToolHive operator: the front door for the agents' MCP servers. Each backend
# is an MCPServer (a proxy Deployment plus the server), authenticated with the
# run pods' ServiceAccount tokens and authorized per call by the cockpit through
# ToolHive's httpv1 policy hook. Chosen after a spike on fairy (2026-11-01).
#
# Cluster-scoped (the chart default) so the storage-version migrator can keep
# the v1beta1 CRDs' stored versions current across upgrades; a namespace-scoped
# install has to turn it off.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: toolhive-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
