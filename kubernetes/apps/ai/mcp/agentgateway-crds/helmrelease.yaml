---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
# agentgateway's own CRDs (agentgateway.dev): AgentgatewayBackend,
# AgentgatewayModel, AgentgatewayParameters, AgentgatewayPolicy. The Gateway
# API CRDs (v1.6.3 standard) are installed separately and not touched here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: agentgateway-crds
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
