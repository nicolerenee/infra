---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
# agentgateway control plane (Linux Foundation, agentgateway.dev): the front
# door for the agents' MCP servers, replacing ToolHive (decision 2026-11-01).
# It owns GatewayClass `agentgateway` (controllerName
# agentgateway.dev/agentgateway) and creates a proxy Deployment and Service per
# Gateway of that class. Envoy Gateway's classes use a different
# controllerName, so the two controllers don't touch each other's Gateways.
# Every MCP call through it is checked by the cockpit (ExtMcp guardrails); the
# Gateway, routes and policies live with the agents' tools in ai-mcp.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: agentgateway
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    controller:
      replicaCount: 1
      logLevel: info
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
    # No Istio on these clusters: don't grant RBAC for its ServiceEntry and
    # WorkloadEntry types.
    istio:
      enabled: false
