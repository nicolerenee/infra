---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Keep in step with agentgateway-crds (Renovate groups them). Read the
    # release notes and bump deliberately; never automerge.
    tag: v1.7.0
  url: oci://cr.agentgateway.dev/charts/agentgateway
