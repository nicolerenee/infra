---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    # Annotate the VolumeSnapshot CRDs with helm.sh/resource-policy: keep so a
    # Helm uninstall or failed-upgrade remediation can't delete them and, with
    # them, every VolumeSnapshot volsync depends on. Chart >= 5.3.0.
    keepCRDs: true
    controller:
      serviceMonitor:
        create: true
    webhook:
      enabled: false
