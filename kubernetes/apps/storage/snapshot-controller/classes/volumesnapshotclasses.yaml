---
# Pairs with the ceph-block StorageClass (rook-ceph RBD). Used by
# volsync's restic mover to snapshot a PVC before backing it up.
# Add a cephfs class here when that backend needs
# snapshot support.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: csi-ceph-blockpool
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
    # Moved between Flux Kustomizations once; never let the old owner prune it
    # out from under in-flight volsync snapshots.
    kustomize.toolkit.fluxcd.io/prune: disabled
driver: rook-ceph.rbd.csi.ceph.com
deletionPolicy: Delete
parameters:
  clusterID: rook-ceph
  csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
