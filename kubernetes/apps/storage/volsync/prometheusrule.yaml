---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync-rules
spec:
  groups:
    - name: volsync.rules
      rules:
        # Operator gone from target discovery — backups stop without warning.
        - alert: VolsyncComponentAbsent
          expr: |-
            absent(up{job="volsync-metrics"})
          for: 5m
          labels:
            cluster: "${CLUSTER_NAME}"
            severity: critical
          annotations:
            summary: >-
              VolSync operator has disappeared from Prometheus target discovery

        # Specific RS/RD has flagged itself out of sync — most recent run failed.
        - alert: VolsyncVolumeOutOfSync
          expr: |-
            volsync_volume_out_of_sync == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} backup is out of sync

        # Scheduled backup didn't run — usually means the operator is up but
        # missed the trigger window (chart drift, mover stuck, etc.).
        - alert: VolsyncMissedSchedule
          expr: |-
            increase(volsync_missed_intervals_total[1h]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: >-
              VolSync missed a scheduled backup for {{ $labels.obj_namespace }}/{{ $labels.obj_name }}

        # FailedMount messages are not exported as metrics. Catch the mover's
        # wait directly, then use events to distinguish an iSCSI lock from other
        # mount failures. Keep the pod identity so recovery clears the alert.
        - alert: VolsyncMoverContainerCreating
          expr: |-
            max by (cluster, namespace, pod) (
              kube_pod_container_status_waiting_reason{
                pod=~"volsync-.*", reason="ContainerCreating"
              }
            ) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              VolSync mover {{ $labels.namespace }}/{{ $labels.pod }} cannot start
            description: >-
              The mover has remained in ContainerCreating for over 30 minutes.
              Inspect its FailedMount events. If they report "failed to create
              the iSCSI node record" with "context deadline exceeded", inspect
              the assigned node for a stale open-iscsi DB lock using the storage
              runbook. Other mount or container setup failures also trigger this
              alert; the waiting state alone does not prove a stale lock.
