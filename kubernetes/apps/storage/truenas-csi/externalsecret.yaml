---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# TrueNAS API key for the driver (a dedicated, non-expiring key on the NAS
# scoped to the CSI user). Cluster-infra credential, so it lives in the
# cluster-wide GSM store under ${CLUSTER_NAME}-truenas-csi with a single
# `api-key` field; the IAM grant sits next to ghcr-pull's in the private
# tofu.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-cluster
  target:
    name: truenas-csi-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: ${CLUSTER_NAME}-truenas-csi
        property: api-key
