---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.7
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  # A Ceph point-release rolls every daemon (mons -> mgr -> each OSD) one at a
  # time, which takes well over the old 15m — the Helm --wait on CephCluster
  # readiness then timed out mid-upgrade and triggered a rollback.
  timeout: 1h
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      # Never auto-rollback a CephCluster: Ceph cannot downgrade, so rolling
      # back to the prior chart's older Ceph image can never converge — it just
      # thrashes the mons and wedges reconciliation. Hold Failed for a human to
      # fix forward instead.
      retries: 0
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.${CLUSTER_DOMAIN}
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: tailnet
            namespace: gateway-system
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
      dashboard:
        enabled: true
        ssl: false
        urlPrefix: /
        prometheusEndpoint: http://vmsingle-vm.observability.svc.cluster.local:8429
      mgr:
        modules:
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      security:
        cephx:
          # Ceph 20.2.4 added the CVE-2025-30156 CephX audit, which flags every
          # legacy `aes` key. Rotating the daemon keys (mon/mgr/osd/mds/rgw) to
          # aes256k clears the two HEALTH_ERR checks. Bump keyGeneration again
          # to force a future rotation.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            # aes256k on the CSI path needs a Linux 7.0+ kernel on every node to
            # mount existing volumes. Talos is still on the 6.18 series as of
            # v1.14 (6.18.48), so the CSI keys have to stay on aes for now.
            keyType: aes
          # Deliberately NOT setting allowedCiphers: [aes256k] — restricting the
          # cluster to aes256k while the CSI keys are still aes makes the cluster
          # unavailable.
      healthCheck:
        # These four cannot clear until the CSI keys move to aes256k, which is
        # gated on the kernel above. Left unmuted they mask real warnings, and a
        # permanently-warning cluster trains you to ignore `ceph health`.
        # Revisit all of this when Talos ships a 7.0+ kernel.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
      storage:
        encryptedDevice: true
    # default values, remove once I don't need a single node cluster
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          annotations: {}
          labels: {}
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: "Immediate"
          mountOptions: ["discard"]
          allowedTopologies: []
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
