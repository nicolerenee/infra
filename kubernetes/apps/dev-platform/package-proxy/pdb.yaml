---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.37.0/poddisruptionbudget-policy-v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: package-proxy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: package-proxy
      app.kubernetes.io/name: proxy
