---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: package-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: package-proxy
      app.kubernetes.io/name: proxy
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-runs
          matchExpressions:
            - key: cockpit.freckle.dev/run-id
              operator: Exists
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: actions-runner-system
            app.kubernetes.io/component: runner
            actions-ephemeral-runner: 'True'
        # Job-container pods are created separately from the runner pod.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: actions-runner-system
            dev-platform.freckle.tools/package-proxy-client: 'true'
        # Self-hosted Renovate's lookups and lockfile updates (fairy).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: renovate
            app.kubernetes.io/name: renovate
            dev-platform.freckle.tools/package-proxy-client: 'true'
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
          # Expose only package downloads and npm audit. No cache mutation,
          # hosted uploads or unauthenticated admin APIs.
          rules:
            http:
              - method: 'GET|HEAD'
                path: '/(go|npm|pypi)/.*'
              - method: 'GET|HEAD'
                path: '/generic/(github|github-api|github-raw|mise-versions|golang|nodejs|kubernetes|sigstore-tuf)/.*'
              - method: POST
                path: '/npm/-/npm/v1/security/(audits|advisories/bulk|audits/quick)'
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
            app: rook-ceph-rgw
            rook_object_store: ceph-objectstore
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db
            cnpg.io/cluster: pg-18a
      toPorts:
        - ports:
            - port: '5432'
              protocol: TCP
    # Resolve release/CDN redirects at the proxy, without a dependency DNS list.
    # The proxy rejects private/link-local upstreams and redirects by default.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
