---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: package-proxy-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: package-proxy-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROXY_DATABASE_URL: 'postgres://{{ .username }}:{{ .password }}@pg-18a-rw.db.svc.cluster.local:5432/package_proxy?sslmode=require'
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-db-package-proxy-role
