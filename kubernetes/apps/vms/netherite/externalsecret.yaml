---
# Renders netherite's first-boot answer file from GSM, so the account
# passwords (and the user's name) never sit in git. KubeVirt's sysprep
# volume presents this Secret to Windows as a CD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netherite-unattend
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  refreshInterval: 1h
  dataFrom:
    - extract:
        # {"admin_password", "user_name", "user_password"}; alphanumeric
        # passwords, since they're inserted into XML unescaped.
        key: fairy-k8s01-vms-netherite-accounts
  target:
    name: netherite-unattend
    template:
      engineVersion: v2
      data:
        # Windows looks for either name; the content is the same.
        unattend.xml: &unattend |
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
            <settings pass="specialize">
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <ComputerName>NETHERITE</ComputerName>
                <TimeZone>Central Standard Time</TimeZone>
              </component>
              <component name="Microsoft-Windows-Deployment" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <RunSynchronous>
                  <!-- The template blocks BitLocker device encryption too;
                       repeat it in case a future template doesn't. -->
                  <RunSynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Path>reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\BitLocker" /v PreventDeviceEncryption /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                  <!-- The disk is bigger than the template's; C: is the
                       last partition, so it can take the rest. -->
                  <RunSynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Path>powershell.exe -NoProfile -Command "Resize-Partition -DriveLetter C -Size (Get-PartitionSupportedSize -DriveLetter C).SizeMax"</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <Path>reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f</Path>
                  </RunSynchronousCommand>
                  <!-- Firewall group by resource ID, which doesn't depend on
                       the display language. -->
                  <RunSynchronousCommand wcm:action="add">
                    <Order>4</Order>
                    <Path>netsh.exe advfirewall firewall set rule group="@FirewallAPI.dll,-28752" new enable=Yes</Path>
                  </RunSynchronousCommand>
                  <!-- The point of this VM is staying in-game unattended;
                       sleep or hibernate would drop it. -->
                  <RunSynchronousCommand wcm:action="add">
                    <Order>5</Order>
                    <Path>cmd.exe /c "powercfg /change standby-timeout-ac 0 &amp; powercfg /change monitor-timeout-ac 0 &amp; powercfg /hibernate off"</Path>
                  </RunSynchronousCommand>
                </RunSynchronous>
              </component>
            </settings>
            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <ProtectYourPC>3</ProtectYourPC>
                </OOBE>
                <UserAccounts>
                  <LocalAccounts>
                    <!-- Admin rights stay on the alt- account; the
                         everyday user is a plain user. -->
                    <LocalAccount wcm:action="add">
                      <Name>alt-nicole</Name>
                      <Group>Administrators</Group>
                      <Password>
                        <Value>{{ .admin_password }}</Value>
                        <PlainText>true</PlainText>
                      </Password>
                    </LocalAccount>
                    <LocalAccount wcm:action="add">
                      <Name>{{ .user_name }}</Name>
                      <Group>Users</Group>
                      <Password>
                        <Value>{{ .user_password }}</Value>
                        <PlainText>true</PlainText>
                      </Password>
                    </LocalAccount>
                  </LocalAccounts>
                </UserAccounts>
                <!-- One automatic admin logon, to run the commands below
                     that need an existing user. -->
                <AutoLogon>
                  <Enabled>true</Enabled>
                  <LogonCount>1</LogonCount>
                  <Username>alt-nicole</Username>
                  <Password>
                    <Value>{{ .admin_password }}</Value>
                    <PlainText>true</PlainText>
                  </Password>
                </AutoLogon>
                <FirstLogonCommands>
                  <!-- Remote Desktop Users, by SID so the group name's
                       language doesn't matter. -->
                  <SynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <CommandLine>powershell.exe -NoProfile -Command "Add-LocalGroupMember -SID S-1-5-32-555 -Member '{{ .user_name }}'"</CommandLine>
                  </SynchronousCommand>
                  <!-- Sign the admin out so the user's RDP session doesn't
                       have to displace it. -->
                  <SynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <CommandLine>logoff.exe</CommandLine>
                  </SynchronousCommand>
                </FirstLogonCommands>
              </component>
            </settings>
          </unattend>
        autounattend.xml: *unattend
