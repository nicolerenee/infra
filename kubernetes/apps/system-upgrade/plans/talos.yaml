---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
# To pause tuppr on one cluster, add a Flux patch to that cluster's
# tuppr-plans Kustomization (spec.patches) that sets the annotation
#   tuppr.home-operations.com/suspend: "true"
# on this object. Do it in git: an in-cluster `kubectl annotate` is reverted
# by Flux on the next reconcile, and a ${VAR} substitution is re-typed to a
# YAML boolean, which the API rejects for annotations.
metadata:
  name: talos
spec:
  talos:
    version: ${TALOS_VERSION}
  policy:
    placement: hard
    rebootMode: powercycle
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
