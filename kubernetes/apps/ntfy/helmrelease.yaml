---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
  interval: 1h
  values:
    controllers:
      ntfy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Push notifications for the phone, reachable over the tailnet
            # only. Configured entirely through env (no server.yml). Users,
            # tokens and ACLs are declarative: ntfy re-provisions them on every
            # start and deletes provisioned entries that disappear from the
            # config, so tofu stays the source of truth and auth.db holds
            # nothing that can't be rebuilt.
            image:
              repository: mirror.gcr.io/binwiederhier/ntfy
              tag: v2.35.0@sha256:6f0c9abab7b99a978d816611cc90dabb4849b81f60c53114e91cd07931085dc0
            args: ["serve"]
            env:
              TZ: America/Chicago
              NTFY_BASE_URL: https://ntfy.${CLUSTER_SUBDOMAIN}.freckle.tools
              NTFY_LISTEN_HTTP: ":8080"
              NTFY_BEHIND_PROXY: "true"
              NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
              # Long enough that a phone off the tailnet for a weekend still
              # gets what it missed when it reconnects.
              NTFY_CACHE_DURATION: 72h
              NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
              # Nothing is readable or writable without an account, so topic
              # names don't need to be secret.
              NTFY_AUTH_DEFAULT_ACCESS: deny-all
              NTFY_ENABLE_LOGIN: "true"
              NTFY_ENABLE_SIGNUP: "false"
              # cockpit publishes, nicole (the phone) reads. alt-nicole is the
              # admin and needs no entries.
              NTFY_AUTH_ACCESS: nicole:cockpit:ro,cockpit:cockpit:wo
              # No upstream-base-url: nothing leaves the cluster, not even
              # the poll requests ntfy.sh would relay to Apple for instant
              # iOS delivery.
            envFrom:
              - secretRef:
                  name: ntfy-auth
            ports:
              - containerPort: &port 8080
                name: http
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: ntfy
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          http:
            port: &svcport 80
            targetPort: *port
    route:
      app:
        hostnames: ["ntfy.${CLUSTER_SUBDOMAIN}.freckle.tools"]
        parentRefs:
          - name: tailnet
            namespace: gateway-system
        rules:
          - backendRefs:
              - identifier: app
                port: *svcport
    persistence:
      # Message cache and the user database. No backups: the cache is
      # short-lived and every user, token and ACL is re-provisioned from tofu.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /var/lib/ntfy
      tmp:
        type: emptyDir
