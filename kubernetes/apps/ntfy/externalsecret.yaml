---
# Declared users (bcrypt hashes) and access tokens, generated by tofu in
# ntfy's own comma-separated env format. Only these two fields come over: the
# plaintext login passwords in the same GSM secret are for people, not the pod.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: ntfy-auth
    creationPolicy: Owner
  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: ${CLUSTER_NAME}-ntfy-auth
        property: NTFY_AUTH_USERS
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: ${CLUSTER_NAME}-ntfy-auth
        property: NTFY_AUTH_TOKENS
