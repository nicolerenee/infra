---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: onepassword-connect
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Hold below 2.3.0: from 2.3.0 the chart mounts op-credentials as a file
    # and expects raw JSON in it, but bootstrap/setup-1password.sh stores the
    # base64-encoded JSON that the env-var mode (OP_SESSION=<contents>) needs.
    # Moving on means re-creating that secret in the same rollout.
    tag: 2.2.1
  # Upstream publishes the chart to GHCR since 2.1.1 (unsigned, so no verify).
  url: oci://ghcr.io/1password/connect
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: onepassword-connect
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    connect:
      api:
        serviceMonitor:
          enabled: true
      serviceType: ClusterIP
