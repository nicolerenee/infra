---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Mealie
        POSTGRES_DB: mealie
        POSTGRES_SERVER: pg-17a-rw.db.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_PASSWORD: "{{ .MEALIE_POSTGRES_PASS }}"
        POSTGRES_USER: "{{ .MEALIE_POSTGRES_USER }}"
        SMTP_PASSWORD: "{{ .MEALIE_SMTP_PASS }}"
        OPENAI_API_KEY: "{{ .MEALIE_OPENAI_API_KEY }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: mealie
        INIT_POSTGRES_HOST: pg-17a-rw.db.svc.cluster.local
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_PASS: "{{ .MEALIE_POSTGRES_PASS }}"
        INIT_POSTGRES_USER: "{{ .MEALIE_POSTGRES_USER }}"
  dataFrom:
    - extract:
        key: mealie-fairy-k8s01
    - extract:
        key: pg-17a-fairy-k8s01
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Freckle ID (pocket-id) OIDC client. Lives in GSM rather than 1Password, so
# it needs its own ExternalSecret against the namespace's gcp-sm store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        OIDC_CLIENT_ID: '{{ index . "client-id" }}'
        OIDC_CLIENT_SECRET: '{{ index . "client-secret" }}'
  dataFrom:
    - extract:
        key: fairy-k8s01-mealie-oidc
