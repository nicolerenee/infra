---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
spec:
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-mealie-app
        version: "1"
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: mealie
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        POSTGRES_DB: mealie
        POSTGRES_SERVER: pg-18a-rw.db.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        SMTP_PASSWORD: "{{ .smtp_password }}"
        OPENAI_API_KEY: "{{ .openai_api_key }}"
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Freckle ID (pocket-id) OIDC client. Lives in GSM rather than 1Password, so
# it needs its own ExternalSecret against the namespace's gcp-sm store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        OIDC_CLIENT_ID: '{{ index . "client-id" }}'
        OIDC_CLIENT_SECRET: '{{ index . "client-secret" }}'
  dataFrom:
    - extract:
        key: fairy-k8s01-mealie-oidc
