---
# harvest.freckle.tools on the internal gateway (docs/networking/domains.md:
# human-facing, not tied to one environment). The page shows personal comp
# data and the app has no auth of its own, so the SecurityPolicy in oidc.yaml
# is the access control — it must exist before this route does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harvest
spec:
  hostnames:
    - harvest.freckle.tools
  parentRefs:
    - name: internal
      namespace: gateway-system
  rules:
    - backendRefs:
        - kind: Service
          name: harvest
          port: 8080
