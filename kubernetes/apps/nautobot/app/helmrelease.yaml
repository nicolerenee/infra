---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nautobot
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: nautobot
    namespace: nautobot
  maxHistory: 2
  install:
    # 10m (up from Helm's 5m default) so the migration hook Job has time to
    # run all database migrations on a fresh install.
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    # 20m, and deliberately NOT rolled back on failure.
    #
    # Migrations do NOT run in a hook Job — that only happens with
    # `nautobot.singleInit: true`, which we do not set. They run in the web
    # Deployment's `nautobot-init` init container, so the Helm timeout races
    # the Deployment's own progressDeadlineSeconds (k8s default 600s = the old
    # 10m here). Nautobot 3.2.x migrations are irreversible — dcim/0090 drops
    # 30 columns — so a timeout that triggered Flux's default `rollback`
    # remediation would put the 3.1.x image back in front of an already-migrated
    # schema, which fails every cable/interface query. That is a self-inflicted
    # outage, and rolling forward is the only real recovery.
    #
    # retries: 0 so a slow migration is reported as a stuck HelmRelease we can
    # look at, rather than silently reverted three times.
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 0
  uninstall:
    keepHistory: false
  values:
    # Fixed resource names so the HTTPRoute backend and in-cluster DNS are
    # predictable (web Service becomes `nautobot-default`).
    fullnameOverride: nautobot

    # Bundled datastores off — we bring our own CNPG Postgres and Dragonfly.
    postgresql:
      enabled: false
    redis:
      enabled: false

    nautobot:
      # Chart 3.1.2's appVersion pins the image to 3.0 — override to the latest
      # Nautobot 3.1.8, pulled from GHCR and pinned by digest.
      image:
        registry: ghcr.io
        repository: nautobot/nautobot
        tag: "3.1.8@sha256:a8f89c28c6d4585c294d690e3bf4c4e2543d47cf81fd07bf02b2f4e73e959d95"

      # Single web replica for a homelab DCIM; Celery worker + beat run as
      # their own deployments (chart defaults). Uploaded media (device-type
      # images, attachments) lives on a shared ceph-filesystem RWX PVC so it
      # survives restarts and stays consistent if the web tier scales out.
      # Static files are collected at container start (ephemeral); Git
      # datasource repos use the chart's default emptyDir and re-sync from
      # remote. Everything else is in Postgres.
      replicaCount: 1
      persistenceMediaFiles:
        enabled: true
        storageClassName: ceph-filesystem
        accessMode: ReadWriteMany
        size: 5Gi

      # The web pod's liveness probe runs `nautobot-server health_check`, which
      # cold-boots all of Nautobot each time (~1 core for ~10s). At the chart's
      # 1-core limit + 15s period that pegged the pod near a full core at idle
      # and left no headroom, so any extra CPU pressure timed the probe out and
      # crash-looped it. Give it 2 cores and halve the probe cadence (detection
      # still ~90s at failureThreshold 3). Merges over the chart's probe (keeps
      # enabled + exec command).
      resources:
        requests:
          cpu: "500m"
          memory: "1280M"
        limits:
          cpu: "2"
          memory: "8704M"
      livenessProbe:
        periodSeconds: 30
        timeoutSeconds: 20

      # Space-separated string (NAUTOBOT_ALLOWED_HOSTS). Left as "*" — the only
      # ingress path is the private tailnet gateway, and scoping it risks
      # rejecting the chart's in-pod health probes.
      allowedHosts: "*"

      db:
        engine: django.db.backends.postgresql
        # CNPG's read-write Service for the primary.
        host: nautobot-db-rw.nautobot.svc
        port: 5432
        name: nautobot
        existingSecret: nautobot-db-app-role
        existingSecretUsernameKey: username
        existingSecretPasswordKey: password

      redis:
        host: nautobot-queue.nautobot.svc
        port: 6379
        ssl: false
        existingSecret: nautobot-queue-secrets
        existingSecretPasswordKey: password

      django:
        existingSecret: nautobot-secrets
        existingSecretSecretKeyKey: secret-key

      # Superuser bootstrap OFF — access is SSO-only now. Leaving this enabled
      # would re-create/reset the local `admin` account on every upgrade,
      # undoing the manual deactivation. Admin rights come from the
      # nautobot_super_admins group via SSO group_sync. Deactivate (don't
      # delete) the existing `admin` user in the UI to kill local login; it
      # stays reactivatable as break-glass. The superuser GSM secrets remain
      # but are now unused.
      superUser:
        enabled: false

      # nautobot.metrics (NAUTOBOT_METRICS_ENABLED) defaults to true — the
      # Prometheus endpoint is already exposed; no override needed.

      # OIDC client credentials for the generic python-social-auth backend.
      # Read by the supplemental config below via os.environ.
      extraEnvVars:
        - name: NAUTOBOT_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nautobot-secrets
              key: client-id
        - name: NAUTOBOT_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nautobot-secrets
              key: client-secret

      # SSO group sync. Nautobot core reads these NAUTOBOT_SSO_* env vars at
      # settings-import time: it appends group_sync to SOCIAL_AUTH_PIPELINE,
      # which reads the `groups` claim, auto-creates the matching Nautobot
      # groups, and sets is_staff/is_superuser from the lists below. Non-secret,
      # so plain extraVars (applied to all pods for consistent settings).
      extraVars:
        - name: NAUTOBOT_SSO_ENABLE_GROUP_SYNC
          value: "true"
        - name: NAUTOBOT_SSO_CLAIMS_GROUP
          value: "groups"
        - name: NAUTOBOT_SSO_STAFF_GROUPS
          value: "nautobot_admins,nautobot_super_admins"
        - name: NAUTOBOT_SSO_SUPERUSER_GROUPS
          value: "nautobot_super_admins"

      # Full nautobot_config.py — setting this REPLACES the image's default
      # config file entirely (the chart mounts it over /opt/nautobot/
      # nautobot_config.py), so it must reproduce the image default's active
      # lines first. The critical one is `from nautobot.core.settings import *`,
      # which builds GIT_ROOT/DATABASES/CACHES/etc. from the NAUTOBOT_* env vars
      # the chart injects. We then append the Freckle ID (pocket-id) SSO wiring:
      # python-social-auth generic OIDC backend (name "oidc" -> SOCIAL_AUTH_OIDC_*),
      # with group sync driven by the NAUTOBOT_SSO_* extraVars above.
      config: |
        import os
        import sys

        from nautobot.core.settings import *  # noqa: F401,F403
        from nautobot.core.settings_funcs import is_truthy, parse_redis_connection

        if DATABASES["default"]["ENGINE"].endswith("mysql"):
            DATABASES["default"]["OPTIONS"] = {"charset": "utf8mb4"}

        SECRET_KEY = os.getenv("NAUTOBOT_SECRET_KEY", "")

        # Install/usage reporting off (image default is on).
        INSTALLATION_METRICS_ENABLED = False

        # --- HTTPS hardening (clears Django deploy warnings W004/W008/W012/W016) ---
        # Nautobot runs behind the TLS-terminating tailnet gateway; Envoy sets
        # X-Forwarded-Proto, so trust it to tell Django the request is secure —
        # required for the secure-cookie / redirect / HSTS logic below to work
        # (and to avoid a redirect loop with SECURE_SSL_REDIRECT).
        SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
        SESSION_COOKIE_SECURE = True
        CSRF_COOKIE_SECURE = True
        # App-level HTTP->HTTPS redirect stays OFF: the tailnet gateway is the
        # only ingress and serves HTTPS exclusively, so external requests always
        # arrive with X-Forwarded-Proto=https and would never be redirected
        # anyway. The redirect only ever fired for header-less *in-cluster*
        # clients (readiness probe, service-to-service API callers like dcim-ui),
        # 301-ing them to an HTTPS URL whose cert doesn't cover the internal
        # service name — friction with no security benefit. TLS enforcement lives
        # at the gateway; secure cookies + HSTS below still apply.
        SECURE_SSL_REDIRECT = False
        SECURE_HSTS_SECONDS = 31536000  # 1 year
        SECURE_HSTS_INCLUDE_SUBDOMAINS = True

        # --- Freckle ID (pocket-id) SSO ---
        AUTHENTICATION_BACKENDS = [
            "social_core.backends.open_id_connect.OpenIdConnectAuth",
            "nautobot.core.authentication.ObjectPermissionBackend",
        ]
        SOCIAL_AUTH_OIDC_OIDC_ENDPOINT = "https://freckle.id"
        SOCIAL_AUTH_OIDC_KEY = os.environ.get("NAUTOBOT_OIDC_CLIENT_ID", "")
        SOCIAL_AUTH_OIDC_SECRET = os.environ.get("NAUTOBOT_OIDC_CLIENT_SECRET", "")
        # The pocket-id client requires PKCE. The generic OIDC backend supports
        # it (BaseOAuth2PKCE) but defaults off, so enable it (S256 by default).
        SOCIAL_AUTH_OIDC_USE_PKCE = True
        # Store social-auth extra_data as a real JSONField (Postgres).
        SOCIAL_AUTH_JSONFIELD_ENABLED = True
        # Request the `groups` scope so pocket-id includes the user's group
        # memberships in the token; group sync (NAUTOBOT_SSO_* extraVars) maps
        # them to Nautobot groups + staff/superuser. Deliberately no
        # EXTERNAL_AUTH_DEFAULT_GROUPS — it required a pre-existing group and
        # logged "Group not found"; membership now comes from the claim.
        SOCIAL_AUTH_OIDC_SCOPE = ["groups"]

        # pocket-id returns ALL of a user's groups in the `groups` claim, and the
        # stock nautobot.extras.group_sync.group_sync creates every one of them —
        # cluttering Nautobot with unrelated groups (jellyfin_users, sysadmins,
        # ...). Replace that pipeline step with a prefix-filtered version so only
        # nautobot_* groups sync and drive is_staff/is_superuser. (This module,
        # nautobot_config, is importable by dotted path — /opt/nautobot is on
        # sys.path — so the pipeline can reference the function below.)
        def nautobot_group_sync(uid, user=None, response=None, *args, **kwargs):
            from django.contrib.auth.models import Group

            if not (user and response):
                return
            groups = [g for g in (response.get(SSO_CLAIMS_GROUP) or []) if g.startswith("nautobot_")]
            user.groups.set([Group.objects.get_or_create(name=g)[0].id for g in groups])
            user.is_superuser = any(g in SSO_SUPERUSER_GROUPS for g in groups)
            user.is_staff = any(g in SSO_STAFF_GROUPS for g in groups)
            user.save()

        SOCIAL_AUTH_PIPELINE = tuple(
            "nautobot_config.nautobot_group_sync"
            if step == "nautobot.extras.group_sync.group_sync"
            else step
            for step in SOCIAL_AUTH_PIPELINE
        )
