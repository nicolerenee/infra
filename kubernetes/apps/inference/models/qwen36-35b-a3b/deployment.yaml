---
# Qwen3.6-35B-A3B-FP8 served by vLLM, single-node (tp=1) per GB10. Scaled to a
# single replica: two of the three DGX nodes are now claimed by the 2-node
# minimax-m27-nvfp4 LeaderWorkerSet, leaving exactly one node for Qwen. No
# longer an HA pair — a node loss takes Qwen down until it reschedules. The
# one-pod-per-node podAntiAffinity is retained so that if this is scaled back
# up (once GPUs free), replicas still spread across distinct DGX nodes.
# RollingUpdate keeps maxSurge/maxUnavailable so a scale-up rollout never wedges
# when all DGX nodes are occupied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-35b-a3b
spec:
  replicas: 1
  # Default is 600s, which the first rollout on a node would blow through: the
  # init container has to pull ~35Gi off CephFS before vLLM even starts, and the
  # startupProbe then allows another 30m. Flux health-checks this Deployment
  # (wait: true) and kstatus treats ProgressDeadlineExceeded as failed, so the
  # default would fail the Kustomization on a cold node while the sync was still
  # legitimately running. Aligned with the pointer KS's own 30m timeout.
  progressDeadlineSeconds: 1800
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen36-35b-a3b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen36-35b-a3b
    spec:
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          # One pod per node — keeps the HA pair (and the rolling-surge pod)
          # on distinct DGX nodes so a node loss never takes both down.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: qwen36-35b-a3b
              topologyKey: kubernetes.io/hostname
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu
      initContainers:
        # Cache the checkpoint from CephFS to node-local NVMe before vLLM starts,
        # same pattern as the minimax LeaderWorkerSet. --copy-links dereferences
        # the HF-cache symlinks so the local copy is self-contained; scoped to the
        # Qwen dir (the `models` PVC is shared with minimax + gpt-oss) and excludes
        # blobs/ because the deref'd snapshot already carries that data — without
        # the exclude this would land ~70Gi instead of ~35Gi. hostPath persists
        # across pod restarts, so only the first pod on a node pays the full sync
        # and later ones re-sync incrementally.
        #
        # This also removes the reason vLLM logged "Auto-prefetch is disabled
        # because the filesystem (CEPH) is not a recognized network FS": weights
        # are read from local NVMe now, so the prefetch heuristic is moot. Forcing
        # --safetensors-load-strategy=prefetch instead would have been the wrong
        # fix on GB10, where page cache and "GPU" memory are the same pool.
        - name: cache-models
          image: mirror.gcr.io/rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
          command:
            - rclone
            - sync
            - /ceph-models/hub/models--Qwen--Qwen3.6-35B-A3B-FP8/
            - /models/hub/models--Qwen--Qwen3.6-35B-A3B-FP8/
            - --copy-links
            - --exclude
            - blobs/**
            - --transfers
            - "8"
            - --checkers
            - "16"
            # One-line stats each minute instead of --progress (which floods
            # non-TTY pod logs with continuous progress redraws).
            - --stats
            - 1m
            - --stats-one-line
          volumeMounts:
            - name: ceph-models
              mountPath: /ceph-models
              readOnly: true
            - name: local-models
              mountPath: /models
      containers:
        - name: vllm
          # CUDA-13 default, Ubuntu 24.04, via the GCR pull-through mirror (avoids
          # Docker Hub rate limits). The Responses-API parser handles codex's
          # multi-turn tool loop, so this one deploy serves brain chat AND coding.
          # NOT the older v0.20 (its /responses couldn't parse tool results).
          image: mirror.gcr.io/vllm/vllm-openai:v0.26.0-aarch64-ubuntu2404
          command:
            - vllm
            - serve
            - Qwen/Qwen3.6-35B-A3B-FP8
            # Canonical ids only. The semantic names (chat/fast/…) live in the
            # AI gateway, which rewrites to qwen3.6-35b-a3b on egress.
            - --served-model-name
            - Qwen/Qwen3.6-35B-A3B-FP8
            - qwen3.6-35b-a3b
            - --tensor-parallel-size
            - "1"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "20"
            - --max-num-batched-tokens
            - "32768"
            - --gpu-memory-utilization
            - "0.7069"
            - --attention-backend
            - flashinfer
            - --enable-prefix-caching
            # Surface per-request prefix-cache hits in usage.prompt_tokens_details
            # (cached_tokens); off by default. Serving-layer only, no perf impact.
            - --enable-prompt-tokens-details
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            # qwen3_xml matches the native XML tool format the froggeric template
            # emits (the default template + qwen3_coder can't parse codex's calls).
            - qwen3_xml
            # Vendored froggeric fixed template (see chat_template.jinja): tolerates
            # the developer/tool roles + arbitrary system placement that the OpenAI
            # Responses API (codex) sends, while staying correct for brain chat.
            - --chat-template
            - /config/chat_template.jinja
            # Qwen recommends preserving thinking across turns for agentic loops;
            # froggeric honors this kwarg (defaults true anyway).
            - --default-chat-template-kwargs
            - '{"preserve_thinking": true}'
            # MTP speculative decoding: the method is built into this checkpoint
            # (no separate draft model needed). Worked fine on the prior v0.20
            # image; re-enabled on v0.24 after the consolidation validated
            # without it.
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":1}'
            - --trust-remote-code
          env:
            - name: HF_HOME
              value: /models
            # Weights are pre-staged on CephFS and cached to node-local NVMe by
            # the init container; never reach HF at serve time
            # (egress is locked — see cnp.yaml). Offline + no telemetry.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: CUDA_MANAGED_FORCE_DEVICE_ALLOC
              value: "1"
            - name: OMP_NUM_THREADS
              value: "4"
            - name: VLLM_MARLIN_USE_ATOMIC_ADD
              value: "1"
            # v0.24 defaults to DeepGEMM for FP8 MoE and asserts "Unknown SF
            # transformation" on this checkpoint's scale-factor layout; force the
            # Marlin/Triton path (VLLM_MARLIN_USE_ATOMIC_ADD above) instead.
            - name: VLLM_USE_DEEP_GEMM
              value: "0"
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            # Long — covers vLLM's load from node-local NVMe (the CephFS->local
            # sync happens in the init container, before this probe starts) plus
            # torch.compile and cudagraph capture.
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            claims:
              - name: gpu
          volumeMounts:
            # HF_HOME points here; this is the node-local NVMe cache the init
            # container populated, not the CephFS PVC.
            - name: local-models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: chat-template
              mountPath: /config
              readOnly: true
      volumes:
        # Source: shared models PVC on CephFS (read-only; the init copies out of it).
        - name: ceph-models
          persistentVolumeClaim:
            claimName: models
            readOnly: true
        # Dest: node-local NVMe cache. hostPath persists across pod restarts so the
        # CephFS sync is a one-time-per-node cost; vLLM reads weights from here.
        - name: local-models
          hostPath:
            path: /var/local/inference-models
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        # Content-hashed by kustomize's configMapGenerator, so editing the template
        # rolls the Deployment automatically.
        - name: chat-template
          configMap:
            name: qwen36-chat-template
