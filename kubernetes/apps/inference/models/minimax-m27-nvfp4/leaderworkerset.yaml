---
# MiniMax-M2.7 (NVFP4) served by vLLM across 2 DGX nodes as a single
# tensor-parallel replica (tp=2, one GB10 per rank). Adapted from the
# spark-arena/eugr NVFP4 recipe (github.com/eugr/spark-vllm-docker). Two
# deliberate deviations:
#   1. Model is nvidia/MiniMax-M2.7-NVFP4 (230B MoE, 10B active, NVFP4) — vLLM
#      auto-detects the modelopt/NVFP4 quantization, so no explicit --quantization.
#   2. Multi-node launch uses vLLM's NATIVE distributed backend over a
#      LeaderWorkerSet (--nnodes/--node-rank/--master-addr), not the recipe's
#      Ray backend — this matches the proven gpt-oss 2-node pattern here and
#      avoids standing up a separate Ray cluster.
# Runs on the upstream multi-arch vllm/vllm-openai release image. v0.24.0
# LOADED this model but HUNG during multi-node generation (the sample_tokens
# RPC to the TP worker timed out, shm_broadcast 60s → EngineDeadError → 500s),
# so it ran on eugr's spark-vllm build until 0.32.0, which Flash-Next proved on
# these nodes first. If generation hangs that way again, that's the regression
# to look for. The rclone init container below caches the checkpoint to node-local
# NVMe before vLLM starts, so the slow (Firewalla-routed) CephFS read happens
# once per node in a plain copy and vLLM loads from fast local disk.
# --load-format instanttensor is REQUIRED on these 128GB *unified*-memory GB10
# nodes (host + GPU share one pool): it streams weights straight to the GPU with
# ~no host-side residual, so the MoE kernel autotuner + KV reservation
# (gpu-mem-util 0.85) still fit. The alternatives OOM — fastsafetensors buffers
# the full model in host RAM during load (exit 137 at load), and the default
# mmap loader leaves weight pages in host page cache that collide with the GPU
# autotuner workspace (exit 137 during flashinfer trtllm::fused_moe tuning).
# Weights are pre-staged on CephFS by the download job; served fully offline
# (HF_HUB_OFFLINE=1), no HF secret — egress locked in cnp.yaml.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: minimax-m27-nvfp4
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: minimax-m27-nvfp4
          app.kubernetes.io/component: leader
      spec:
        runtimeClassName: nvidia
        # Keep both ranks of this tensor-parallel pair on the same power feed
        # (topology.freckle.systems/power-feed = pdu01 or pdu02, from the Talos node config):
        # a single UPS/PDU event then takes the whole model down or not at
        # all, instead of leaving one rank up and the set wedged. Preferred,
        # not required, so an odd number of free Sparks still schedules.
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: topology.freckle.systems/power-feed
                  labelSelector:
                    matchLabels:
                      leaderworkerset.sigs.k8s.io/name: minimax-m27-nvfp4
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        initContainers:
          # Cache the checkpoint from CephFS to node-local NVMe before vLLM starts.
          # -L dereferences the HF-cache symlinks so the local copy is
          # self-contained; scoped to the minimax dir (the `models` PVC is shared
          # with qwen + gpt-oss) and excludes blobs/ since the deref'd snapshot
          # already holds the data (avoids a 2x copy). hostPath persists across
          # RecreateGroupOnPodRestart, so restarts re-sync incrementally (fast).
          - name: cache-models
            image: mirror.gcr.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - rclone
              - sync
              - /ceph-models/hub/models--nvidia--MiniMax-M2.7-NVFP4/
              - /models/hub/models--nvidia--MiniMax-M2.7-NVFP4/
              - --copy-links
              - --exclude
              - blobs/**
              - --transfers
              - "8"
              - --checkers
              - "16"
              # One-line stats each minute instead of --progress (which floods
              # non-TTY pod logs with continuous progress redraws).
              - --stats
              - 1m
              - --stats-one-line
            resources:
              requests:
                memory: 1Gi
              limits:
                memory: 112Gi
            volumeMounts:
              - name: ceph-models
                mountPath: /ceph-models
                readOnly: true
              - name: local-models
                mountPath: /models
        containers:
          - name: vllm
            # Upstream vLLM 0.32.0 (multi-arch index digest; see header for the
            # v0.24.0 history). Loads from the local NVMe cache.
            image: mirror.gcr.io/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
            command:
              - bash
              - -c
              - |
                vllm serve nvidia/MiniMax-M2.7-NVFP4 \
                  --served-model-name nvidia/MiniMax-M2.7-NVFP4 minimax-m2.7 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --gpu-memory-utilization 0.80 \
                  --max-model-len 196608 \
                  --load-format instanttensor \
                  --enable-auto-tool-choice \
                  --tool-call-parser minimax_m2 \
                  --reasoning-parser minimax_m2 \
                  --enable-prompt-tokens-details \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr $${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --host 0.0.0.0 \
                  --port 8000
            env:
              - name: HF_HOME
                value: /models
              # Weights pre-staged on CephFS (/models/hub); never reach HF at
              # serve time (egress is locked — see cnp.yaml).
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: DO_NOT_TRACK
                value: "1"
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: expandable_segments:True
              # NCCL: use RDMA over the ConnectX-7 fabric (dranet gpu-rdma claim).
              - name: NCCL_IB_HCA
                value: mlx5
              - name: NCCL_NET_GDR_LEVEL
                value: "2"
              # DSCP 26 + ECT(0): lets r01-fsw01 ECN-mark RoCE instead of dropping it.
              - name: NCCL_IB_TC
                value: "106"
              # RoCEv2. The fabric ports carry only IPv6 link-local GIDs (index 0
              # = RoCEv1, 1 = RoCEv2), and NCCL's automatic choice skips link-local
              # and stays on RoCEv1, which has no IP header for ECN. A 4-into-1
              # perftest incast ran at 12 Gb/s on RoCEv1 vs 195 Gb/s on RoCEv2.
              - name: NCCL_IB_GID_INDEX
                value: "1"
              # Force the Marlin/Triton path for the NVFP4 MoE kernels (matches
              # the spark-arena NVFP4 recipe + the qwen deploy). Without it, v0.24
              # can pick a DeepGEMM path that asserts on some FP8/FP4 checkpoints.
              - name: VLLM_MARLIN_USE_ATOMIC_ADD
                value: "1"
            ports:
              - containerPort: 8000
                name: http
              - containerPort: 29500
                name: dist-coord
            startupProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              # Long — covers the vLLM load from node-local NVMe (the CephFS→local
              # rclone sync runs first as an initContainer) + torch.compile +
              # cudagraph capture. The startup-probe clock starts after init.
              failureThreshold: 360
            livenessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
              # Limits on every container give the pod a memory.max, which Talos's
              # OOM controller never selects. GPU memory isn't charged here.
              requests:
                memory: 16Gi
              limits:
                memory: 112Gi
            volumeMounts:
              - name: local-models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes:
          # Source: shared models PVC on CephFS (read-only; init copies out of it).
          - name: ceph-models
            persistentVolumeClaim:
              claimName: models
              readOnly: true
          # Dest: node-local NVMe cache. hostPath persists across pod restarts so
          # the CephFS sync is a one-time-per-node cost; vLLM reads weights here.
          - name: local-models
            hostPath:
              path: /var/local/inference-models
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: minimax-m27-nvfp4
          app.kubernetes.io/component: worker
      spec:
        runtimeClassName: nvidia
        # Keep both ranks of this tensor-parallel pair on the same power feed
        # (topology.freckle.systems/power-feed = pdu01 or pdu02, from the Talos node config):
        # a single UPS/PDU event then takes the whole model down or not at
        # all, instead of leaving one rank up and the set wedged. Preferred,
        # not required, so an odd number of free Sparks still schedules.
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: topology.freckle.systems/power-feed
                  labelSelector:
                    matchLabels:
                      leaderworkerset.sigs.k8s.io/name: minimax-m27-nvfp4
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        initContainers:
          # Cache the checkpoint from CephFS to node-local NVMe before vLLM starts.
          # -L dereferences the HF-cache symlinks so the local copy is
          # self-contained; scoped to the minimax dir (the `models` PVC is shared
          # with qwen + gpt-oss) and excludes blobs/ since the deref'd snapshot
          # already holds the data (avoids a 2x copy). hostPath persists across
          # RecreateGroupOnPodRestart, so restarts re-sync incrementally (fast).
          - name: cache-models
            image: mirror.gcr.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - rclone
              - sync
              - /ceph-models/hub/models--nvidia--MiniMax-M2.7-NVFP4/
              - /models/hub/models--nvidia--MiniMax-M2.7-NVFP4/
              - --copy-links
              - --exclude
              - blobs/**
              - --transfers
              - "8"
              - --checkers
              - "16"
              # One-line stats each minute instead of --progress (which floods
              # non-TTY pod logs with continuous progress redraws).
              - --stats
              - 1m
              - --stats-one-line
            resources:
              requests:
                memory: 1Gi
              limits:
                memory: 112Gi
            volumeMounts:
              - name: ceph-models
                mountPath: /ceph-models
                readOnly: true
              - name: local-models
                mountPath: /models
        containers:
          - name: vllm
            # Same image as the leader. Digest-pinned.
            image: mirror.gcr.io/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
            command:
              - bash
              - -c
              - |
                vllm serve nvidia/MiniMax-M2.7-NVFP4 \
                  --served-model-name nvidia/MiniMax-M2.7-NVFP4 minimax-m2.7 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --gpu-memory-utilization 0.80 \
                  --max-model-len 196608 \
                  --load-format instanttensor \
                  --enable-auto-tool-choice \
                  --tool-call-parser minimax_m2 \
                  --reasoning-parser minimax_m2 \
                  --enable-prompt-tokens-details \
                  --nnodes 2 \
                  --node-rank 1 \
                  --master-addr $${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --headless \
                  --host 0.0.0.0 \
                  --port 8000
            env:
              - name: HF_HOME
                value: /models
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: DO_NOT_TRACK
                value: "1"
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: expandable_segments:True
              - name: NCCL_IB_HCA
                value: mlx5
              - name: NCCL_NET_GDR_LEVEL
                value: "2"
              - name: NCCL_IB_TC
                value: "106"
              # RoCEv2. The fabric ports carry only IPv6 link-local GIDs (index 0
              # = RoCEv1, 1 = RoCEv2), and NCCL's automatic choice skips link-local
              # and stays on RoCEv1, which has no IP header for ECN. A 4-into-1
              # perftest incast ran at 12 Gb/s on RoCEv1 vs 195 Gb/s on RoCEv2.
              - name: NCCL_IB_GID_INDEX
                value: "1"
              # Force the Marlin/Triton path for the NVFP4 MoE kernels (matches
              # the spark-arena NVFP4 recipe + the qwen deploy). Without it, v0.24
              # can pick a DeepGEMM path that asserts on some FP8/FP4 checkpoints.
              - name: VLLM_MARLIN_USE_ATOMIC_ADD
                value: "1"
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
              # Limits on every container give the pod a memory.max, which Talos's
              # OOM controller never selects. GPU memory isn't charged here.
              requests:
                memory: 16Gi
              limits:
                memory: 112Gi
            volumeMounts:
              - name: local-models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes:
          # Source: shared models PVC on CephFS (read-only; init copies out of it).
          - name: ceph-models
            persistentVolumeClaim:
              claimName: models
              readOnly: true
          # Dest: node-local NVMe cache. hostPath persists across pod restarts so
          # the CephFS sync is a one-time-per-node cost; vLLM reads weights here.
          - name: local-models
            hostPath:
              path: /var/local/inference-models
              type: DirectoryOrCreate
