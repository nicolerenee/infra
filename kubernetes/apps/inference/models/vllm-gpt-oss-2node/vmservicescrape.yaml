---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vllm-gpt-oss-2node
spec:
  endpoints:
    - interval: 30s
      port: http
      path: /metrics
      # vllm:cache_config_info carries 40+ labels (one per cache setting),
      # above vmsingle's default per-series limit, so every scrape logged a
      # rejected row. It is a config dump, not a signal; drop it at scrape time.
      metricRelabelConfigs:
        - sourceLabels: [__name__]
          regex: "vllm:cache_config_info"
          action: drop
      relabelConfigs:
        - targetLabel: vllm_deployment
          replacement: vllm-gpt-oss-2node
  namespaceSelector:
    matchNames:
      - inference
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-gpt-oss-2node
