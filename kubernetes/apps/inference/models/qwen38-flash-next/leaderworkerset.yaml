---
# Qwen3.8-Flash-Next (NVIDIA NVFP4 build: 125B MoE, 6B active, ~124 GiB) served
# by vLLM across 2 DGX Sparks as one tensor-parallel + expert-parallel replica.
# Flags follow the MiaAI-Lab dual-Spark recipe that the NVIDIA-forum 2x Spark
# write-up ran (TP2+EP, allgather_reducescatter all2all, native MTP k=3, 262K
# context, 16 seqs, 8192 batched tokens, GMU 0.80). Deviations from that recipe:
#   - eugr's spark-vllm image (which now carries the Qwen3.8 patch series) instead
#     of the day-0 NVIDIA image + bind-mounted patches — Talos has no Docker.
#   - KV cache left at `auto` (bf16): fp8 KV needs the recipe's QSA attention
#     patch and it is unknown whether eugr's build includes it. Revisit.
#   - torch.compile OFF + decode-only CUDA graphs (the recipe's
#     compilation-config): with the default FULL_AND_PIECEWISE compile the
#     worker rank sat for 40+ minutes after model load and never came up, twice.
#     With this it is Ready in ~7 min. data-mode encoder TP, bf16 SSM cache and
#     explicit chunked prefill are the recipe's other launch flags.
#   - vLLM's native multi-node launch over a LeaderWorkerSet, same as minimax.
#   - GMU 0.80 (the forum write-up backed off to 0.78 on Ubuntu hosts that also
#     run a desktop; Talos leaves ~12 GiB free per rank at 0.78 with compile
#     off). The 650 MB-free hang seen on the first attempt was torch.compile,
#     not the reservation. The second init container evicts the freshly
#     rclone'd checkpoint from page cache — on unified-memory nodes those
#     cached pages are not free for the GPU.
# Two independent serving groups (replicas: 2), each a leader+worker pair: the
# headless -api Service lists every ready leader, so the gateway round-robins
# requests across groups and one group can be bounced without an outage.
# No node pinning: the scheduler picks any two Sparks with a free GPU per group;
# the power-feed podAffinity only prefers keeping ranks on one PDU (it matches
# the LWS name, so it also pulls groups toward each other — preferred only).
# Weight staging and --load-format instanttensor are the proven minimax pattern
# (see that file's header for why instanttensor is mandatory on unified-memory
# GB10). Served offline, egress locked in cnp.yaml.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: qwen38-flash-next
spec:
  replicas: 2
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: qwen38-flash-next
          app.kubernetes.io/component: leader
      spec:
        runtimeClassName: nvidia
        # Keep both ranks of this tensor-parallel pair on the same power feed
        # (topology.freckle.systems/power-feed = pdu01 or pdu02, from the Talos node config):
        # a single UPS/PDU event then takes the whole model down or not at
        # all, instead of leaving one rank up and the set wedged. Preferred,
        # not required, so an odd number of free Sparks still schedules.
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: topology.freckle.systems/power-feed
                  labelSelector:
                    matchLabels:
                      leaderworkerset.sigs.k8s.io/name: qwen38-flash-next
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        initContainers:
          # Cache the checkpoint from CephFS to node-local NVMe before vLLM starts.
          # -L dereferences the HF-cache symlinks so the local copy is
          # self-contained; scoped to the minimax dir (the `models` PVC is shared
          # with qwen + gpt-oss) and excludes blobs/ since the deref'd snapshot
          # already holds the data (avoids a 2x copy). hostPath persists across
          # RecreateGroupOnPodRestart, so restarts re-sync incrementally (fast).
          - name: cache-models
            image: mirror.gcr.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - rclone
              - sync
              - /ceph-models/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/
              - /models/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/
              - --copy-links
              - --exclude
              - blobs/**
              - --transfers
              - "8"
              - --checkers
              - "16"
              # One-line stats each minute instead of --progress (which floods
              # non-TTY pod logs with continuous progress redraws).
              - --stats
              - 1m
              - --stats-one-line
            volumeMounts:
              - name: ceph-models
                mountPath: /ceph-models
                readOnly: true
              - name: local-models
                mountPath: /models
          # Evict the just-copied checkpoint from host page cache (rclone wrote
          # ~124 GiB through it). On unified-memory GB10 the cache competes with
          # the GPU reservation; instanttensor reads the files O_DIRECT anyway.
          - name: evict-page-cache
            image: mirror.gcr.io/eugr/spark-vllm:latest@sha256:d33f2b78ef6b4f11447521a3e496a0711bbd2ac9bb3ff8802a27ab757de9637a
            command:
              - python3
              - -c
              - |
                import os, sys
                root = "/models/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4"
                n = 0
                for d, _, files in os.walk(root):
                    for f in files:
                        p = os.path.join(d, f)
                        try:
                            fd = os.open(p, os.O_RDONLY)
                            os.fsync(fd) if False else None
                            os.posix_fadvise(fd, 0, 0, os.POSIX_FADV_DONTNEED)
                            os.close(fd); n += 1
                        except OSError as e:
                            print("skip", p, e)
                print("evicted page cache for", n, "files")
            volumeMounts:
              - name: local-models
                mountPath: /models
        containers:
          - name: vllm
            # eugr spark-vllm, 2026-10-13 build (post-v0.31 main + the Qwen3.8
            # patch series). Pinned here independently of minimax's digest so
            # that deployment stays on its known-good build.
            image: mirror.gcr.io/eugr/spark-vllm:latest@sha256:d33f2b78ef6b4f11447521a3e496a0711bbd2ac9bb3ff8802a27ab757de9637a
            command:
              - bash
              - -c
              - |
                vllm serve nvidia/Qwen3.8-Flash-Next-NVFP4 \
                  --served-model-name nvidia/Qwen3.8-Flash-Next-NVFP4 qwen3.8-flash-next \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --enable-expert-parallel \
                  --all2all-backend allgather_reducescatter \
                  --gpu-memory-utilization 0.80 \
                  --max-model-len 262144 \
                  --max-num-seqs 16 \
                  --max-num-batched-tokens 8192 \
                  --load-format instanttensor \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                  --compilation-config '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}' \
                  --mm-encoder-tp-mode data \
                  --mamba-ssm-cache-dtype bfloat16 \
                  --enable-chunked-prefill \
                  --distributed-executor-backend mp \
                  --enable-auto-tool-choice \
                  --tool-call-parser qwen3_coder \
                  --reasoning-parser qwen3 \
                  --enable-prompt-tokens-details \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr $${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --host 0.0.0.0 \
                  --port 8000
            env:
              - name: HF_HOME
                value: /models
              # Weights pre-staged on CephFS (/models/hub); never reach HF at
              # serve time (egress is locked — see cnp.yaml).
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: DO_NOT_TRACK
                value: "1"
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: expandable_segments:True
              # NCCL: use RDMA over the ConnectX-7 fabric (dranet gpu-rdma claim).
              - name: NCCL_IB_HCA
                value: mlx5
              - name: NCCL_NET_GDR_LEVEL
                value: "2"
            ports:
              - containerPort: 8000
                name: http
              - containerPort: 29500
                name: dist-coord
            startupProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              # Long — covers the vLLM load from node-local NVMe (the CephFS→local
              # rclone sync runs first as an initContainer) + torch.compile +
              # cudagraph capture. The startup-probe clock starts after init.
              failureThreshold: 360
            livenessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts:
              - name: local-models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes:
          # Source: shared models PVC on CephFS (read-only; init copies out of it).
          - name: ceph-models
            persistentVolumeClaim:
              claimName: models
              readOnly: true
          # Dest: node-local NVMe cache. hostPath persists across pod restarts so
          # the CephFS sync is a one-time-per-node cost; vLLM reads weights here.
          - name: local-models
            hostPath:
              path: /var/local/inference-models
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: qwen38-flash-next
          app.kubernetes.io/component: worker
      spec:
        runtimeClassName: nvidia
        # Keep both ranks of this tensor-parallel pair on the same power feed
        # (topology.freckle.systems/power-feed = pdu01 or pdu02, from the Talos node config):
        # a single UPS/PDU event then takes the whole model down or not at
        # all, instead of leaving one rank up and the set wedged. Preferred,
        # not required, so an odd number of free Sparks still schedules.
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: topology.freckle.systems/power-feed
                  labelSelector:
                    matchLabels:
                      leaderworkerset.sigs.k8s.io/name: qwen38-flash-next
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        initContainers:
          # Cache the checkpoint from CephFS to node-local NVMe before vLLM starts.
          # -L dereferences the HF-cache symlinks so the local copy is
          # self-contained; scoped to the minimax dir (the `models` PVC is shared
          # with qwen + gpt-oss) and excludes blobs/ since the deref'd snapshot
          # already holds the data (avoids a 2x copy). hostPath persists across
          # RecreateGroupOnPodRestart, so restarts re-sync incrementally (fast).
          - name: cache-models
            image: mirror.gcr.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - rclone
              - sync
              - /ceph-models/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/
              - /models/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/
              - --copy-links
              - --exclude
              - blobs/**
              - --transfers
              - "8"
              - --checkers
              - "16"
              # One-line stats each minute instead of --progress (which floods
              # non-TTY pod logs with continuous progress redraws).
              - --stats
              - 1m
              - --stats-one-line
            volumeMounts:
              - name: ceph-models
                mountPath: /ceph-models
                readOnly: true
              - name: local-models
                mountPath: /models
          # Evict the just-copied checkpoint from host page cache (rclone wrote
          # ~124 GiB through it). On unified-memory GB10 the cache competes with
