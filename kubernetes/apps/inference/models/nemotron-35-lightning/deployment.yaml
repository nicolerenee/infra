---
# NVIDIA Nemotron 3.5 Lightning 30B-A3B (NVFP4) on one DGX Spark, with the
# DSpark speculative-decoding draft NVIDIA ships for GB10. Deployed as the
# candidate "fast structured-task" model for paperless (and any other
# tool-calling sub-agent work): same 3B-active class as Qwen3.6-35B but with
# roughly double the single-stream generation rate on the Spark Arena sweep.
# Flags follow NVIDIA's model-card recipe for DGX Spark (hybrid Mamba-2 MoE:
# flashinfer mamba backend + aligned cache, marlin MoE, fp8 KV).
#
# Unlike qwen36-35b-a3b there is NO CephFS -> node-local NVMe staging: the
# Sparks and the Ceph nodes now share the 10G switch, and this deployment is
# the experiment to see how fast vLLM loads a 20 GiB checkpoint straight off
# the CephFS `models` PVC (HF cache layout, offline). If load time is poor,
# copy the init-container pattern back from the Qwen deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-35-lightning
spec:
  replicas: 1
  # Flux health-checks this Deployment (wait: true); keep the deadline in step
  # with the pointer KS timeout so a slow cold load doesn't fail the sync.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nemotron-35-lightning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemotron-35-lightning
    spec:
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu
      containers:
        - name: vllm
          # Multi-arch upstream tag (arm64 + amd64) via the GCR pull-through mirror.
          image: mirror.gcr.io/vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          command:
            - vllm
            - serve
            - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
            - --served-model-name
            - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
            - nemotron-3.5-lightning
            - --tensor-parallel-size
            - "1"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "262144"
            - --gpu-memory-utilization
            - "0.8"
            - --moe-backend
            - marlin
            - --kv-cache-dtype
            - fp8
            - --mamba-backend
            - flashinfer
            - --mamba-cache-mode
            - align
            - --enable-prefix-caching
            - --enable-prompt-tokens-details
            # DSpark draft: depth 3 measured fastest single-stream on Spark.
            - --speculative-config
            - '{"method":"dspark","model":"nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark","num_speculative_tokens":3}'
            - --reasoning-parser
            - nemotron_v3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: CUDA_MANAGED_FORCE_DEVICE_ALLOC
              value: "1"
            - name: OMP_NUM_THREADS
              value: "4"
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            claims:
              - name: gpu
          volumeMounts:
            # HF_HOME points straight at the shared CephFS models PVC.
            - name: ceph-models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: ceph-models
          persistentVolumeClaim:
            claimName: models
            readOnly: true
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
