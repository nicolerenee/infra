---
# Dedicated Postgres for the Janet brain. CNPG "standard" image bundles
# pgvector (for the planned memory/embeddings layer), PGAudit, locales, JIT.
# Backups go through the barman-cloud plugin into a Ceph RGW bucket
# (bucket.yaml, objectstore.yaml), same shape as fairy db/pg-18a: continuous
# WAL archiving plus a 6-hourly base backup (ScheduledBackup below).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: janet-db
spec:
  # 2 instances: primary + 1 async standby (failover-capable). Bump to 3 for
  # quorum/sync HA like hedgehog if this graduates beyond a personal service.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie@sha256:9f9f53c9e07e5b2924945e6eaeb9168f7e856786d221839866ac85ccd703b3ba
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: ceph-block
  superuserSecret:
    name: janet-db-secrets
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  managed:
    roles:
      - name: janet
        ensure: present
        login: true
        passwordSecret:
          name: janet-app-db-role

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: janet-db-ceph-store
        # Bump the version suffix when recovering from a prior cluster.
        serverName: janet-db-v1

  # When recovering from a prior cluster, uncomment and set source/serverName
  # to the previous cluster's serverName.
  # bootstrap:
  #   recovery:
  #     source: &previousCluster janet-db-v0
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: janet-db-ceph-store
  #         serverName: *previousCluster
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: janet-db-backup
spec:
  # CNPG schedule is a 6-field cron, SECONDS-FIRST (sec min hour dom mon dow).
  # A 5-field "0 0 * * *" is read as every-hour and silently produces 24x the
  # base backups. This is every 6h (00/06/12/18:00); PITR granularity comes from
  # WAL archiving, so base-backup cadence only trades restore speed vs. storage.
  schedule: "0 0 */6 * * *"
  backupOwnerReference: self
  cluster:
    name: janet-db
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
