---
# Rook OBC: provisions `janet-db-backups` in the in-cluster Ceph RGW and
# creates a Secret + ConfigMap named after the OBC. The Secret carries
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY scoped to this bucket; the barman
# ObjectStore consumes it directly, so no off-cluster credential exists.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: janet-db-bucket
spec:
  bucketName: janet-db-backups
  storageClassName: ceph-bucket
