---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Renders Komga's application.yml (Spring Security OAuth2 client for Freckle
# ID) from the tofu-minted client. Registration id "pocketid" is part of the
# callback URL registered on the client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP:=komga}-oidc
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        application.yml: |
          komga:
            oauth2-account-creation: true
            oidc-email-verification: true
          spring:
            security:
              oauth2:
                client:
                  registration:
                    pocketid:
                      provider: pocketid
                      client-id: "{{ .oidc_client_id }}"
                      client-secret: "{{ .oidc_client_secret }}"
                      client-name: Freckle ID
                      scope: openid,email,profile
                      authorization-grant-type: authorization_code
                      redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
                  provider:
                    pocketid:
                      issuer-uri: https://freckle.id
                      user-name-attribute: email
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=komga}-oidc
