---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        RADARR_API_KEY: "{{ .radarr_api_key }}"
        SONARR_API_KEY: "{{ .sonarr_api_key }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-radarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "radarr_$1"
    - extract:
        key: ${CLUSTER_NAME}-media-sonarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "sonarr_$1"
