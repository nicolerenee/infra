---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP:=storyteller}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
  interval: 1h
  values:
    controllers:
      storyteller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Forced alignment of audiobooks to ebooks -> read-along EPUB3
            # (media overlays), which BookOrbit and the Storyteller apps play.
            # CPU-variant image (whisper.cpp transcription on CPU; the GPU
            # builds are x86-only and the Sparks are arm64, so it stays on the
            # cn nodes). The entrypoint wants to start as root and drop to
            # PUID; FORCE_USER_SETTING lets it run as our uid directly
            # (verified with a read-only rootfs). The library is writable:
            # readalouds are written next to the source EPUB.
            image:
              repository: registry.gitlab.com/storyteller-platform/storyteller
              tag: latest@sha256:1ae16005572519f56abac2d65ab879d20115cd257fde7e89cf739ea82aed4de3
            env:
              TZ: America/Chicago
              FORCE_USER_SETTING: "1"
              # Dual-stack Service: the image binds 0.0.0.0, so Envoy's v6
              # endpoint got connection resets (alternating 503s). `::`
              # makes Node listen on both families.
              HOSTNAME: "::"
              STORYTELLER_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP:=storyteller}-secrets
                    key: STORYTELLER_SECRET_KEY
            ports:
              - containerPort: &port 8001
                name: http
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  timeoutSeconds: 2
                  periodSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 6
                memory: 12Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${VOLSYNC_UID}
        runAsGroup: ${VOLSYNC_GID:=${VOLSYNC_UID}}
        fsGroup: ${VOLSYNC_FSGROUP:=${VOLSYNC_UID}}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: storyteller
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          http:
            port: &svcport 80
            targetPort: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${CLUSTER_SUBDOMAIN}.freckle.media"]
        parentRefs:
          - name: public
            namespace: gateway-system
        rules:
          - backendRefs:
              - identifier: app
                port: *svcport
    persistence:
      data:
        existingClaim: ${APP:=storyteller}${VOLSYNC_PVC_SUFFIX:=}
        globalMounts:
          - path: /data
            subPath: data
      library:
        existingClaim: ${MEDIA_PVC:=store01-media}
        globalMounts:
          - path: /library
            subPath: ${BOOKS_SUBPATH:=Books}
      tmp:
        type: emptyDir
