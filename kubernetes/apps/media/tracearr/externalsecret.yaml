---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# All tracearr secrets as env vars. Sources (GSM, tofu-generated in the
# private repo, tofu/platform/tracearr.tf):
#   ${CLUSTER_NAME}-media-tracearr-app   jwt/cookie/better-auth/encryption keys,
#                                        db_username / db_password
#   ${CLUSTER_NAME}-media-tracearr-oidc  client-id / client-secret (Freckle ID)
# The same Secret feeds the TimescaleDB container (POSTGRES_PASSWORD), so the
# two sides can never drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: ${APP}-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        COOKIE_SECRET: "{{ .cookie_secret }}"
        BETTER_AUTH_SECRET: "{{ .better_auth_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        POSTGRES_USER: "{{ .db_username }}"
        POSTGRES_PASSWORD: "{{ .db_password }}"
        # Same-namespace Service of the timescale controller below.
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password }}@${APP}-timescale:5432/tracearr"
        OIDC_CLIENT_ID: '{{ index . "client-id" }}'
        OIDC_CLIENT_SECRET: '{{ index . "client-secret" }}'
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-${APP}-app
    - extract:
        key: ${CLUSTER_NAME}-media-${APP}-oidc
