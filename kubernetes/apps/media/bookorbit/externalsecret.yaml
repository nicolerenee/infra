---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# App secrets (tofu-minted). OIDC providers are configured in BookOrbit's UI,
# so the ${CLUSTER_NAME}-media-bookorbit-oidc secret is read by the operator,
# not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP:=bookorbit}-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .setup_bootstrap_token }}"
        PODCAST_ENCRYPTION_KEY: "{{ .podcast_encryption_key }}"
        EMAIL_ENCRYPTION_KEY: "{{ .email_encryption_key }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .migration_encryption_key }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .book_request_encryption_key }}"
        POSTGRES_USER: "{{ .db_username }}"
        POSTGRES_PASSWORD: "{{ .db_password }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=bookorbit}
