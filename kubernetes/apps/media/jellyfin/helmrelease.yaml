---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP:=jellyfin}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
  interval: 1h
  values:
    controllers:
      jellyfin:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
            env:
              JELLYFIN_PublishedServerUrl: https://watch.freckle.media
              TZ: America/Chicago
            ports:
              - containerPort: 8096
                name: http
              - containerPort: 7359
                protocol: UDP
                name: discovery
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  initialDelaySeconds: 0
                  timeoutSeconds: 10
                  # 150s (5*30) to start before liveness/readiness kick in
                  periodSeconds: 5
                  failureThreshold: 30
              # /health answers slowly while a big library scan holds the DB;
              # a 1s timeout got the pod restarted mid-scan.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            resources:
              claims:
                - name: gpu
              limits:
                cpu: 8
                memory: 10Gi
              requests:
                cpu: 1
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: jellyfin
      securityContext:
        runAsNonRoot: true
        runAsUser: ${VOLSYNC_UID}
        runAsGroup: ${VOLSYNC_GID:=${VOLSYNC_UID}}
        fsGroup: ${VOLSYNC_FSGROUP:=${VOLSYNC_UID}}
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: jellyfin
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          http:
            port: 80
            targetPort: 8096
          jellyfin:
            port: 8096
            targetPort: 8096
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${CLUSTER_SUBDOMAIN}.freckle.media"
          - "watch.freckle.media"
        parentRefs:
          - name: public
            namespace: gateway-system
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      # Config PVC is managed by the volsync component (bare-name
      # ${APP} = backed up). Cache is a sibling PVC (jellyfin-cache)
      # — explicitly excluded from backups; data is regenerable.
      config:
        existingClaim: ${APP:=jellyfin}${VOLSYNC_PVC_SUFFIX:=}
        globalMounts:
          - path: /config
            subPath: config
      cache:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        retain: true
        suffix: cache
      # Trickplay (scrubbing previews) on its own volume: ~4 MB per video adds up
      # to hundreds of GB on a full library and would fill the config PVC (Emby's
      # equivalent hit 149 GB on atlantis). Regenerable, so it stays OUT of the
      # config backups. Default: TrueNAS NFS on the site NAS's HDD pool (tiles are
      # written once and read in small bursts; no block attach, quota is just a
      # dataset quota). Jellyfin keeps trickplay under <data>/trickplay.
      trickplay:
        enabled: true
        type: persistentVolumeClaim
        storageClass: ${JELLYFIN_TRICKPLAY_STORAGE_CLASS:=truenas-nfs}
        accessMode: ReadWriteOnce
        size: ${JELLYFIN_TRICKPLAY_SIZE:=400Gi}
        retain: true
        suffix: trickplay
        globalMounts:
          - path: /config/data/trickplay
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      transcode:
        type: emptyDir
        globalMounts:
          - path: /transcode
      media:
        type: emptyDir
        globalMounts:
          - path: /media
