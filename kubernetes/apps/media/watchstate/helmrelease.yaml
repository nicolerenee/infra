---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP:=watchstate}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
  interval: 1h
  values:
    controllers:
      watchstate:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Syncs play state between the Jellyfin servers.
            # FrankenPHP + an embedded Redis; everything lives under /config.
            image:
              repository: ghcr.io/arabcoders/watchstate
              tag: v1.10.10@sha256:0840431951d60ab7b93a11d426a5db976dac179dd6bf08adb7a22833e1f36b21
            env:
              TZ: America/Chicago
              WS_TZ: America/Chicago
              UMASK: "0022"
              # No passwd entry for the pod UID, so keep Caddy/XDG state off /.
              HOME: /tmp
              XDG_CONFIG_HOME: /tmp
              # Webhooks and the API need the WatchState API key.
              WS_SECURE_API_ENDPOINTS: "true"
              # Import and export hourly. Which servers get written to is set per
              # backend in WatchState (export is enabled only on the Jellyfins).
              WS_CRON_IMPORT: "true"
              WS_CRON_EXPORT: "true"
              # -i skips the date comparison. Items added to a server after
              # they were watched elsewhere carry older play dates than the
              # last export, so a plain export queues them for re-processing
              # every hour and some are never applied. Safe while every
              # play-state change reaches WatchState by webhook and the
              # hourly import (:00) runs before the export (:30). Temporary
              # for the atlantis-to-fairy migration; drop the flag after it.
              WS_CRON_EXPORT_ARGS: "-v -i"
            ports:
              - name: http
                containerPort: &port 8080
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /v1/api/system/healthcheck
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  # Migrations run before the server comes up.
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: ${VOLSYNC_UID}
        runAsGroup: ${VOLSYNC_GID:=${VOLSYNC_UID}}
        fsGroup: ${VOLSYNC_FSGROUP:=${VOLSYNC_UID}}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: watchstate
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${CLUSTER_SUBDOMAIN}.freckle.media"]
        parentRefs:
          - name: tailnet
            namespace: gateway-system
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: ${APP:=watchstate}${VOLSYNC_PVC_SUFFIX:=}
        globalMounts:
          - path: /config
            subPath: config
      tmp:
        type: emptyDir
