---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP:=media-portal}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
  interval: 1h
  values:
    controllers:
      media-portal:
        # Stateless (the session lives in an encrypted cookie), so two
        # replicas keep the landing page up through node drains.
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # End-user landing page for freckle.media: Freckle ID sign-in,
            # app tiles filtered by group, help docs, and personal panels
            # (continue watching, on TV, movies, requests) from Jellyfin,
            # Sonarr, Radarr and Seerr.
            image:
              repository: ghcr.io/freckleapps/media-portal
              tag: 1.4.2@sha256:68836bb1a1cdc3aa6279c6aaf7f0ef12f66fb3903e24a095ef1669c9e8f6f871
            env:
              PUBLIC_URL: https://freckle.media
              OIDC_ISSUER: https://freckle.id
              CONFIG_PATH: /config/portal.yaml
              TZ: America/Chicago
              # In-cluster, so the panels never go through the gateway.
              SONARR_URL: http://sonarr.media.svc.cluster.local
              RADARR_URL: http://radarr.media.svc.cluster.local
              SEERR_URL: http://seerr.media.svc.cluster.local
              REQUESTS_URL: https://requests.fairy.freckle.media
              JELLYFIN_URL: http://jellyfin.media.svc.cluster.local:8096
              WATCH_URL: https://watch.freckle.media
            envFrom:
              - secretRef:
                  name: ${APP:=media-portal}-secrets
            ports:
              - containerPort: &port 8080
                name: http
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ${APP:=media-portal}
    service:
      app:
        controller: media-portal
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          http:
            port: &svcport 80
            targetPort: *port
    route:
      app:
        hostnames: ["freckle.media"]
        parentRefs:
          - name: public
            namespace: gateway-system
        rules:
          - backendRefs:
              - identifier: app
                port: *svcport
    persistence:
      config:
        type: configMap
        name: media-portal-config
        globalMounts:
          - path: /config
            readOnly: true
