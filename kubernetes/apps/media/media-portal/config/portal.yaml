---
# Tile layout for freckle.media. A tile with no `groups` shows to every
# signed-in user; otherwise the user needs one of the listed Freckle ID
# groups. Hiding a tile is convenience only: each app enforces its own groups
# at sign-in, so keep `groups` in step with the app's pocket-id client.
title: Freckle Media
sections:
  - name: Watch
    tiles:
      - name: Jellyfin
        description: Movies and TV
        url: https://watch.freckle.media
        icon: &jellyfin-icon https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/jellyfin.png
        help: jellyfin-quick-connect
        help_label: Signing in on TVs and phones
        groups: &jellyfin-groups [jellyfin_users, jellyfin_admins, media_users]
      # Until atlantis is retired; its library is still the fuller one.
      - name: Jellyfin (Atlantis)
        description: The full library, for now
        url: https://jellyfin.atlantis.freckle.media
        icon: *jellyfin-icon
        help: jellyfin-quick-connect
        help_label: Signing in on TVs and phones
        groups: *jellyfin-groups
      - name: Requests
        description: Ask for a movie or show
        url: https://requests.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/seerr.png
        groups: [jellyfin_admins, media_requesters]
  - name: Read
    tiles:
      - name: Books
        description: Ebooks, audiobooks and comics
        url: https://books.freckle.media
        # Bundled in the app: BookOrbit sends CORP same-origin on its own icons.
        icon: /static/icons/bookorbit.svg
        groups: [media_users]
  - name: Manage
    tiles:
      # Tracearr sits here until regular media users can sign in to it.
      - name: Tracearr
        description: Watch stats
        url: https://tracearr.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/tracearr.png
        groups: [media_manager_users]
      - name: Sonarr
        description: TV (tailnet)
        url: https://sonarr.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/sonarr.png
        groups: [media_manager_users]
      - name: Radarr
        description: Movies (tailnet)
        url: https://radarr.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/radarr.png
        groups: [media_manager_users]
      - name: Prowlarr
        description: Indexers (tailnet)
        url: https://prowlarr.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/prowlarr.png
        groups: [media_manager_users]
      - name: Bazarr
        description: Subtitles (tailnet)
        url: https://bazarr.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/bazarr.png
        groups: [media_manager_users]
      - name: SABnzbd
        description: Usenet downloads (tailnet)
        url: https://sabnzbd.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/sabnzbd.png
        groups: [media_manager_users]
      - name: qui
        description: Torrents (tailnet)
        url: https://qui.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/qui.png
        groups: [media_manager_users]
      - name: WatchState
        description: Watch history sync (tailnet)
        url: https://watchstate.fairy.freckle.media
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/watchstate.png
        groups: [media_manager_users]
