---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Everything the portal reads from GSM, under the env var names the app uses:
# the tofu-minted OIDC client and session secret; the panels' Jellyfin key
# (pushed by hand, it's created in Jellyfin); and Sonarr's and Radarr's
# existing keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP:=media-portal}-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=media-portal}
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=media-portal}-keys
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: ${CLUSTER_NAME}-media-sonarr
        property: api_key
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: ${CLUSTER_NAME}-media-radarr
        property: api_key
