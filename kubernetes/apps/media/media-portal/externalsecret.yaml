---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# OIDC client and session secret, all tofu-minted (media-portal.tf), with keys
# already named as the env vars the app reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP:=media-portal}-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=media-portal}
