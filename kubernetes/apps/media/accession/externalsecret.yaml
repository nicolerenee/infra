---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Everything accession reads from GSM, under the env var names it uses: the
# tofu-minted API token and pg-18a password; the hand-pushed keys (qui's
# client-proxy URL for qbt-ink, BookOrbit's mediaadm password, the Hardcover
# token); and Prowlarr's existing key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP:=accession}-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      engineVersion: v2
      data:
        API_TOKEN: "{{ .API_TOKEN }}"
        DATABASE_URL: "postgres://{{ .db_username }}:{{ .db_password }}@pg-18a-rw.db.svc.cluster.local:5432/accession?sslmode=require"
        QBT_PROXY_URL: "{{ .QBT_PROXY_URL }}"
        BOOKORBIT_PASSWORD: "{{ .BOOKORBIT_PASSWORD }}"
        HARDCOVER_API_KEY: "{{ .HARDCOVER_API_KEY }}"
        PROWLARR_API_KEY: "{{ .prowlarr_api_key }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=accession}
    - extract:
        key: ${CLUSTER_NAME}-media-${APP:=accession}-keys
  data:
    - secretKey: prowlarr_api_key
      remoteRef:
        key: ${CLUSTER_NAME}-media-prowlarr
        property: api_key
