---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP:=accession}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    controllers:
      accession:
        # One worker: two would race to fetch the same torrents during a
        # rollout, so the old pod stops before the new one starts.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: ${APP:=accession}
        containers:
          app:
            # Takes a book from request to BookOrbit: grabs from the books
            # tracker through Prowlarr into qbt-ink (via qui's client proxy),
            # hardlinks into the library, catalogues with locked metadata,
            # and starts the read-along Job.
            image:
              repository: ghcr.io/freckleapps/accession
              tag: 0.1.0
            env:
              TZ: America/Chicago
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              # Mounted where qbt-ink sees it, so the paths qbt-ink reports
              # are the paths accession hardlinks from.
              LIBRARY_ROOT: /store01/vault01
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local
              BOOKORBIT_URL: http://bookorbit.media.svc.cluster.local
            envFrom:
              - secretRef:
                  name: ${APP:=accession}-secrets
            ports:
              - containerPort: &port 8080
                name: http
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      # The read-along Jobs are created through the Kubernetes API.
      automountServiceAccountToken: true
      # uid/gid 3000 own the library. No fsGroup: on the NFS share it could
      # set off a recursive chown of the whole vault.
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: accession
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
        ports:
          http:
            port: 80
            targetPort: *port
    persistence:
      media:
        existingClaim: ${MEDIA_PVC:=store01-vault01-media}
        globalMounts:
          - path: /store01/vault01
