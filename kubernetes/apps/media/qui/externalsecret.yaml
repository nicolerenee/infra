---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: qui-secret
    template:
      data:
        QUI__SESSION_SECRET: "{{ .session_secret }}"
        QUI__OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        QUI__OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-media-qui
    - extract:
        key: ${CLUSTER_NAME}-media-qui-oidc
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-cron
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: qui-cron-secret
    template:
      data:
        QUI_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        # A qui API key ("seeded-search cronjob") made in qui and added by hand.
        key: ${CLUSTER_NAME}-media-qui-cron
