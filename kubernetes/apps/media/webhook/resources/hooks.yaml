---
# SONARR_API_KEY is deliberately not passed here: webhook logs every
# pass-environment-to-command value on each call. The script inherits it from
# the container environment (envFrom webhook-secrets) instead.
- id: sonarr-refresh-series
  execute-command: /config/sonarr-refresh-series.sh
  command-working-directory: /config
  pass-environment-to-command:
    - envname: SONARR_EVENT_TYPE
      source: payload
      name: eventType
    - envname: SONARR_SERIES_ID
      source: payload
      name: series.id
    - envname: SONARR_SERIES_TITLE
      source: payload
      name: series.title
