---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
spec:
  interval: 1h
  url: https://helm.ngc.nvidia.com/nvidia
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.0
      sourceRef:
        kind: HelmRepository
        name: nvidia
  interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Manage the DRA driver through the GPU Operator (26.7.0+) instead of the
    # standalone dra-driver-nvidia-gpu chart. The operator drives this from a
    # GPUCluster CR, which is mutually exclusive with ClusterPolicy — the chart
    # fails the render if both are enabled — so ClusterPolicy is turned off in
    # the same change.
    #
    # GPUCluster is a slimmer CR than ClusterPolicy: it covers draDriver, dcgm,
    # dcgmExporter, hostPaths and daemonsets only. Driver, toolkit and device
    # plugin are not part of it, which suits us — Talos supplies the driver and
    # container toolkit via system extensions, and the device plugin is replaced
    # by DRA. Those values stay false to satisfy the chart's own validations.
    clusterPolicy:
      deployCR: false
    gpuCluster:
      deployCR: true

    # Talos provides NVIDIA drivers via system extensions
    driver:
      enabled: false

    # Talos provides NVIDIA container toolkit via system extensions
    toolkit:
      enabled: false

    # Disable device plugin — replaced by the DRA GPU driver
    devicePlugin:
      enabled: false

    # Disable GPU operator's NFD - use kube-system NFD instead
    nfd:
      enabled: false
    node-feature-discovery:
      enabled: false

    dcgmExporter:
      serviceMonitor:
        enabled: true

    # Talos installs drivers via system extensions under /usr/local
    hostPaths:
      driverInstallDir: /usr/local
