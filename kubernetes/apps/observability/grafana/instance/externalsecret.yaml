---
# OIDC client credentials for Grafana. The pocket-id client is tofu-managed
# per cluster (`oidc_clients.grafana_<env>` in the private repo), which pushes
# client-id + client-secret into GSM as <cluster>-observability-grafana-oidc.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-observability-grafana-oidc
