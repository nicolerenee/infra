apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames:
    - grafana.${CLUSTER_SUBDOMAIN}.freckle.tools
  parentRefs:
    - name: internal
      namespace: gateway-system
  rules:
    - backendRefs:
        - kind: Service
          name: grafana-service
          port: 3000
