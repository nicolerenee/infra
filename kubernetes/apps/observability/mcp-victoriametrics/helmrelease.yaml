---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-victoriametrics
spec:
  interval: 30m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.4.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-mcp
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-victoriametrics
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mcp-victoriametrics
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: mcp-victoriametrics

    vm:
      type: single
      entrypoint: http://vmsingle-vm:8428

    mcp:
      mode: http
      # mcp-go in this image answers the client's reply to a heartbeat ping
      # with a bare 200 (no Content-Type), which agentgateway rejects as a
      # 500 "failed to send message" every 30 s per session (C-469); the
      # gateway keeps its own streams alive, so no heartbeat.
      heartbeatInterval: 0s
      # resources/list returns the whole documentation set, past
      # agentgateway's response buffer limit (a 500 on every session start);
      # the documentation tool still serves it.
      disable:
        resources: true

    # At INFO the server logs every MCP request twice: "MCP request received"
    # with the arguments, then "MCP request succeeded" with the arguments and
    # the full result (a tools/list line is ~20 KB). WARN drops both lines;
    # failures are still logged at ERROR. The MCP gateway's access log keeps
    # the caller/method/tool audit.
    env:
      - name: MCP_LOG_LEVEL
        value: warn

    service:
      type: ClusterIP
      port: 8080

    # No route of its own: clients reach this server only through the MCP
    # gateway (kubernetes/apps/networking/mcp-gateway).
    route:
      enabled: false

    # The server loads the whole VictoriaMetrics documentation set into
    # memory and sits at ~480Mi idle, so a 512Mi limit OOM-killed it on every
    # burst (22 restarts on fairy, 7 on atlantis) — including mid tools/list.
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        memory: 1Gi
