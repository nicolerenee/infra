---
# Read-only MCP server, but it still gets an ingress allow-list: nothing in
# either cluster may reach it except the MCP gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-victoriametrics-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-victoriametrics
  ingress:
    # Only the MCP gateway on fairy, which fronts this server for both
    # clusters: named by cluster label so the rule also matches when the Envoy
    # is a Cluster Mesh peer (atlantis instance of this dir).
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: gateway-system
            gateway.envoyproxy.io/owning-gateway-name: mcp
        # Container runs' read-only proxies (ToolHive MCPRemoteProxy in ai-mcp
        # on fairy, C-333): only the two proxies for this server, by name.
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: ai-mcp
            app: mcpremoteproxy
          matchExpressions:
            - key: toolhive-name
              operator: In
              values: [vmetrics-fairy, vmetrics-atlantis]
        # The agents' agentgateway proxy (Gateway agent-mcp in ai-mcp on
        # fairy) that replaces the ToolHive proxies. One proxy fronts every
        # agent MCP server; the cockpit decides per call (ExtMcp) and Flux
        # tools are also limited to reads in the gateway's own policy.
        - matchLabels:
            k8s:io.cilium.k8s.policy.cluster: fairy-k8s01
            k8s:io.kubernetes.pod.namespace: ai-mcp
            gateway.networking.k8s.io/gateway-name: agent-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
