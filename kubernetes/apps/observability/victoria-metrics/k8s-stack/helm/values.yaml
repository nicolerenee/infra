---
fullnameOverride: "vm"

# -- VictoriaMetrics Operator dependency chart configuration. More values can be found [here](https://docs.victoriametrics.com/helm/victoriametrics-operator#parameters). Also checkout [here](https://docs.victoriametrics.com/operator/vars) possible ENV variables to configure operator behaviour
victoria-metrics-operator:
  enabled: true
  # don't deploy crds, they are deployed by operator-crds chart
  crds:
    enabled: false
    plain: false
  operator:
    # -- Enables ownership reference for converted prometheus-operator objects,
    # it will remove corresponding victoria-metrics objects in case of deletion prometheus one.
    enable_converter_ownership: true
    # -- Enables custom config-reloader, bundled with operator.
    # It should reduce  vmagent and vmauth config sync-time and make it predictable.
    useCustomConfigReloader: true

# deploy a single node victoria metrics instance
vmsingle:
  enabled: true
  # -- Full spec for VMSingle CRD. Allowed values describe [here](https://docs.victoriametrics.com/operator/api#vmsinglespec)
  spec:
    retentionPeriod: "120d"
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
    # Steady working set is ~2.0-2.4Gi on both clusters (~1.2M series/day on
    # fairy); the per-day index pushes it to ~3Gi before a restart, so 3Gi
    # left no headroom (process RSS peaked at 2.84Gi on fairy, C-310).
    # VictoriaMetrics sizes its caches as a share of the limit
    # (-memory.allowedPercent=60), so the extra 1Gi is mostly headroom.
    resources:
      requests:
        cpu: 150m
        memory: 2Gi
      limits:
        cpu: 1200m
        memory: 4Gi

defaultRules:
  rules:
    # These expressions discard cluster or synthesize a series with absent()/vector().
    # Label only their alerts: vmalert externalLabels also rewrites historical
    # recording results and can collapse distinct series onto the same labelset.
    Watchdog:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    InfoInhibitor:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    AlertmanagerClusterFailedToSendAlerts:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    AlertmanagerConfigInconsistent:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    AlertmanagerClusterCrashlooping:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    TooHighGoroutineSchedulingLatency:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    PersistentQueueRunsOutOfSpaceIn12Hours:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    PersistentQueueRunsOutOfSpaceIn4Hours:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    DiskRunsOutOfSpace:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    TooHighChurnRate:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    TooHighChurnRate24h:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    TooHighSlowInsertsRate:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    KubeAPIDown:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    KubeControllerManagerDown:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    KubeSchedulerDown:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
    # A node that is serving a model is *supposed* to sit near full memory —
    # vLLM pins most of a DGX Spark's unified memory up front — so skip the
    # alert on nodes that currently run a vllm container. Node identity comes
    # from the node-exporter pod's kube_pod_info; model presence from any
    # inference pod whose container is named vllm (leaders and workers alike).
    # Collapse overlapping scrape targets while retaining the pod-to-node mapping.
    NodeMemoryHighUtilization:
      spec:
        expr: |-
          (
            (100 - ((node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100)) > 90
          )
          * on (namespace, pod) group_left (node)
            max by (namespace, pod, node) (kube_pod_info{job="kube-state-metrics"})
          unless on (node)
            count by (node) (
              kube_pod_container_info{namespace="inference", container="vllm"}
              * on (namespace, pod) group_left (node)
                max by (namespace, pod, node) (kube_pod_info{job="kube-state-metrics"})
            )
    # Duration is the discriminator for node-level alerts: a Talos upgrade or
    # reboot takes a node (and its kubelet, exporters and scrape targets) away
    # for 5-10 min, a stuck node stays away for hours. 30m rides out a slow
    # drain+reboot without hiding a real outage. Ceph's equivalents are in the
    # rook-ceph-cluster HelmRelease.
    KubeNodeNotReady:
      spec:
        for: 30m
    KubeNodeUnreachable:
      spec:
        for: 30m
    KubeletInstanceUnreachable:
      spec:
        for: 30m
    TargetDown:
      spec:
        for: 30m
    TooManyScrapeErrors:
      spec:
        for: 30m
    # rsync-TLS destinations wait for the next source connection, which can
    # legitimately be daily. Exempt only ready, controller-owned listeners
    # whose matching source AND destination report in-sync. Missing telemetry
    # or an out-of-sync peer keeps the age check; source Jobs never qualify.
    # KubeJobFailed, VolsyncVolumeOutOfSync, VolsyncMissedSchedule and
    # VolsyncMoverContainerCreating still cover failed/stale/stuck movers.
    KubeJobNotCompleted:
      spec:
        expr: |-
          (
            (time() - max by (namespace, job_name, cluster) (
              kube_job_status_start_time{job="kube-state-metrics",namespace=~".*"}
              and (kube_job_status_active{job="kube-state-metrics",namespace=~".*"} > 0)
            )) > 43200
          )
          unless on (namespace, job_name, cluster)
            max by (namespace, job_name, cluster) (
              kube_job_labels{job="kube-state-metrics",label_excluded_from_alerts="true",namespace=~".*"} == 1
            )
          unless on (cluster, namespace, job_name)
            (
              max by (cluster, namespace, job_name, owner_name) (
                kube_job_owner{job="kube-state-metrics",job_name=~"volsync-rsync-tls-dst-.*",owner_kind="ReplicationDestination",owner_is_controller="true"} == 1
              )
              and on (cluster, namespace, job_name)
                (max by (cluster, namespace, job_name) (kube_job_status_ready{job="kube-state-metrics"}) > 0)
              and on (cluster, namespace, owner_name)
                label_copy(
                  max by (cluster, obj_namespace, obj_name) (
                    volsync_volume_out_of_sync{job="volsync-metrics",method="rsync-tls",role="source"}
                  ) == 0,
                  "obj_namespace", "namespace", "obj_name", "owner_name"
                )
              and on (cluster, namespace, owner_name)
                label_copy(
                  max by (cluster, obj_namespace, obj_name) (
                    volsync_volume_out_of_sync{job="volsync-metrics",method="rsync-tls",role="destination"}
                  ) == 0,
                  "obj_namespace", "namespace", "obj_name", "owner_name"
                )
            )
    # A failed Job lingers until its TTL (recyclarr keeps one for 24h), so the
    # stock rule kept alerting long after the CronJob had recovered. Skip a
    # failed CronJob-owned Job once its CronJob has succeeded since that Job
    # started; plain Jobs and CronJobs still failing alert as before.
    # MetricsQL's label_copy rather than label_replace: this file goes through
    # Flux postBuild substitution, which would eat a "$1".
    KubeJobFailed:
      spec:
        expr: |-
          kube_job_failed{job="kube-state-metrics",namespace=~".*"} > 0
          unless on (cluster, namespace, job_name)
            (
              max by (cluster, namespace, job_name, owner_name) (
                kube_job_status_start_time{job="kube-state-metrics"}
                * on (cluster, namespace, job_name) group_left (owner_name)
                  kube_job_owner{job="kube-state-metrics",owner_kind="CronJob"}
              )
              < on (cluster, namespace, owner_name) group_left ()
                max by (cluster, namespace, owner_name) (
                  label_copy(kube_cronjob_status_last_successful_time{job="kube-state-metrics"}, "cronjob", "owner_name")
                )
            )
    # LWS leaders deliberately retain old groups below the canary partition.
    # Suppress only a settled canary with every leader ready and enough updated
    # groups; missing partition telemetry fails open to the stock alert. Worker
    # StatefulSets and ordinary StatefulSets keep the upstream behavior.
    KubeStatefulSetUpdateNotRolledOut:
      spec:
        expr: |-
          (
            (
              max by (namespace, statefulset, job, cluster) (
                kube_statefulset_status_current_revision{job="kube-state-metrics"}
                unless kube_statefulset_status_update_revision{job="kube-state-metrics"}
              )
              * on (namespace, statefulset, job, cluster)
                (kube_statefulset_replicas{job="kube-state-metrics"} != kube_statefulset_status_replicas_updated{job="kube-state-metrics"})
            )
            and on (namespace, statefulset, job, cluster)
              (changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics"}[5m]) == 0)
          )
          unless on (namespace, statefulset, job, cluster)
          (
            (kube_statefulset_status_replicas_ready{job="kube-state-metrics"} == kube_statefulset_replicas{job="kube-state-metrics"})
            and on (namespace, statefulset, job, cluster)
            (
              kube_statefulset_status_replicas_updated{job="kube-state-metrics"}
              >= on (namespace, statefulset, job, cluster)
                clamp_min(
                  kube_statefulset_replicas{job="kube-state-metrics"}
                  - on (namespace, statefulset, job, cluster)
                    kube_leaderworkerset_rollout_partition{job="kube-state-metrics"},
                  0
                )
            )
            and on (namespace, statefulset, job, cluster)
              (kube_leaderworkerset_rollout_partition{job="kube-state-metrics"} > 0)
          )
    # These targets scrape every 20s. A retired target can leave one up=0
    # sample in instant-query lookback without a staleness marker. Require
    # a sample younger than 60s so it clears before the unchanged 2m hold.
    # Continuously scraped failures stay eligible; missing discovery targets
    # remain covered separately by ScrapePoolHasNoTargets.
    ServiceDown:
      spec:
        expr: |-
          (up{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*"} == 0)
          and
          (time() - timestamp(up{job=~".*(victoriametrics|vmselect|vminsert|vmstorage|vmagent|vmalert|vmsingle|vmalertmanager|vmauth).*"}) < 60)
    # vmagent logs one warning per failed scrape (lib/promscrape/scrapework.go).
    # A replaced pod's old IP fails one scrape before service discovery drops
    # it, so a few rollouts were enough to fire this with no real problem.
    # Failed scrapes already alert through TooManyScrapeErrors above; drop them
    # here. Otherwise this is the chart 0.97.1 expression and for: unchanged.
    TooManyLogs:
      spec:
        expr: |-
          sum(increase(vm_log_messages_total{level="warn", location!~".*/lib/promscrape/scrapework.go:.*"}[5m])) without(app_version,location,is_printed) > 0
    # The chart divides "instances mostly down over the last 5m" by an
    # *instant* count of instances. When a rollout kills a pod after a single
    # up=0 scrape, that dead series stays in the numerator for 5m but has
    # already left the denominator, so a healthy restart reads as 1/1 (or 1/2
    # with 2 replicas) and fires critical (C-379, C-394). Count the
    # denominator over the same 5m window. A real outage of half or more of
    # the instances still fires. Otherwise the chart 0.97.1 rule, for:
    # unchanged; the namespace matcher is dropped, the grouping keeps it.
    AlertmanagerClusterDown:
      spec:
        labels:
          cluster: "${CLUSTER_NAME}"
        expr: |-
          (
            count by (namespace, service) (
              avg_over_time(up{job=~"vmalertmanager-.*", container="alertmanager"}[5m]) < 0.5
            )
          /
            count by (namespace, service) (
              avg_over_time(up{job=~"vmalertmanager-.*", container="alertmanager"}[5m])
            )
          )
          >= 0.5

defaultDashboards:
  enabled: true
  grafanaOperator:
    enabled: true

grafana:
  enabled: false
  forceDeployDatasource: true

defaultDatasources:
  grafanaOperator:
    enabled: true

vmagent:
  spec:
    # Every series, and so every alert, names its cluster: the default rules
    # aggregate and describe by `cluster` ("on cluster {{ $labels.cluster }}"),
    # and the inhibit rules below match on it.
    externalLabels:
      cluster: "${CLUSTER_NAME}"
    extraArgs:
      # Fairy's compute03 kube-apiserver (the etcd leader) returns ~20MB of /metrics,
      # exceeding the 16MB default. Other apiservers stay under 8MB.
      promscrape.maxScrapeSize: "32MB"
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi

vmalert:
  enabled: true
  spec:
    # CDI generates rules outside its component customization path. Use the native
    # cdi-cluster-rules VMRule instead, with identical recordings and labelled alerts.
    # Explicitly retain all namespaces when adding a rule selector.
    ruleNamespaceSelector: {}
    ruleSelector:
      matchExpressions:
        - key: prometheus.cdi.kubevirt.io
          operator: NotIn
          values: ["true"]
    extraArgs:
      external.url: "https://vmalert.${CLUSTER_DOMAIN}"

alertmanager:
  config:
    # Every warning and critical alert goes to cockpit, the only receiver
    # (the cockpit VMAlertmanagerConfigs, merged in below the root): agents
    # triage there and cockpit decides what reaches Nicole's phone. No
    # Discord (C-212). What matches nothing, info alerts included, stops
    # here.
    route:
      receiver: "blackhole"
      group_by: ["alertgroup", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

    inhibit_rules:
      - target_matchers:
          - severity=~"warning|info"
        source_matchers:
          - severity=critical
        equal:
          - cluster
          - namespace
          - alertname
      - target_matchers:
          - severity=info
        source_matchers:
          - severity=warning
        equal:
          - cluster
          - namespace
          - alertname
      - target_matchers:
          - severity=info
        source_matchers:
          - alertname=InfoInhibitor
        equal:
          - cluster
          - namespace

    receivers:
      - name: blackhole
  enabled: true
  spec:
    externalURL: "https://alertmanager.${CLUSTER_DOMAIN}"
    # Routes merged from VMAlertmanagerConfig objects (e.g. the ai-agents
    # alert bridge) are cluster-wide; without this the operator injects
    # `namespace="<config's namespace>"` into each merged route and nothing
    # outside that namespace ever matches.
    disableNamespaceMatcher: true
    # Two peered replicas (C-380), so one pod restarting (a chart bump, a node
    # drain) no longer takes Alertmanager down. With replicaCount > 1 the
    # operator peers the pods (--cluster.peer, port 9094) and the chart lists
    # every replica as a vmalert notifier; the peers gossip silences and the
    # notification log, so each alert still reaches cockpit once, and a single
    # pod restart no longer wipes silences (C-378). Data stays on emptyDir on
    # purpose: no Ceph dependency for Alertmanager.
    replicaCount: 2
    # A rollout replaces each pod with a new gossip member; the survivor keeps
    # the old one as a failed peer for --cluster.reconnect-timeout (6h by
    # default), so AlertmanagerClusterFailedPeers fired for hours after every
    # rollout (C-1291). The --cluster.peer DNS names are re-resolved on each
    # refresh, so a peer that really comes back still rejoins after 5m.
    extraArgs:
      cluster.reconnect-timeout: 5m
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vmalertmanager
            app.kubernetes.io/instance: vm

kubeControllerManager:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            # caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # don't check cert since talos isn't using the k8s CA for this
            insecureSkipVerify: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            # caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # don't check cert since talos isn't using the k8s CA for this
            insecureSkipVerify: true

kubeProxy:
  enabled: false

kubelet:
  enabled: true
  vmScrape:
    kind: VMNodeScrape
    spec:
      scheme: "https"
      honorLabels: true
      interval: "30s"
      scrapeTimeout: "5s"
      tlsConfig:
        insecureSkipVerify: true
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      # drop high cardinality label and useless metrics for cadvisor and kubelet
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        - action: labeldrop
          regex: ".*_node_kubevirt_io_.*"
        # extensions_talos_dev_* (which talos extension version is on each
        # node) is kept only on kubelet_node_name, one series per node. On
        # every other series a Talos upgrade changes it and rewrites all of
        # that node's container series (vmsingle churn, C-310/C-401).
        # Query: kubelet_node_name{extensions_talos_dev_<ext>!=""}, or join
        # on node.
        - action: labeldrop
          if: '{__name__!="kubelet_node_name"}'
          regex: extensions_talos_dev_.*
      relabelConfigs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        # Drop high-cardinality node labels copied onto every kubelet/cadvisor
        # series. Without this, DGX nodes push kubernetes_feature_enabled past
        # vmsingle's 40-label limit (~56 labels) and the rows get rejected.
        # extensions_talos_dev_* is mapped here but kept only on
        # kubelet_node_name (see metricRelabelConfigs above).
        # tuppr_home_operations_com_* is set only while tuppr upgrades a node;
        # flipping it on and off rewrites every container series on that node
        # (vmsingle churn, C-310).
        - action: labeldrop
          regex: (.*_node_kubevirt_io_.*|kubevirt_io_.*|nvidia_com_.*|plan_upgrade_cattle_io_.*|beta_kubernetes_io_.*|intel_feature_node_kubernetes_io_.*|feature_node_kubernetes_io_.*|tuppr_home_operations_com_.*)
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet

prometheus-node-exporter:
  extraArgs:
    # node_exporter >= 1.12 reads the new cpuinfo_avg_freq sysfs attribute,
    # which on the DGX Sparks (arm64, cppc_cpufreq, kernel 6.18) sometimes
    # returns EAGAIN; Go parks the read on the netpoller forever, goroutines
    # pile up until the exporter hits its 40-request limit and every scrape
    # gets a 503 -- so ALL node_* metrics for the Sparks vanish. Upstream:
    # https://github.com/prometheus/node_exporter/issues/3791 (fix pending in
    # prometheus/procfs#861). Drop this flag once a node_exporter release
    # bounds the read; it only costs node_cpu_scaling_* / node_cpu_frequency_*.
    - --no-collector.cpufreq
