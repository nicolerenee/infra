---
fullnameOverride: "vm"

# -- VictoriaMetrics Operator dependency chart configuration. More values can be found [here](https://docs.victoriametrics.com/helm/victoriametrics-operator#parameters). Also checkout [here](https://docs.victoriametrics.com/operator/vars) possible ENV variables to configure operator behaviour
victoria-metrics-operator:
  enabled: true
  # don't deploy crds, they are deployed by operator-crds chart
  crds:
    enabled: false
    plain: false
  operator:
    # -- Enables ownership reference for converted prometheus-operator objects,
    # it will remove corresponding victoria-metrics objects in case of deletion prometheus one.
    enable_converter_ownership: true
    # -- Enables custom config-reloader, bundled with operator.
    # It should reduce  vmagent and vmauth config sync-time and make it predictable.
    useCustomConfigReloader: true

# deploy a single node victoria metrics instance
vmsingle:
  enabled: true
  # -- Full spec for VMSingle CRD. Allowed values describe [here](https://docs.victoriametrics.com/operator/api#vmsinglespec)
  spec:
    retentionPeriod: "120d"
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
    resources:
      requests:
        cpu: 150m
        memory: 1Gi
      limits:
        cpu: 1200m
        memory: 3Gi

defaultRules:
  rules:
    # A node that is serving a model is *supposed* to sit near full memory —
    # vLLM pins most of a DGX Spark's unified memory up front — so skip the
    # alert on nodes that currently run a vllm container. Node identity comes
    # from the node-exporter pod's kube_pod_info; model presence from any
    # inference pod whose container is named vllm (leaders and workers alike).
    NodeMemoryHighUtilization:
      spec:
        expr: |-
          (
            (100 - ((node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100)) > 90
          )
          * on (namespace, pod) group_left (node) kube_pod_info{job="kube-state-metrics"}
          unless on (node)
            count by (node) (
              kube_pod_container_info{namespace="inference", container="vllm"}
              * on (namespace, pod) group_left (node) kube_pod_info{job="kube-state-metrics"}
            )
    # Duration is the discriminator for node-level alerts: a Talos upgrade or
    # reboot takes a node (and its kubelet, exporters and scrape targets) away
    # for 5-10 min, a stuck node stays away for hours. 30m rides out a slow
    # drain+reboot without hiding a real outage. Ceph's equivalents are in the
    # rook-ceph-cluster HelmRelease.
    KubeNodeNotReady:
      spec:
        for: 30m
    KubeNodeUnreachable:
      spec:
        for: 30m
    KubeletInstanceUnreachable:
      spec:
        for: 30m
    TargetDown:
      spec:
        for: 30m
    TooManyScrapeErrors:
      spec:
        for: 30m
    # A failed Job lingers until its TTL (recyclarr keeps one for 24h), so the
    # stock rule kept alerting long after the CronJob had recovered. Skip a
    # failed CronJob-owned Job once its CronJob has succeeded since that Job
    # started; plain Jobs and CronJobs still failing alert as before.
    # MetricsQL's label_copy rather than label_replace: this file goes through
    # Flux postBuild substitution, which would eat a "$1".
    KubeJobFailed:
      spec:
        expr: |-
          kube_job_failed{job="kube-state-metrics",namespace=~".*"} > 0
          unless on (cluster, namespace, job_name)
            (
              max by (cluster, namespace, job_name, owner_name) (
                kube_job_status_start_time{job="kube-state-metrics"}
                * on (cluster, namespace, job_name) group_left (owner_name)
                  kube_job_owner{job="kube-state-metrics",owner_kind="CronJob"}
              )
              < on (cluster, namespace, owner_name) group_left ()
                max by (cluster, namespace, owner_name) (
                  label_copy(kube_cronjob_status_last_successful_time{job="kube-state-metrics"}, "cronjob", "owner_name")
                )
            )

defaultDashboards:
  enabled: true
  grafanaOperator:
    enabled: true

grafana:
  enabled: false
  forceDeployDatasource: true

defaultDatasources:
  grafanaOperator:
    enabled: true

vmagent:
  spec:
    # Every series, and so every alert, names its cluster: the default rules
    # aggregate and describe by `cluster` ("on cluster {{ $labels.cluster }}"),
    # and the inhibit rules below match on it.
    externalLabels:
      cluster: "${CLUSTER_NAME}"
    extraArgs:
      # Fairy's compute03 kube-apiserver (the etcd leader) returns ~20MB of /metrics,
      # exceeding the 16MB default. Other apiservers stay under 8MB.
      promscrape.maxScrapeSize: "32MB"
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi

vmalert:
  enabled: true
  spec:
    extraArgs:
      external.url: "https://vmalert.${CLUSTER_DOMAIN}"

alertmanager:
  config:
    # Every warning and critical alert goes to cockpit, the only receiver
    # (the cockpit VMAlertmanagerConfigs, merged in below the root): agents
    # triage there and cockpit decides what reaches Nicole's phone. No
    # Discord (C-212). What matches nothing, info alerts included, stops
    # here.
    route:
      receiver: "blackhole"
      group_by: ["alertgroup", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

    inhibit_rules:
      - target_matchers:
          - severity=~"warning|info"
        source_matchers:
          - severity=critical
        equal:
          - cluster
          - namespace
          - alertname
      - target_matchers:
          - severity=info
        source_matchers:
          - severity=warning
        equal:
          - cluster
          - namespace
          - alertname
      - target_matchers:
          - severity=info
        source_matchers:
          - alertname=InfoInhibitor
        equal:
          - cluster
          - namespace

    receivers:
      - name: blackhole
  enabled: true
  spec:
    externalURL: "https://alertmanager.${CLUSTER_DOMAIN}"
    # Routes merged from VMAlertmanagerConfig objects (e.g. the ai-agents
    # alert bridge) are cluster-wide; without this the operator injects
    # `namespace="<config's namespace>"` into each merged route and nothing
    # outside that namespace ever matches.
    disableNamespaceMatcher: true

kubeControllerManager:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            # caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # don't check cert since talos isn't using the k8s CA for this
            insecureSkipVerify: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            # caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # don't check cert since talos isn't using the k8s CA for this
            insecureSkipVerify: true

kubeProxy:
  enabled: false

kubelet:
  enabled: true
  vmScrape:
    kind: VMNodeScrape
    spec:
      scheme: "https"
      honorLabels: true
      interval: "30s"
      scrapeTimeout: "5s"
      tlsConfig:
        insecureSkipVerify: true
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      # drop high cardinality label and useless metrics for cadvisor and kubelet
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        - action: labeldrop
          regex: ".*_node_kubevirt_io_.*"
      relabelConfigs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        # Drop high-cardinality node labels copied onto every kubelet/cadvisor
        # series. Without this, DGX nodes push kubernetes_feature_enabled past
        # vmsingle's 40-label limit (~56 labels) and the rows get rejected.
        # extensions_talos_dev_* is kept by request — useful for tracking which
        # talos extension version is on each node.
        - action: labeldrop
          regex: (.*_node_kubevirt_io_.*|kubevirt_io_.*|nvidia_com_.*|plan_upgrade_cattle_io_.*|beta_kubernetes_io_.*|intel_feature_node_kubernetes_io_.*|feature_node_kubernetes_io_.*)
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet

prometheus-node-exporter:
  extraArgs:
    # node_exporter >= 1.12 reads the new cpuinfo_avg_freq sysfs attribute,
    # which on the DGX Sparks (arm64, cppc_cpufreq, kernel 6.18) sometimes
    # returns EAGAIN; Go parks the read on the netpoller forever, goroutines
    # pile up until the exporter hits its 40-request limit and every scrape
    # gets a 503 -- so ALL node_* metrics for the Sparks vanish. Upstream:
    # https://github.com/prometheus/node_exporter/issues/3791 (fix pending in
    # prometheus/procfs#861). Drop this flag once a node_exporter release
    # bounds the read; it only costs node_cpu_scaling_* / node_cpu_frequency_*.
    - --no-collector.cpufreq
