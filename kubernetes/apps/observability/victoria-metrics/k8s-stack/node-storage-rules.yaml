---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-storage-health
spec:
  groups:
    - name: node-storage-health
      interval: 30s
      rules:
        # Keep pod identity through the hold period so a succession of short-lived
        # pods on one node cannot accumulate into a false sustained wait.
        - alert: KubePodContainerCreating
          expr: |-
            (
              max by (cluster, namespace, pod) (
                kube_pod_container_status_waiting_reason{
                  job="kube-state-metrics", reason="ContainerCreating"
                }
                or
                kube_pod_init_container_status_waiting_reason{
                  job="kube-state-metrics", reason="ContainerCreating"
                }
              ) == 1
            )
            * on (cluster, namespace, pod) group_left(node)
            max by (cluster, namespace, pod, node) (
              kube_pod_info{job="kube-state-metrics", node!=""}
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot start on {{ $labels.node }}'
            description: >-
              A container has remained in ContainerCreating for more than two
              minutes. Check Pod events for FailedMount and node storage health.
              Image pulls and other setup failures can also cause this state;
              it does not establish a storage failure.

        # A nonzero queue alone is normal under load. Require a continuously
        # nonempty queue and no read, write or discard completions. Scope to the
        # cluster DaemonSet so other node-exporter targets cannot trigger this.
        - alert: NodeRBDIOStalled
          expr: |-
            (
              max by (cluster, instance, device) (
                min_over_time(node_disk_io_now{
                  service="vm-k8s-stack-prometheus-node-exporter",
                  device=~"rbd[0-9]+"
                }[2m])
              ) > 0
              and on (cluster, instance, device)
              (
                sum by (cluster, instance, device) (
                  increase({
                    __name__=~"node_disk_(reads|writes|discards)_completed_total",
                    service="vm-k8s-stack-prometheus-node-exporter",
                    device=~"rbd[0-9]+"
                  }[2m])
                ) == 0
              )
            )
            * on (cluster, instance) group_left(node)
            max by (cluster, instance, node) (
              label_replace(
                node_uname_info{service="vm-k8s-stack-prometheus-node-exporter"},
                "node", "$1", "nodename", "(.+)"
              )
            )
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: 'RBD I/O is not progressing on {{ $labels.node }} / {{ $labels.device }}'
            description: >-
              This mapped RBD device has outstanding I/O throughout a two-minute
              window with no read, write or discard completions, sustained for
              another minute. Check kernel Ceph handshakes, udevd health and CSI
              mount events. This block-device signal does not measure Ceph osdc
              requests and cannot detect a map blocked before a device exists.

    # Only pods whose spec requests resources for the sidecar are expected to
    # publish queue telemetry. Existing pods remain outside the OnDelete pilot.
    - name: node-udev-queue
      interval: 30s
      rules:
        - record: node:udev_queue_expected:info
          expr: |-
            group by (cluster, namespace, pod) (
              kube_pod_container_resource_requests{
                job="kube-state-metrics", namespace="observability",
                container="udev-queue-collector", resource="memory",
                pod=~"vm-k8s-stack-prometheus-node-exporter-.+"
              }
            )
            * on (cluster, namespace, pod) group_left(node)
            max by (cluster, namespace, pod, node) (
              kube_pod_info{job="kube-state-metrics", node!=""}
            )
        - record: node:udev_queue_fresh:info
          expr: |-
            node:udev_queue_expected:info
            and on (cluster, namespace, pod)
            (
              node_udev_queue_collection_timestamp_seconds{
                service="vm-k8s-stack-prometheus-node-exporter"
              } >= time() - 60
              and
              node_udev_queue_collection_timestamp_seconds{
                service="vm-k8s-stack-prometheus-node-exporter"
              } <= time()
            )
            and on (cluster, namespace, pod)
            (
              node_udev_queue_last_success_timestamp_seconds{
                service="vm-k8s-stack-prometheus-node-exporter"
              } >= time() - 60
              and
              node_udev_queue_last_success_timestamp_seconds{
                service="vm-k8s-stack-prometheus-node-exporter"
              } <= time()
            )
            and on (cluster, namespace, pod)
            (node_textfile_scrape_error{service="vm-k8s-stack-prometheus-node-exporter"} == 0)
            and on (cluster, namespace, pod)
            (node_udev_queue_collection_success{service="vm-k8s-stack-prometheus-node-exporter"} >= 0)
        - alert: NodeUdevQueueCollectionFailed
          expr: |-
            node:udev_queue_expected:info
            and on (cluster, namespace, pod)
            (node_udev_queue_collection_success{service="vm-k8s-stack-prometheus-node-exporter"} == 0)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: 'Cannot inspect the udev queue on {{ $labels.node }}'
            description: >-
              The unprivileged queue inspection is failing. Queue state is unknown;
              check collector logs and existing host-view access without widening
              privileges. This does not establish a udevd service failure.
        - alert: NodeUdevQueueTelemetryUnavailable
          expr: |-
            (
              node:udev_queue_expected:info
              unless on (cluster, namespace, pod) node:udev_queue_fresh:info
            )
            or
            (
              node:udev_queue_expected:info
              and on (cluster, namespace, pod)
              (node_udev_queue_collection_success{service="vm-k8s-stack-prometheus-node-exporter"} == 1)
              unless on (cluster, namespace, pod)
              (
                node_udev_queue_present{service="vm-k8s-stack-prometheus-node-exporter"} >= 0
                and node_udev_queue_age_seconds{service="vm-k8s-stack-prometheus-node-exporter"} >= 0
                and node_udev_queue_mtime_seconds{service="vm-k8s-stack-prometheus-node-exporter"} >= 0
                and node_udev_queue_mtime_seconds{service="vm-k8s-stack-prometheus-node-exporter"} <= time()
              )
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: 'Udev queue telemetry is unavailable on {{ $labels.node }}'
            description: >-
              An exporter pod with the queue sidecar has missing, stale (over 60s),
              future-dated or unreadable textfile telemetry for two minutes.
              Check exporter scrape health, textfile errors and collector timestamps.
              Missing telemetry means unknown, never an idle queue. Expected-pod
              inventory depends on kube-state-metrics availability.
        - alert: NodeUdevQueuePersistent
          expr: |-
            node:udev_queue_fresh:info
            and on (cluster, namespace, pod)
            (node_udev_queue_collection_success{service="vm-k8s-stack-prometheus-node-exporter"} == 1)
            and on (cluster, namespace, pod)
            (node_udev_queue_present{service="vm-k8s-stack-prometheus-node-exporter"} == 1)
            and on (cluster, namespace, pod)
            (node_udev_queue_age_seconds{service="vm-k8s-stack-prometheus-node-exporter"} > 120)
            and on (cluster, namespace, pod)
            (node_udev_queue_mtime_seconds{service="vm-k8s-stack-prometheus-node-exporter"} <= time())
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: 'Udev queue persists on {{ $labels.node }}'
            description: >-
              A pending-event queue with mtime age over two minutes has persisted
              for another minute with successful, fresh inspections. Check udevd,
              kernel Ceph handshakes and CSI events. Queue presence and mtime are
              proxies, not exact Talos service health or individual event latency;
              normal sustained activity can also keep the queue present.
