---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Bearer token for cockpit's Alertmanager and Flux webhooks: the same
# tofu-generated value cockpit reads as its webhook secret. Alertmanager
# reads `token`; Flux's generic provider reads the `headers` key added here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cockpit-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: cockpit-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        headers: |
          Authorization: Bearer {{ .token }}
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-observability-cockpit-webhook
