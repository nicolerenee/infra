---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Bearer token for cockpit's Alertmanager receiver: the same tofu-generated
# value cockpit reads as its webhook secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cockpit-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: cockpit-webhook
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-observability-cockpit-webhook
