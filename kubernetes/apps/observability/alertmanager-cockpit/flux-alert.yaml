---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/notification.toolkit.fluxcd.io/alert_v1.json
# Every Kustomization and HelmRelease event goes to cockpit. eventSeverity is
# info on purpose: cockpit needs the success events to close an item, and it
# drops successes for objects that have no open item.
#
# An Alert can't select all namespaces, so each one is listed. The list is
# shared by both clusters (a namespace a cluster doesn't have never matches):
# add a namespace here when a new app gets its own. Namespaces that only
# frecklelabs/k8s-private creates get their Alert from that repo.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: cockpit-flux
spec:
  providerRef:
    name: cockpit-flux
  eventSeverity: info
  # cockpit names the item's cluster from this.
  eventMetadata:
    cluster: ${CLUSTER_NAME}
  eventSources:
