---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Gatus's publish-only token for ntfy's `cockpit` topic (tofu-generated).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: gatus-ntfy
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-observability-gatus-ntfy
