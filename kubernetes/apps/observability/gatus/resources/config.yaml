---
web:
  port: $${WEB_PORT}
storage:
  type: sqlite
  path: /config/sqlite.db
  caching: true
metrics: true
debug: false
ui:
  title: Status | ${CLUSTER_NAME}
  header: Status - ${CLUSTER_NAME}
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m
endpoints:
  - name: flux-webhook
    group: external
    url: https://${CLUSTER_NAME}-flux-webhook.${TAILNET_DOMAIN}/
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 404"
  # GitHub's push hooks arrive here (Cloudflare tunnel); only /hook/ is routed,
  # so / answering 404 means the route, gateway and tunnel are all up.
  - name: flux-webhook-tunnel
    group: external
    url: https://flux-webhook.${CLUSTER_SUBDOMAIN}.freckle.services/
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 404"
