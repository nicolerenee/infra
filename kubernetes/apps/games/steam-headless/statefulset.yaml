---
# Steam Headless 2.x: KDE Plasma (Wayland), Steam and Sunshine under systemd in
# one pod. Moonlight clients and the web UI (https://<ip>:8483) reach it on its
# own home-LAN address. Privileged because systemd needs a writable cgroup and
# the virtual controllers' /dev/input/event* minors need a device allowance,
# neither of which Kubernetes grants any other way.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steam-headless
spec:
  serviceName: steam-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: steam-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: steam-headless
      annotations:
        # A static home-LAN address below the UDM's DHCP pool (.50+), so
        # Moonlight clients find it at a fixed IP. The pointer can override it.
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "multus-trusted",
            "namespace": "networking",
            "ips": ["10.189.10.42/24"],
            "mac": "ae:98:3e:5a:7e:42"
          }]
    spec:
      hostname: steam-headless
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        networks.freckle.systems/home-lan: present
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: steam-headless
      containers:
        - name: steam-headless
          image: mirror.gcr.io/josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
          tty: true
          securityContext:
            privileged: true
          lifecycle:
            # systemd as PID 1 treats SIGTERM as "re-exec", not shutdown, and
            # the API drops lifecycle.stopSignal (feature gate off). Send its
            # halt signal before the kubelet's SIGTERM so games and services
            # close cleanly within the grace period.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -s RTMIN+3 1; sleep 25"]
          env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SUNSHINE_NAME
              value: Steam
          resources:
            claims:
              - name: gpu
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              # These run on control-plane and Ceph nodes; cap a game so it
              # can't starve etcd or the OSDs.
              cpu: "6"
              memory: 12Gi
              # Schedules only onto nodes whose Talos schematic ships the
              # uinput/uhid extensions.
              devic.es/uinput: "1"
              devic.es/uhid: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/steam-headless
              subPath: state
            - name: data
              mountPath: /home/steamheadless
              subPath: home
            - name: data
              mountPath: /mnt/games
              subPath: games
            - name: journal
              mountPath: /var/log/journal
            - name: provisioning
              mountPath: /steam-headless-provisioning-password
              subPath: provisioning-password
              readOnly: true
            # Private, in-memory mounts the image expects. /dev/input keeps
            # the host's real input devices out of the desktop.
            - name: dev-input
              mountPath: /dev/input
            - name: run
              mountPath: /run
            - name: run-lock
              mountPath: /run/lock
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: steam-headless-home
        - name: provisioning
          secret:
            secretName: steam-headless
            defaultMode: 0400
        - name: journal
          emptyDir: {}
        - name: dev-input
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: run-lock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
