---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: steam-headless
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  refreshInterval: 1h
  dataFrom:
    - extract:
        # {"user_password", "sunshine_user", "sunshine_pass"}
        key: fairy-k8s01-steam-steam-headless
  target:
    name: steam-headless
    template:
      engineVersion: v2
      data:
        USER_PASSWORD: "{{ .user_password }}"
        SUNSHINE_USER: "{{ .sunshine_user }}"
        SUNSHINE_PASS: "{{ .sunshine_pass }}"
