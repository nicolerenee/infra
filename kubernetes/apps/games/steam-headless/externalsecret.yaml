---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: steam-headless
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  refreshInterval: 1h
  dataFrom:
    - extract:
        # {"user_password", "sunshine_user", "sunshine_pass"}
        key: fairy-k8s01-steam-steam-headless
  target:
    name: steam-headless
    template:
      engineVersion: v2
      data:
        # Seeds the `steamheadless` admin password (web UI, desktop and
        # Sunshine) when the appliance state is first created. Later changes
        # here don't rotate it; that happens in the web UI.
        provisioning-password: "{{ .user_password }}"
