---
# Steam Headless state, home and game library (subPaths state/, home/,
# games/). Games are re-downloadable and saves sync to Steam Cloud, so this
# isn't backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steam-headless-home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 150Gi
