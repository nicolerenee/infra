---
# Open WebUI, the household's web chat on the local models, lore and
# switchboard (C-117). Its apps and Kustomization live in the private repo
# (frecklelabs/k8s-private kubernetes/clusters/fairy-k8s01/apps/open-webui); the
# namespace is created here, like lore's, because the private root
# Kustomization targets flux-system and would rename a Namespace declared
# there. Pod Security "restricted" is enforced: Open WebUI runs non-root with
# every capability dropped.
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
