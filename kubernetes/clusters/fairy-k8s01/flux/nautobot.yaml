---
# Nautobot runs on atlantis; this namespace only holds the Cluster Mesh import
# of its Service, for nautobot-mcp in ai-mcp (C-433).
apiVersion: v1
kind: Namespace
metadata:
  name: nautobot
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nautobot-mesh-import
  namespace: &namespace nautobot
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/nautobot
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
