---
# Interactive VMs that carry broad credentials (agent and dev boxes). They get
# their own namespace, separate from appliance VMs in `vms`, because KubeVirt
# lets any VM run as any ServiceAccount in its namespace: whoever can create a
# VM here can borrow the agent identity, so this namespace is the boundary.
apiVersion: v1
kind: Namespace
metadata:
  name: dev-vms
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dev-vms-apps
  namespace: &namespace dev-vms
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/dev-vms
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
