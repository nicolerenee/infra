---
apiVersion: v1
kind: Namespace
metadata:
  name: nri-device-rules
  labels:
    # hostPath to the NRI socket is outside the baseline Pod Security level;
    # the pod itself runs with every capability dropped.
    pod-security.kubernetes.io/enforce: privileged
    # The image is private on ghcr.io.
    freckle.systems/ghcr-pull: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nri-device-rules-apps
  namespace: &namespace nri-device-rules
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/nri-device-rules
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
