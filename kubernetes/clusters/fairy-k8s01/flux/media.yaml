---
# The media namespace already exists on fairy (the arr apps kept running
# after their pointers were removed in May 2026); this re-adopts it.
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    # Opt in to the cluster-wide GHCR pull secret, for private freckleapps
    # images. Only workloads that reference `ghcr-pull` use it.
    freckle.systems/ghcr-pull: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app media-apps
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/media
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
