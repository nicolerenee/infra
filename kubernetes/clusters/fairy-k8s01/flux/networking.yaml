---
apiVersion: v1
kind: Namespace
metadata:
  name: networking
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app networking-apps
  namespace: &namespace networking
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: multus
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/networking
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  # The staged multus-dmz-qbt child is suspended; wait only for active children.
  # Add future active children here and include multus-dmz-qbt when enabled.
  wait: false
  healthChecks:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: multus-trusted
      namespace: networking
