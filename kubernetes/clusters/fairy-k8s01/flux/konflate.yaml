---
apiVersion: v1
kind: Namespace
metadata:
  name: konflate
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# Points straight at the shared app dir rather than a per-cluster apps/ tree:
# konflate is a single app whose only per-cluster difference is substituted
# values, so there is nothing for a cluster-specific overlay to hold.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app konflate
  namespace: &namespace konflate
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/flux/konflate
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      # CLUSTER_NAME scopes the render to this cluster's Flux entry point;
      # CLUSTER_SVCS_DOMAIN gives it its own hostname.
      - kind: ConfigMap
        name: k8s-cluster-info
      - kind: Secret
        name: k8s-cluster-secrets
