---
# lore, the shared memory service for agents and people. Its apps and
# Kustomization live in the private repo; the namespace is created here, like
# agent-platform's and agent-runs', because the private root Kustomization
# targets flux-system and would rename a Namespace declared there. Pod
# Security "restricted" is enforced: lore runs non-root and read-only, with
# every capability dropped.
apiVersion: v1
kind: Namespace
metadata:
  name: lore
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opt in to the cluster-wide GHCR pull secret, for the private lore
    # image. Only workloads that reference `ghcr-pull` use it.
    freckle.systems/ghcr-pull: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
