---
# Fairy-only local-model routing for the in-cluster AI gateway. Lives in the
# cluster tree (not shared apps/) on purpose: it points at fairy-only DGX vLLM,
# and atlantis also runs the EAG controller — cluster-tree placement guarantees
# these routes can never follow a shared app onto atlantis.
#
# Janet sends Anthropic Messages with model = a semantic name; the "ai" Gateway
# extracts it into x-ai-eg-model and routes here. Backend schema is OpenAI, so
# EAG translates Anthropic→OpenAI for vLLM. The concrete model id stays
# gateway-only — each rule rewrites the served name to a short semantic id via
# modelNameOverride.
#
# HA: the *-api Services are HEADLESS, so each FQDN resolves to one A record per
# ready pod and Envoy's STRICT_DNS cluster load-balances per REQUEST (round-robin)
# across the pods, dropping any that fail /health. This replaced a ClusterIP,
# which gave Envoy a single VIP endpoint and let kube-proxy pin ~99% of traffic
# to one pod (per-connection L4 LB + few long-lived upstream connections). Real
# per-request LB needs Envoy to see the pod endpoints — EDS via a direct Service
# backendRef isn't supported until EAG implements envoyproxy/ai-gateway#902, so
# headless DNS is the mechanism until then. (least-request / active-health /
# outlier-eject still unavailable: EAG requires AIServiceBackend→Backend, and
# BackendTrafficPolicy can only target a Gateway/Route — a Gateway-scoped policy
# would also hit the shared Anthropic backend. Revisit if backend-scoped traffic
# policy lands.)
# MiniMax-M2.7 (NVFP4), served by the 2-node vLLM LeaderWorkerSet. Only the
# leader exposes the OpenAI API, so the minimax-m27-nvfp4-api Service selects the
# leader pod only — this Backend resolves that single ready A record (no
# per-request LB to do; it's one serving replica across two tensor-parallel
# ranks, unlike qwen's headless multi-replica pool).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: minimax-m27-nvfp4
spec:
  endpoints:
    - fqdn:
        hostname: minimax-m27-nvfp4-api.inference.svc.cluster.local
        port: 8000
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: local-minimax-m27-nvfp4
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: minimax-m27-nvfp4
---
# Nemotron 3.5 Lightning (NVFP4 + DSpark), single Spark. Candidate fast
# structured-task model (paperless). Headless Service, one replica today.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: nemotron-35-lightning
spec:
  endpoints:
    - fqdn:
        hostname: nemotron-35-lightning.inference.svc.cluster.local
        port: 8000
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: local-nemotron-35-lightning
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: nemotron-35-lightning
---
# Qwen3.8-Flash-Next (NVFP4, TP2+EP across two Sparks). Leader-only API
# Service, like minimax.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: qwen38-flash-next
spec:
  endpoints:
    - fqdn:
        hostname: qwen38-flash-next-api.inference.svc.cluster.local
        port: 8000
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: local-qwen38-flash-next
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: qwen38-flash-next
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: local-models
spec:
  parentRefs:
    - name: ai
      kind: Gateway
      group: gateway.networking.k8s.io
  # One rule per served model: clients send the canonical served name (also what
  # surfaces in the gateway's GET /v1/models) and the override rewrites it to the
  # short id each deploy passes as --served-model-name.
  rules:
    # MiniMax-M2.7 (NVFP4). Clients send model=nvidia/MiniMax-M2.7-NVFP4 (the
    # canonical served name, also what surfaces in GET /v1/models); the override
    # sends the shorter semantic id, also in the deploy's --served-model-name.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: nvidia/MiniMax-M2.7-NVFP4
      backendRefs:
        - name: local-minimax-m27-nvfp4
          modelNameOverride: minimax-m2.7
      timeouts:
        request: 1800s
    # Nemotron 3.5 Lightning. Clients send the canonical HF id; the override is
    # the short served name.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      backendRefs:
        - name: local-nemotron-35-lightning
          modelNameOverride: nemotron-3.5-lightning
      timeouts:
        request: 1800s
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: nvidia/Qwen3.8-Flash-Next-NVFP4
      backendRefs:
        - name: local-qwen38-flash-next
          modelNameOverride: qwen3.8-flash-next
      timeouts:
        request: 1800s
