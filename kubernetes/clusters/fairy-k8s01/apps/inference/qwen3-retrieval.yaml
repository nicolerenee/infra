---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Stages the qwen3-retrieval checkpoints onto the CephFS models PVC (a pinned
# Job). Separate KS so the serving KS can wait for the Job to complete.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qwen3-retrieval-weights
  namespace: &namespace inference
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The optional HF token.
    - name: huggingface
      namespace: inference
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/inference/models/qwen3-retrieval/weights
  interval: 1h
  retryInterval: 2m
  timeout: 60m
  prune: true
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Qwen3-Embedding-8B + Qwen3-Reranker-4B on one Spark (C-349).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qwen3-retrieval
  namespace: &namespace inference
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: qwen3-retrieval-weights
      namespace: inference
    - name: resource-claims
      namespace: inference
    - name: nvidia-gpu-operator
      namespace: gpu-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/inference/models/qwen3-retrieval
  interval: 2m
  retryInterval: 1m
  timeout: 30m
  prune: true
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# One-shot verify + benchmark Job for qwen3-retrieval (C-349); runs once the
# serving KS is healthy. wait: false, the result is the Job's log.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qwen3-retrieval-check
  namespace: &namespace inference
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: qwen3-retrieval
      namespace: inference
    - name: ai-routes
      namespace: inference
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/inference/models/qwen3-retrieval/check
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
