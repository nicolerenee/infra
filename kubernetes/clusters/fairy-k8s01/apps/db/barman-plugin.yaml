---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# barman-cloud CNPG plugin (ObjectStore CRD + backup sidecar). In-tree
# barmanObjectStore is removed in CNPG 1.31; every fairy Cluster backs up
# through this instead. Fairy's operator lives in `db`, not cnpg-system.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app barman-cloud-plugin
  namespace: &namespace db
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg
      namespace: db
  path: ./kubernetes/apps/database/cloudnative-pg/barman-plugin
  targetNamespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  postBuild:
    substitute:
      CNPG_OPERATOR_NAMESPACE: db
