---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Password for the CNPG managed `paperless` role on pg-18a. Same tofu-generated
# value the paperless namespace reads as fairy-k8s01-paperless-app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: paperless-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-db-paperless-role
---
# Declarative database owned by the managed role; paperless runs its own
# Django migrations on start.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-18a-paperless
spec:
  name: paperless
  owner: paperless
  cluster:
    name: pg-18a
  ensure: present
