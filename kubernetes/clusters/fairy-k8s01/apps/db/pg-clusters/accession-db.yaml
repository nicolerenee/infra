---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accession-db-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: accession-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-db-accession-role
---
# accession's own database: requests, grabs and their event log. It needs
# no extensions.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-18a-accession
spec:
  name: accession
  owner: accession
  cluster:
    name: pg-18a
  ensure: present
