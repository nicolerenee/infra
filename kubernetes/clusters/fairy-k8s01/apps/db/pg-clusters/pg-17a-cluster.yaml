---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-17a
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-22
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 50Gi
    storageClass: ceph-block
  superuserSecret:
    name: pg-17a-secrets
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 512MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true

  backup:
    retentionPolicy: 30d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cloudnative-pg/fairy-k8s01/
      endpointURL: ${CF_R2_URL}
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster pg-17a-v1
      s3Credentials:
        accessKeyId:
          name: pg-17a-secrets
          key: aws-access-key-id
        secretAccessKey:
          name: pg-17a-secrets
          key: aws-secret-access-key

  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres17-v1
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  # externalClusters:
  #   - name: *previousCluster
  #     barmanObjectStore:
  #       <<: *barmanObjectStore
  #       serverName: *previousCluster
---
# Stopgap until mealie and windmill move to pg-18a: WAL archiving alone has
# nothing to replay onto, so without a base backup pg-17a is not restorable.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-17a-backup
spec:
  # CNPG schedule is a 6-field cron, SECONDS-FIRST (sec min hour dom mon dow).
  # A 5-field "0 0 * * *" is read as every-hour and silently produces 24x the
  # base backups. This is every 6h (00/06/12/18:00).
  schedule: "0 0 */6 * * *"
  # Take one now rather than leaving the cluster unrestorable until the next slot.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: pg-17a
  target: prefer-standby
  # pg-17a still uses the in-tree barmanObjectStore, not the barman-cloud plugin.
  method: barmanObjectStore
