---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# CNPG superuser secret for pg-18a. Password is tofu-generated and stored in
# GSM (fairy-k8s01-db-pg-18a-superuser); cnpg.io/reload lets CNPG pick up
# rotations. Also carries the S3 region the barman ObjectStore needs for
# request signing (Ceph RGW ignores the value).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-18a-superuser
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: pg-18a-superuser
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .POSTGRES_SUPER_USER }}"
        password: "{{ .POSTGRES_SUPER_PASS }}"
        s3-region: us-east-1
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-db-pg-18a-superuser
