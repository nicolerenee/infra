---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Shared role credential for CNPG and the package proxy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: package-proxy-db-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: package-proxy-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-db-package-proxy-role
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-18a-package-proxy
spec:
  name: package_proxy
  owner: package_proxy
  cluster:
    name: pg-18a
  ensure: present
