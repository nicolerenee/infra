---
# Shared PostgreSQL 18 for small services on fairy (paperless, mealie,
# windmill, litellm...). Successor to pg-17a: same shape, but backups go
# through the barman-cloud plugin (in-tree barman is removed in CNPG 1.31)
# and secrets come from GSM. Apps get a managed role + Database CR each
# (see the janet-db pattern) rather than postgres-init with the superuser.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-18a
spec:
  instances: 3
  # CNPG "standard" image — bundles pgvector, PGAudit, Failover Slots, locales, JIT.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie@sha256:9f9f53c9e07e5b2924945e6eaeb9168f7e856786d221839866ac85ccd703b3ba
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 50Gi
    storageClass: ceph-block
  superuserSecret:
    name: pg-18a-superuser
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 512MB
    # CNPG puts these between its fixed rules (local peer, replication
    # certs) and its default `host all all all scram-sha-256`, first match
    # wins. A read-only role with pg_read_all_data may connect only to its
    # own database: CONNECT is granted to PUBLIC, so without this it would
    # read every database here (C-414).
    pg_hba:
      - host bookorbit bookorbit_read all scram-sha-256
      - host all bookorbit_read all reject
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true

  # One managed role per tenant; each tenant's Database CR + role secret sits
  # in <tenant>-db.yaml in this directory.
  managed:
    roles:
      - name: mealie
        ensure: present
        login: true
        inherit: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        replication: false
        passwordSecret:
          name: mealie-db-role
      - name: paperless
        ensure: present
        login: true
        passwordSecret:
          name: paperless-db-role
      - name: grafana
        ensure: present
        login: true
        passwordSecret:
          name: grafana-db-role
      - name: bookorbit
        ensure: present
        login: true
        passwordSecret:
          name: bookorbit-db-role
      - name: accession
        ensure: present
        login: true
        passwordSecret:
          name: accession-db-role
      # Read-only reporting role for bookorbit-stats: it owns nothing and
      # gets column-level SELECT grants in BookOrbit's database from its own
      # job (the private repo holds its secret and grants).
      - name: bookorbit_stats
        ensure: present
        login: true
        connectionLimit: 10
        passwordSecret:
          name: bookorbit-stats-db-role
      - name: cockpit
        ensure: present
        login: true
        passwordSecret:
          name: cockpit-db-role
      # lore's memory store. Its row-level security only holds for a role
      # that is neither a superuser nor BYPASSRLS (lore refuses to start
      # otherwise). The secret and the Database CR are in the private repo.
      - name: lore
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: lore-db-role
      # switchboard, the people's MCP hub (frecklelabs/switchboard, C-357):
      # users, per-user backend enablement and the calls audit. The secret
      # and the Database CR are in the private repo (apps/db/switchboard).
      - name: switchboard
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: switchboard-db-role
      # Open WebUI, the household's web chat (C-117): users, chats and its
      # pgvector document index. The secret and the Database CR are in the
      # private repo (apps/db/open-webui).
      - name: openwebui
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: openwebui-db-role

      - name: package_proxy
        ensure: present
        login: true
        connectionLimit: 40
        passwordSecret:
          name: package-proxy-db-role
      # db-read (C-414): read-only SQL on BookOrbit's database for agents
      # (each query approved by Nicole) and people. pg_read_all_data reads
      # every database the role can connect to, so pg_hba below holds it to
      # bookorbit. Its settings (read-only by default, timeouts) and its
      # secret are in the private repo (apps/db/db-read).
      - name: bookorbit_read
        ensure: present
        login: true
        superuser: false
        connectionLimit: 3
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: bookorbit-read-db-role

      - name: windmill_user
        ensure: present
        login: false
        inherit: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        replication: false
        connectionLimit: -1
      - name: windmill_admin
        ensure: present
        login: false
        inherit: true
        superuser: false
        bypassrls: true
        createdb: false
        createrole: false
        replication: false
        connectionLimit: -1
        inRoles:
        - windmill_user
      - name: windmill
        ensure: present
        login: true
        inherit: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        replication: false
        connectionLimit: -1
        inRoles:
        - windmill_admin
        - windmill_user
        passwordSecret:
          name: windmill-db-role

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-18a-ceph-store
        # Bump the version suffix when recovering from a prior cluster.
        serverName: pg-18a-v1

  # When recovering from a prior cluster, uncomment and set source/serverName
  # to the previous cluster's serverName (restore the bucket from the NAS
  # mirror first if the cluster is gone — see docs/storage/fairy-backups.md).
  # bootstrap:
  #   recovery:
  #     source: &previousCluster pg-18a-v0
  # externalClusters:
  #   - name: *previousCluster
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: pg-18a-ceph-store
  #         serverName: *previousCluster
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-18a-backup
spec:
  # CNPG schedule is a 6-field cron, SECONDS-FIRST (sec min hour dom mon dow).
  # A 5-field "0 0 * * *" is read as every-hour and silently produces 24x the
  # base backups. This is every 6h (00/06/12/18:00); PITR granularity comes from
  # WAL archiving, so base-backup cadence only trades restore speed vs. storage.
  schedule: "0 0 */6 * * *"
  backupOwnerReference: self
  cluster:
    name: pg-18a
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
