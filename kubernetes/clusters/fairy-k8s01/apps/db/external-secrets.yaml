---
# k8s SA + GCP Secret Manager SecretStore for the db namespace. Authenticates
# via Workload Identity Federation — no stored credentials. The federated
# subject is system:serviceaccount:db:external-secrets-fairy-k8s01, which the
# conditional secretAccessor binding (fairy-k8s01-db-* prefix) in the private
# tofu (pg-18a.tf, module db_eso) authorises.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-fairy-k8s01
  namespace: db
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-sm
  namespace: db
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
          serviceAccountRef:
            name: external-secrets-fairy-k8s01
            namespace: db
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
