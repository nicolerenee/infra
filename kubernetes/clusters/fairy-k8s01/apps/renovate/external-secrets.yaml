---
# k8s SA + GCP Secret Manager SecretStore for the renovate namespace on fairy.
# Authenticates to GCP via Workload Identity Federation, no stored
# credentials. Reads GSM secrets under the fairy-k8s01-renovate-* prefix
# (grant in frecklelabs/tofu platform/renovate.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-fairy-k8s01
  namespace: renovate
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-sm
  namespace: renovate
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
          serviceAccountRef:
            name: external-secrets-fairy-k8s01
            namespace: renovate
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
---
# The "Freckle Renovate" GitHub App: its id and private key. run.mjs mints a
# one-hour installation token from these on every run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: renovate-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITHUB_APP_ID: "{{ .app_id }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .private_key }}"
  dataFrom:
    - extract:
        key: fairy-k8s01-renovate-github-app
---
# hostRules for ghcr.io, so private frecklelabs packages resolve. Same
# read:packages token as the cluster's ghcr-pull image-pull Secret (GSM
# fairy-k8s01-ghcr-pull), read through the cluster store that already serves
# it. A GitHub App installation token can't read GHCR, so this can't come
# from the App.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-host-rules
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm-cluster
  target:
    name: renovate-host-rules
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RENOVATE_HOST_RULES: |
          [{"matchHost": "ghcr.io", "hostType": "docker", "username": "{{ .username }}", "password": "{{ .token }}"}]
  dataFrom:
    - extract:
        key: fairy-k8s01-ghcr-pull
