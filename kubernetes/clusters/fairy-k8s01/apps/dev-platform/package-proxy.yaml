---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: package-proxy
  namespace: dev-platform
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: dev-platform
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/dev-platform/package-proxy
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
