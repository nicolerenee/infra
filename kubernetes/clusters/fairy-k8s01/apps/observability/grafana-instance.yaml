---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana-instance
  namespace: &namespace observability
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: grafana-operator
    - name: grafana-db
  targetNamespace: *namespace
  path: ./kubernetes/apps/observability/grafana/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30s
  retryInterval: 1m
  timeout: 5m
  # Fairy-only: Grafana's state lives on the shared pg-18a (CNPG managed role
  # + Database, like paperless) instead of the emptyDir default, so restarts
  # keep dashboards/preferences and two replicas can run behind the gateway
  # (alerting is vmalert's job, so nothing to coordinate between them).
  patches:
    - target:
        kind: Grafana
        name: grafana
      patch: |-
        - op: add
          path: /spec/config/database
          value:
            type: postgres
            host: pg-18a-rw.db.svc.cluster.local:5432
            name: grafana
            user: grafana
            # Password via GF_DATABASE_PASSWORD below: a $${VAR} inside this
            # pointer gets un-escaped by the parent Kustomization's own
            # post-build pass, so by the time it reaches the Grafana CR it is
            # a bare ${VAR} that strict substitution rejects.
            ssl_mode: require
        - op: add
          path: /spec/deployment/spec/replicas
          value: 2
        - op: add
          path: /spec/deployment/spec/template/spec/containers/0/env/-
          value:
            name: GF_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-db
                key: password
