---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Alertmanager -> Windmill critical-alert triage bridge (see the app dir).
# Lives in the observability tree because the objects land in this namespace
# (the VM operator only merges VMAlertmanagerConfigs it can see here).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-alert-bridge
  namespace: &namespace observability
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The VMAlertmanager (and the CRD) come from the k8s-stack release.
  dependsOn:
    - name: vm-k8s-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/ai/agents/alert-bridge
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
