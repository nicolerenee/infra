---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
# Grafana's pg-18a password (tofu grafana-db.tf). Fairy-only: Grafana's
# database lives on the shared pg-18a here; atlantis still runs the emptyDir
# default until pg-17a grows managed roles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    name: grafana-db
  dataFrom:
    - extract:
        key: ${CLUSTER_NAME}-observability-grafana-db
