---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Mealie. OIDC creds come from GSM via the namespace gcp-sm store (tofu
# mealie.tf); db/smtp/openai still come from the 1Password ClusterSecretStore
# and the database is on pg-17a — both on the migration backlog, not changed here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
  namespace: &namespace mealie
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
    - name: cloudnative-pg-clusters
      namespace: db
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/mealie
  interval: 2m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
