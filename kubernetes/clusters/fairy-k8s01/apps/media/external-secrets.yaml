---
# Per-namespace GCP Secret Manager store for media on fairy-k8s01.
# Authenticates to GSM via Workload Identity Federation as the namespace SA
# (external-secrets-fairy-k8s01). The IAM grant that lets this SA read the
# fairy-k8s01-media-* secrets is tofu-managed in the PRIVATE infra repo
# (tofu/platform/media-fairy.tf), which also mints the OIDC clients.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-fairy-k8s01
  namespace: media
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-sm
  namespace: media
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
          serviceAccountRef:
            name: external-secrets-fairy-k8s01
            namespace: media
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
