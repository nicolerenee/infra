---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/radarr
  # fairy backs PVCs up with rsync-tls to fairy-store01 (atlantis uses the
  # restic component); the choice lives on the pointer, not the shared dir.
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      # Existing fairy config PVC (`radarr-config`, 10Gi) and the UID its data
      # is owned by.
      VOLSYNC_UID: "3000"
      VOLSYNC_PVC_SUFFIX: "-config"
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "16 * * * *"
      MEDIA_PVC: store01-vault01-media
  patches:
    # The shared dir mounts the library at /store01; fairy's existing root
    # folders live under /store01/vault01.
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/persistence/media/globalMounts
          value:
            - path: /store01/vault01
    # Temporary: trial Radarr 7.0 on fairy (the smaller library, easy to
    # rebuild) before the shared HR moves atlantis. Remove when #2760 merges.
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/controllers/radarr/containers/app/image/tag
          value: 7.0.0.10815@sha256:c044b4df8e7b2546ef389481626a56fabe291575ff2d65481b1555432d6161ff

