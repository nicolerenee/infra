---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sonarr
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/sonarr
  # fairy backs PVCs up with rsync-tls to fairy-store01 (atlantis uses the
  # restic component); the choice lives on the pointer, not the shared dir.
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      # Existing fairy config PVC (`sonarr-config`, 10Gi) and the UID its data
      # is owned by.
      VOLSYNC_UID: "3000"
      VOLSYNC_PVC_SUFFIX: "-config"
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "3 * * * *"
      MEDIA_PVC: store01-vault01-media
  patches:
    # The shared dir mounts the library at /store01; fairy's existing root
    # folders live under /store01/vault01.
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/persistence/media/globalMounts
          value:
            - path: /store01/vault01
    # Sonarr v5 on fairy only — atlantis stays on the shared dir's 4.0.x
    # until v5 has proven itself here (forward-only DB migration). Hand-pinned:
    # Renovate doesn't see tags inside Flux patches, so bump this by hand or
    # drop the patch once the shared dir moves to 5.x.
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/controllers/sonarr/containers/app/image/tag
          value: 5.0.0.2668@sha256:64fc190929b50091a8d6c3d6b5f4a3df7d3b8f98d076735f5cb223f7d77b0cc3

