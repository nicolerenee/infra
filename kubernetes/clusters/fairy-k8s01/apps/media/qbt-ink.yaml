---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbt-ink
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/qbittorrent
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      # Fresh PVC (bare name) owned by the share's uid.
      VOLSYNC_UID: "3000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "23 * * * *"
      # Inside the NodePort range: the transfer-port Service uses it as its
      # nodePort too (shared HR), for inbound IPv6 to the node address.
      QBT_TRANSFER_PORT: "31493"
      MEDIA_PVC: store01-vault01-media
  patches:
    # qbt-ink's tracker whitelists specific qBittorrent versions and lags
    # upstream. Pin the image tag here so qbt-ink stays on a cleared version
    # while the shared HR (qbt-reel) tracks upstream; Renovate opens a
    # separate "for qbt-ink" PR for this line (.renovate/infraPackages.json5).
    # Bump it only after the tracker clears the new version.
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/controllers/qbittorrent/containers/app/image/tag
          # renovate: datasource=docker depName=ghcr.io/home-operations/qbittorrent
          value: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
    - target:
        kind: HelmRelease
      patch: |-
        # fairy's share root is /store01/vault01.
        - op: replace
          path: /spec/values/persistence/media/globalMounts
          value:
            - path: /store01/vault01/downloads/qbt-ink
              subPath: downloads/qbt-ink
        # Pinned LB address: the UDM DNATs the transfer port from the
        # servers' static address to this IP (private repo, udm-nat).
        - op: add
          path: /spec/values/service/transfer-port/annotations
          value:
            lbipam.cilium.io/ips: 10.189.250.31
