---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookorbit
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
    - name: cloudnative-pg-clusters
      namespace: db
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/bookorbit
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "3000"
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_SCHEDULE: "44 * * * *"
      MEDIA_PVC: store01-vault01-media
      # fairy's share: the Chaptarr-managed library lives at vault01/books.
      BOOKS_SUBPATH: books
  patches:
    # books.freckle.media is the canonical address. BookOrbit's web client
    # builds its OIDC redirect from the browser origin and the server only
    # accepts APP_URL's origin, so APP_URL must be the hostname people use;
    # the cluster hostname stays as an alias (no OIDC there).
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/route/app/hostnames
          value:
            - books.freckle.media
        # The cluster hostname can't complete OIDC (origin mismatch), so it
        # just redirects to the canonical one.
        - op: add
          path: /spec/values/route/alias
          value:
            hostnames: ["{{ .Release.Name }}.${CLUSTER_SUBDOMAIN}.freckle.media"]
            parentRefs:
              - name: public
                namespace: gateway-system
            rules:
              - filters:
                  - type: RequestRedirect
                    requestRedirect:
                      hostname: books.freckle.media
                      statusCode: 301
        - op: replace
          path: /spec/values/controllers/bookorbit/containers/app/env/APP_URL
          value: https://books.freckle.media
