---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookorbit
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
    - name: cloudnative-pg-clusters
      namespace: db
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/bookorbit
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "3000"
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_SCHEDULE: "44 * * * *"
      MEDIA_PVC: store01-vault01-media
      # fairy's share: the Chaptarr-managed library lives at vault01/books.
      BOOKS_SUBPATH: books
  patches:
    # books.freckle.media is the canonical address. BookOrbit's web client
    # builds its OIDC redirect from the browser origin and the server only
    # accepts APP_URL's origin, so APP_URL must be the hostname people use;
    # the cluster hostname stays as an alias (no OIDC there).
    - target:
        kind: HelmRelease
      patch: |-
        - op: add
          path: /spec/values/route/app/hostnames/0
          value: books.freckle.media
        - op: replace
          path: /spec/values/controllers/bookorbit/containers/app/env/APP_URL
          value: https://books.freckle.media
        # Swagger UI at /api/docs (off by default upstream); behind the same
        # JWT auth as the API itself.
        - op: add
          path: /spec/values/controllers/bookorbit/containers/app/env/SWAGGER_ENABLED
          value: "true"
        # Manga/comics (CBZ/CBR, which Chaptarr refuses) live in their own
        # tree on the share, one folder per volume; read-only like /books.
        # Graphic novels (kids' series like Cat Kid Comic Club / Dog Man) get
        # their own library, separate from books and manga.
        - op: add
          path: /spec/values/persistence/graphic-novels
          value:
            existingClaim: store01-vault01-media
            globalMounts:
              - path: /graphic-novels
                subPath: graphic-novels
                readOnly: true
        - op: add
          path: /spec/values/persistence/manga
          value:
            existingClaim: store01-vault01-media
            globalMounts:
              - path: /manga
                subPath: manga
                readOnly: true
