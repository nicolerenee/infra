---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qui
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/qui
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "11 * * * *"
      # qui's id for this cluster's qbt-reel (the seeded-search CronJob).
      QUI_REEL_INSTANCE_ID: "1"
      MEDIA_PVC: store01-vault01-media
  patches:
    - target:
        kind: HelmRelease
      patch: |-
        - op: replace
          path: /spec/values/persistence/media/globalMounts
          value:
            - path: /store01/vault01
