---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cilium
  namespace: &namespace kube-system
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  targetNamespace: *namespace
  path: ./kubernetes/apps/networking/cilium/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  patches:
    - target:
        kind: HelmRelease
      patch: |-
        - op: add
          path: /spec/values
          value:
            bandwidthManager:
              enabled: true
              bbr: false
            # Nodes peer with fairy-udm01 to announce LoadBalancer IPs and the
            # per-node pod CIDRs; the peering itself is in ./bgp (own
            # Kustomization, dependsOn cilium).
            bgpControlPlane:
              enabled: true
            # Cluster Mesh identity. Changing name/id re-allocates every
            # security identity (ID is encoded in them), so this is a
            # restart-everything change. atlantis-k8s01 is id 1.
            cluster:
              name: fairy-k8s01
              id: 2
            # Native routing instead of VXLAN: nodes share one L2 segment
            # (VLAN 1000) so autoDirectNodeRoutes handles the intra-cluster
            # routes, and the UDM learns the pod /24s over BGP. Pods keep the
            # 9000 MTU of the uplinks and cross-site traffic (IPsec to den1,
            # path MTU 1400) is handled by PMTUD / the tunnel's MSS clamp
            # instead of fragmenting VXLAN. The native-routing CIDR covers
            # BOTH clusters' pod ranges (10.230/16 here, 10.244/16 atlantis)
            # so cross-cluster pod traffic is not masqueraded.
            routingMode: native
            autoDirectNodeRoutes: true
            ipv4NativeRoutingCIDR: 10.224.0.0/11
            ipv6NativeRoutingCIDR: fd2b:ec92:e232::/48
            clustermesh:
              useAPIServer: true
              # Rendering the peer config (even with no peers yet) is what
              # makes the chart emit the clustermesh-remote-users ConfigMap
              # and cilium-clustermesh Secret the apiserver mounts; without
              # it the pods never leave Init. Remote clusters get listed
              # here once atlantis exposes its apiserver.
              config:
                enabled: true
              apiserver:
                replicas: 2
                tls:
                  auto:
                    enabled: true
                    # Leaf certs from the shared mesh CA (cert-manager
                    # ClusterIssuer fed by GSM), so atlantis trusts them.
                    method: certmanager
                    certManagerIssuerRef:
                      group: cert-manager.io
                      kind: ClusterIssuer
                      name: cilium-clustermesh-ca
                service:
                  type: LoadBalancer
                  labels:
                    ipam.freckle.systems/lb-pool: internal
                  annotations:
                    # Pinned: this address is what atlantis is told to dial.
                    lbipam.cilium.io/ips: 10.189.250.250
            bpf:
              datapathMode: netkit
              preallocateMaps: true
              distributedLRU:
                enabled: true
              # The home LAN VLAN is bridged onto br-homelan via bond0.<id>
              # for KubeVirt VMs and macvlan-style pods (scrypted,
              # esphome). Cilium's TCX program on bond0 drops VLAN-tagged
              # ingress with "VLAN traffic disallowed by VLAN filter"
              # unless the VLAN is in this bypass list. Auto-detection
              # only registers VLAN sub-interfaces that have an IP at
              # agent startup, which is fragile; explicit bypass is
              # the durable fix.
              # Keep this in step with the VLANConfig in
              # clusters/fairy-k8s01/talos/control-plane/40-network.yaml.tpl.
              vlanBypass:
                - 500
            loadBalancer:
              algorithm: maglev
            bpfClockProbe: true
