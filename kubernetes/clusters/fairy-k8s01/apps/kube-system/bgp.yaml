---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Fairy-only BGP peering (Cilium nodes -> fairy-udm01). Lives in the cluster
# tree because the peer address and ASNs are this site's; atlantis has its own
# ToR peering. Separate from the cilium Kustomization so these CRs can never
# be applied before the CRDs they need exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cilium-bgp
  namespace: &namespace kube-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/fairy-k8s01/apps/kube-system/bgp
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
