---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway-system
components:
  - ../_shared/cluster-info
  - ../../../../components/flux-post-build-variables
resources:
  - ./certificates.yaml
  - ./gateways.yaml
  - ./mcp-gateway.yaml
patches:
  # A required private source prevents reconciling a pin without its address.
  - target:
      kind: Kustomization
      name: gateway-configs
    patch: |-
      - op: add
        path: /spec/postBuild/substituteFrom/-
        value:
          kind: ConfigMap
          name: site-public-values
          optional: false
