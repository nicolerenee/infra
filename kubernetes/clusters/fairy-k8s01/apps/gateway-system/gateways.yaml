---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gateway-configs
  namespace: &namespace gateway-system
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    - name: envoy-gateway-crds
      namespace: envoy-gateway-system
  targetNamespace: *namespace
  path: ./kubernetes/apps/networking/envoy-gateway/gateways
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      # Internal gateway address (internal LB pool; BGP-routed on site).
      INTERNAL_GW_IP: 10.189.250.20
  # fairy runs the shared public Gateway as-is: no pinned address (Cilium
  # assigns one from the public pool and external-dns publishes whatever it
  # gets). The shared redirect route only lists the shared-on-every-cluster
  # gateways, so add the public:http parent back here.
  patches:
    - target:
        kind: HTTPRoute
        name: httpsredirect
      patch: |-
        - op: add
          path: /spec/parentRefs/-
          value:
            name: public
            sectionName: http
