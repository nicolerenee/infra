---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gateway-configs
  namespace: &namespace gateway-system
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    - name: envoy-gateway-crds
      namespace: envoy-gateway-system
  targetNamespace: *namespace
  path: ./kubernetes/apps/networking/envoy-gateway/gateways
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      # Internal gateway address (internal LB pool; BGP-routed on site).
      INTERNAL_GW_IP: 10.189.250.20
  patches:
    # Keep the public listener on the address matched by the site's WAN rules.
    - target:
        kind: Gateway
        name: public
      patch: |-
        - op: add
          path: /spec/infrastructure/annotations
          value:
            lbipam.cilium.io/ips: ${SITE_FAIRY_PUBLIC_V4_GATEWAY}
    # Restrict the apex to games routes without changing existing listeners.
    - target:
        kind: Gateway
        name: tailnet
      patch: |-
        - op: add
          path: /spec/listeners/-
          value:
            name: https-games
            protocol: HTTPS
            port: 443
            hostname: freckle.games
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    kubernetes.io/metadata.name: games
            tls:
              certificateRefs:
                - kind: Secret
                  name: games-tls
