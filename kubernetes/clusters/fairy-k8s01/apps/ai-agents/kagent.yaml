---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent
  namespace: &namespace ai-agents
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # CRDs first; this chart's generated ModelConfig is a kagent CR.
  dependsOn:
    - name: kagent-crds
      namespace: ai-agents
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/ai/agents/kagent
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
