---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cluster-triage
  namespace: &namespace ai-agents
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kagent
      namespace: ai-agents
    - name: mcp-servers
      namespace: ai-agents
    - name: log-search
      namespace: ai-agents
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/ai/agents/cluster-triage
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
