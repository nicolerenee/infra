---
# The atlantis-k8s01 instance: same method, atlantis' MCP servers over Cluster Mesh.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app log-search-atlantis
  namespace: &namespace ai-agents
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kagent
      namespace: ai-agents
    - name: mcp-gateway-access
      namespace: ai-agents
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/ai/agents/log-search
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  postBuild:
    substitute:
      AGENT_SUFFIX: "-atlantis"
      MCP_SUFFIX: "-atlantis"
      # Backend prefix the MCP gateway puts on tool names (<server>-<cluster>__).
      MCP_TARGET: atlantis
      TRIAGE_CLUSTER: atlantis-k8s01
