---
# k8s SA + GCP Secret Manager SecretStore for konflate on fairy-k8s01.
# WIF, so no credential is stored here.
#
# Unlike most namespaces, konflate is NOT granted the
# `<cluster>-<namespace>-*` GSM prefix — that grant comes from tofu's
# `oidc_eso` module, which runs per (cluster, namespace) pair owning an OIDC
# client, and konflate owns none. Instead tofu binds this exact SA as
# secretAccessor on the single secret `konflate-webhook-fairy-k8s01`
# (private repo, tofu/platform/konflate-webhook.tf). Anything else it tries to
# read will fail on RBAC by design.
#
# SA is named for the CLUSTER, not the namespace, because that is what the
# tofu binding grants against — matching atlantis rather than fairy's older
# `external-secrets-<namespace>` stores.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-fairy-k8s01
  namespace: konflate
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-sm
  namespace: konflate
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
          serviceAccountRef:
            name: external-secrets-fairy-k8s01
            namespace: konflate
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/fairy-k8s01
