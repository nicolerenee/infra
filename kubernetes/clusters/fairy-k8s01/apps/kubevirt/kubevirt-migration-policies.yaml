---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kubevirt-migration-policies
  namespace: kubevirt
spec:
  # The operator creates the MigrationPolicy CRD only after the KubeVirt CR
  # is reconciled; without this ordering a fresh cluster's dry-run fails.
  dependsOn:
    - name: kubevirt-cr
      namespace: kubevirt
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/kubevirt/migration-policies
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
