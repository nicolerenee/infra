---
# Accept both endpoint audiences while projected tokens rotate through the
# maintenance window. The public OIDC issuer remains an API-server extraArg.
# Retire the legacy audience separately after every old token has expired.
apiVersion: v1alpha1
kind: KubeServiceAccountConfig
issuer:
  issuerURL: https://api.fairy-k8s01.freckle.services:6443
accepted:
  audiences:
    - https://api.fairy-k8s01.freckle.services:6443
    - https://fairy-k8s01-api.freckle.systems:6443
