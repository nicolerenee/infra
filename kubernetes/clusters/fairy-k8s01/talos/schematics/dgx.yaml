---
# NVIDIA DGX Spark (GB10, arm64, secureboot UKI).
customization:
  extraKernelArgs:
    - arm64.nobti
    # DGX OS default that Talos lacks: the ConnectX-7 (01:00.0/.1) and its root
    # port negotiate PCIe MaxPayload 128 B although DevCap allows 512 B, which
    # caps NCCL all-reduce over the 200G link at ~130-165 Gb/s. pcie_bus_safe
    # raises every device's MPS to the largest value its parent bus supports
    # (178-189 Gb/s after the fix in the Spark guide's measurements).
    - pci=pcie_bus_safe
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/lldpd
      - siderolabs/nvidia-container-toolkit-production
      # Open-source drivers cause CUDA initialization failures in containers (cuInit error 3)
      # - siderolabs/nvidia-open-gpu-kernel-modules-production
      # Proprietary drivers required for CUDA to work properly on DGX Spark (GB10)
      - siderolabs/nonfree-kmod-nvidia-production
