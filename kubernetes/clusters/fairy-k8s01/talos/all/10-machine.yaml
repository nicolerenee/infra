---
apiVersion: v1alpha1
kind: ResolverConfig
# Internal DNS (docs/networking/internal-dns.md): the UDM is the resolver for
# everything at fairy; it forwards the hosted zones to the fairy secondary and
# resolves the rest itself. Compute-VLAN gateway address.
nameservers:
  - address: 10.189.3.1
searchDomains:
  disableDefault: true
# Host DNS caching resolver.
hostDNS:
  enabled: true
  # Cilium update "broke" this so disabling it
  # * https://github.com/cilium/cilium/issues/35153
  # * https://github.com/siderolabs/talos/pull/9200
  forwardKubeDNSToHost: false
  resolveMemberNames: true
---
# Containerd customization
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: freckle
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
  [plugins."io.containerd.nri.v1.nri"]
    disable = false
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # Kubernetes essentials
  fs.inotify.max_user_watches: "1048576"
  fs.inotify.max_user_instances: "8192"
  user.max_user_namespaces: "11255"

  # Network - 25Gb optimized
  net.core.default_qdisc: fq
  net.core.rmem_max: "67108864"
  net.core.wmem_max: "67108864"
  net.core.netdev_max_backlog: "30000"
  net.ipv4.tcp_fastopen: "3"
  net.ipv4.tcp_rmem: 4096 131072 67108864
  net.ipv4.tcp_wmem: 4096 131072 67108864
  net.ipv4.tcp_slow_start_after_idle: "0"
  net.ipv4.tcp_fin_timeout: "30"
  net.ipv4.tcp_keepalive_time: "600"
  net.ipv4.tcp_keepalive_intvl: "30"
  net.ipv4.tcp_keepalive_probes: "10"

  # NFS optimations
  sunrpc.tcp_slot_table_entries: "128"
  sunrpc.tcp_max_slot_table_entries: "128"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  wipe: true
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  # Let IPv6 RAs through on 'net1' for thread announcements getting to HA additional NIC
  allowedUnsafeSysctls:
    - net.ipv6.conf.net1.accept_ra_rt_info_max_plen
  # Make image cleanup more aggressive
  imageMaximumGCAge: 168h # One week
  imageGCHighThresholdPercent: 50 # Default is 85%
  imageGCLowThresholdPercent: 20 # Default is 80%
  # Equivalent of `rotate-server-certificates` arg, for one less thing
  serverTLSBootstrap: true
  # The default of 110 leaves no room to drain a cn node: the three amd64
  # nodes run ~290 pods, so the other two must absorb ~70 more. When they
  # couldn't, the drain evicted rook-ceph-operator, which then couldn't
  # reschedule to relax the OSD PDB, and the upgrade deadlocked. Each node's
  # pod CIDR is a /24, so 200 stays well inside the address space.
  maxPods: 200
  clusterDNS:
    - 10.229.0.10
    - fd2b:ec92:e230:1::a
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.189.3.0/24
    # On-link ULA for the compute VLAN (see 40-network). Registering it as the
    # node's IPv6 InternalIP is what lets Cilium (native routing) install
    # IPv6 direct routes to each node's pod /64 via a reachable next hop;
    # without it Cilium falls back to the cilium_host address inside the pod
    # range, which is not on-link.
    - fd2b:ec92:e233::/64
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - time.cloudflare.com # leave it as cloudflare but the router will hijack this and respond
---
# Still v1alpha1: seccompProfiles has no multi-doc equivalent in 1.14.
#
# Node-local seccomp profile for the janet-coding namespace's sandbox pods:
# denies the cross-process memory-read syscalls (ptrace, process_vm_readv/
# writev, process_madvise, kcmp). Talos writes it to
# /var/lib/kubelet/seccomp/profiles/janet-no-ptrace.json; pods select it via
# localhostProfile: profiles/janet-no-ptrace.json.
machine:
  seccompProfiles:
    - name: janet-no-ptrace.json
      value:
        defaultAction: SCMP_ACT_ALLOW
        architectures:
          - SCMP_ARCH_X86_64
          - SCMP_ARCH_X86
          - SCMP_ARCH_X32
        syscalls:
          - names:
              - ptrace
              - process_vm_readv
              - process_vm_writev
              - process_madvise
              - kcmp
            action: SCMP_ACT_ERRNO
            errnoRet: 1
    # Steam's bubblewrap (pressure-vessel) under a pod user namespace, C-895.
    # containerd 2.3.7's RuntimeDefault for a container that dropped every
    # capability, plus the namespace syscalls (clone, clone3, setns, unshare),
    # the mount operations bubblewrap performs inside the user namespace it
    # creates (mount, umount2, pivot_root, sethostname) and chroot, which
    # Chromium's sandbox zygote (Steam's web helper) uses inside the user
    # namespace it creates. Nothing else moved; the kernel's capability checks
    # still gate those syscalls, which is why this is only safe together with
    # hostUsers: false and drop ALL. Source, derivation and the equality check:
    # ../seccomp/README.md.
    - name: runtime-default-userns.json
      value:
        defaultAction: SCMP_ACT_ERRNO
        architectures:
          - SCMP_ARCH_X86_64
          - SCMP_ARCH_X86
          - SCMP_ARCH_X32
