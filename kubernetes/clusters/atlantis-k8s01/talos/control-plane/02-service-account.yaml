---
# Pins the service-account token audience. Talos derives this from
# clusterEndpoint, and kube-apiserver only accepts tokens whose `aud` is in
# --api-audiences, so letting it follow the endpoint rename would reject every
# running pod's projected token until kubelet rotated it (up to an hour of
# cluster-wide auth failures). The value is the audience the cluster has always
# had (the old IP endpoint); it is only an identifier. The actual token issuer
# is the service-account-issuer extraArg (k8s-oidc).
apiVersion: v1alpha1
kind: KubeServiceAccountConfig
issuer:
  issuerURL: https://172.26.3.16:6443
