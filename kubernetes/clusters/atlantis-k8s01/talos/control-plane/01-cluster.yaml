---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  # SA token issuer is decoupled from the cluster's API endpoint
  # so external validators (GCP WIF) can fetch the OIDC discovery
  # + JWKS over the public internet. Hosted on Cloudflare R2 via
  # the k8s-oidc.freckle.systems custom domain. Update via
  # `task wif:publish CLUSTER=atlantis-k8s01` whenever the
  # cluster's SA signing key rotates (rare on talos).
  service-account-issuer: "https://k8s-oidc.freckle.systems/atlantis-k8s01"
---
# Audit log every request at Metadata level. Talos writes to
# /var/log/audit/kube-apiserver.log on each CP node; the
# observability/vector DaemonSet tails it via the hostPath
# /var/log/ mount and ships to VictoriaLogs.
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  rules:
    - level: Metadata
      omitStages:
        - RequestReceived
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
  node-cidr-mask-size-ipv6: 64
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Cilium replaces kube-proxy.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# K8s Talos API access (a control-plane-only document in 1.14)
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:reader
  - os:admin
allowedKubernetesNamespaces:
  - actions-runner-system
  - system-upgrade
---
# Control planes are schedulable (was allowSchedulingOnMasters).
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
# Still v1alpha1: cluster.etcd is not deprecated in 1.14.
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: "http://0.0.0.0:2381"
