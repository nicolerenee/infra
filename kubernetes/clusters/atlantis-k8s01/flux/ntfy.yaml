---
# ntfy runs on fairy; this namespace only holds the Cluster Mesh import of
# its Service, for Gatus's cockpit watch (C-212).
apiVersion: v1
kind: Namespace
metadata:
  name: ntfy
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ntfy-mesh-import
  namespace: &namespace ntfy
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/atlantis-k8s01/apps/ntfy
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
