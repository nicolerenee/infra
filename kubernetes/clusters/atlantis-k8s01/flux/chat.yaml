---
apiVersion: v1
kind: Namespace
metadata:
  name: chat
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app chat-apps
  namespace: &namespace chat
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/clusters/atlantis-k8s01/apps/chat
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
