---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tracearr
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/media/tracearr
  # Backup flavour is a per-cluster choice: atlantis mirrors PVCs with the
  # restic component, fairy uses rsync-tls to its own NAS.
  components:
    - ../../../components/volsync
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      # Image user 1001 (tracearr:nodejs); the mover must match it.
      VOLSYNC_UID: "1001"
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "41 * * * *"
