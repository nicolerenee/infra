---
# Atlantis-specific homepage layout. {{HOMEPAGE_VAR_*}} tokens are NOT
# Helm syntax — homepage substitutes them at runtime against env vars
# from homepage-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: Atlantis
    subtitle: Site overview
    theme: dark
    color: slate
    headerStyle: clean
    target: _blank
    hideVersion: true
    disableUpdateCheck: true
    statusStyle: dot
    layout:
      Downloaders:
        style: row
        columns: 3

  services.yaml: |
    - Downloaders:
        - SABnzbd:
            href: https://sabnzbd.atlantis.freckle.systems
            siteMonitor: http://sabnzbd.media
            icon: sabnzbd.png
            description: Usenet
            widget:
              type: sabnzbd
              url: http://sabnzbd.media
              key: "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}"
        - qbt-reel:
            href: https://qui.atlantis.freckle.media
            icon: qbittorrent.png
            description: TV & movies
            widget:
              type: qbittorrent
              url: "{{HOMEPAGE_VAR_QBT_REEL_URL}}"

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          hourCycle: h23

  bookmarks.yaml: |
    []
---
# Pulls only the API keys / proxy URLs we already have. Add more
# (jellyfin_api_key, jellyseerr_api_key) to the
# atlantis-k8s01-media-homepage GSM secret later to enable widgets on those tiles.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: gcp-sm
  target:
    template:
      data:
        HOMEPAGE_VAR_SABNZBD_API_KEY: "{{ .sabnzbd_api_key }}"
        HOMEPAGE_VAR_QBT_REEL_URL: '{{ index . "qbt-reel-proxy-url" }}'
  dataFrom:
    - extract:
        key: atlantis-k8s01-media-sabnzbd
      rewrite:
        - regexp:
            source: "(.*)"
            target: "sabnzbd_$1"
    - extract:
        key: atlantis-k8s01-media-homepage
