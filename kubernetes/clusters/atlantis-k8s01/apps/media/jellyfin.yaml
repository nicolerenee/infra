---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Jellyfin 12 on atlantis: the full library (the datacenter has the storage;
# fairy carries what fits at home). Fresh v12 install, no config carried over.
# Watch state between the two Jellyfins (and the Plex/Emby migration) is a
# separate sync job.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi-block
      namespace: truenas-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/media/jellyfin
  # rsync-tls backups like fairy: the config PVC mirrors into its own dataset
  # under store01/kubernetes/backups/atlantis-k8s01, history is ZFS snapshots.
  components:
    - ../../../components/volsync-rsync-tls
  interval: 2m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "3000"
      VOLSYNC_CAPACITY: 100Gi
      VOLSYNC_SCHEDULE: "41 * * * *"
      # Config/database on store01's SSD pool over iSCSI (see the class for
      # the benchmark); pre-sync snapshots via the TrueNAS snapshot class.
      VOLSYNC_STORAGE_CLASS: truenas-iscsi
      VOLSYNC_SNAPSHOT_CLASS: truenas-csi
  patches:
    - target:
        kind: HelmRelease
      patch: |-
        # The media export, read-only, at atlantis's /store01 layout.
        - op: replace
          path: /spec/values/persistence/media
          value:
            existingClaim: store01-media
            globalMounts:
              - path: /store01
                readOnly: true
        # Image cache next to the config on the SSD pool.
        - op: add
          path: /spec/values/persistence/cache/storageClass
          value: truenas-iscsi
        # watch.freckle.media belongs to fairy; atlantis answers on its own
        # cluster hostname only.
        - op: replace
          path: /spec/values/route/app/hostnames
          value:
            - "{{ .Release.Name }}.${CLUSTER_SUBDOMAIN}.freckle.media"
        - op: replace
          path: /spec/values/controllers/jellyfin/containers/app/env/JELLYFIN_PublishedServerUrl
          value: https://jellyfin.${CLUSTER_SUBDOMAIN}.freckle.media
