---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbt-reel
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  interval: 1h
  path: ./kubernetes/apps/media/qbittorrent
  # Mirror backups with rsync-tls after the Prowlarr restore check (C-38).
  components:
    - ../../../components/volsync-rsync-tls
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "943"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "47 * * * *"
      # Inside the NodePort range: the transfer-port Service uses it as its
      # nodePort too (patch below), for inbound IPv6 to the node address.
      QBT_TRANSFER_PORT: "32219"
  patches:
    # The live PVC was created by the restic component, which restores from a
    # bootstrap ReplicationDestination via dataSourceRef. The rsync-tls PVC has
    # none, and PVC spec is immutable, so dropping it would fail the apply.
    # Keep it as it is on the bound PVC; it does nothing after binding.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${APP}${VOLSYNC_PVC_SUFFIX:=}
        spec:
          dataSourceRef:
            apiGroup: volsync.backube
            kind: ReplicationDestination
            name: ${APP}${VOLSYNC_PVC_SUFFIX:=}-bootstrap
    # qbt-reel-only: read-only access to the TV and Movies libraries.
    # Main qbt deliberately doesn't get these — only reel needs them.
    - target:
        kind: HelmRelease
      patch: |-
        - op: add
          path: /spec/values/persistence/media/globalMounts/-
          value:
            path: /store01/TV
            subPath: TV
            readOnly: true
        - op: add
          path: /spec/values/persistence/media/globalMounts/-
          value:
            path: /store01/Movies
            subPath: Movies
            readOnly: true
        # nodePort = transfer port: peers dial <node IPv6>:<port> (pod IPv6
        # egress leaves from the node's public IPv6); eTP Local, so only the
        # pod's node answers. IPv4 still arrives via the LB IP (border1 DNAT).
        - op: add
          path: /spec/values/service/transfer-port/ports/transfer-port/nodePort
          value: 32219
