---
# Temporary restore target approved in C-38; never mount the live app PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-restore-check-c38
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-restore-check-c38
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore-check
          image: mirror.gcr.io/python:3.15.2-slim
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          command: [python3, -B, -c]
          args:
            - |
              import hashlib
              import os
              import shutil
              import sqlite3
              from pathlib import Path

              source = Path('/backup')
              target = Path('/restore')

              def inventory(root):
                  result = {}
                  for directory, dirs, files in os.walk(root):
                      dirs[:] = sorted(d for d in dirs if d not in ('.zfs', 'lost+found'))
                      for name in sorted(files):
                          path = Path(directory) / name
                          if path.is_symlink():
                              raise RuntimeError('Unexpected symlink in backup')
                          relative = str(path.relative_to(root))
                          with path.open('rb') as stream:
                              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                          result[relative] = (path.stat().st_size, digest)
                  return result

              before = inventory(source)
              assert 'prowlarr.db' in before, 'Backup database missing'
              for name in before:
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source / name, destination)
              restored = inventory(target)
              assert before == inventory(source), 'Backup changed during restore; retry between syncs'
              assert before == restored, 'Restored files differ from backup'
              print(f'Restored {len(restored)} files, {sum(size for size, digest in restored.values())} bytes; all SHA256 hashes match', flush=True)
              for name, (size, digest) in sorted(restored.items()):
                  print(f'{name}: {size} bytes', flush=True)
              for name in sorted(restored):
                  if name.endswith('.db'):
                      with sqlite3.connect(str(target / name)) as db:
                          result = db.execute('PRAGMA integrity_check').fetchall()
                          assert result == [('ok',)], f'Database integrity check failed: {name}'
                          count = db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
                          assert count > 0, f'Database has no tables: {name}'
                          print(f'{name}: integrity_check=ok, tables={count}', flush=True)
              print('RESTORE CHECK PASSED', flush=True)
          volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
            - name: restore
              mountPath: /restore
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: prowlarr-backup
            readOnly: true
        - name: restore
          persistentVolumeClaim:
            claimName: prowlarr-restore-check-c38
