---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qui
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  interval: 1h
  path: ./kubernetes/apps/media/qui
  # Mirror backups with rsync-tls after the Prowlarr restore check (C-38).
  components:
    - ../../../components/volsync-rsync-tls
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "11 * * * *"
      # qui's id for this cluster's qbt-reel (the seeded-search CronJob).
      QUI_REEL_INSTANCE_ID: "5"
      QUI_SEEDED_SEARCH_DAYS: "12,27"
      # One search every 3 min: at 60 s, a run lost ~600 torrents to indexer
      # rate limits. A full pass (~2500 torrents) still finishes in ~5 days.
      QUI_SEEDED_SEARCH_INTERVAL_SECONDS: "180"
  patches:
    # The live PVC was created by the restic component, which restores from a
    # bootstrap ReplicationDestination via dataSourceRef. The rsync-tls PVC has
    # none, and PVC spec is immutable, so dropping it would fail the apply.
    # Keep it as it is on the bound PVC; it does nothing after binding.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${APP}${VOLSYNC_PVC_SUFFIX:=}
        spec:
          dataSourceRef:
            apiGroup: volsync.backube
            kind: ReplicationDestination
            name: ${APP}${VOLSYNC_PVC_SUFFIX:=}-bootstrap
    # The first file mirror exceeds the live PVC's size on the backup filesystem.
    # Leave headroom for allocation overhead and later syncs without resizing live data.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${APP}${VOLSYNC_PVC_SUFFIX:=}-backup
        spec:
          resources:
            requests:
              storage: 4Gi
