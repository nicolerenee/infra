---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tautulli
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/media/tautulli
  # Backup flavour is a per-cluster choice: atlantis mirrors PVCs with the
  # restic component, fairy uses rsync-tls to its own NAS.
  components:
    - ../../../components/volsync
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "31 * * * *"
  patches:
    # PARKED (2026-10-20): retired with Plex; scaled to zero, no routes. Config PVC
    # and its VolSync backups are kept; delete this patch to bring it back.
    - target:
        kind: HelmRelease
      patch: |-
        - op: add
          path: /spec/values/controllers/tautulli/replicas
          value: 0
        - op: remove
          path: /spec/values/route
