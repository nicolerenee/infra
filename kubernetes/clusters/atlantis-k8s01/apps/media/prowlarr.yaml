---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prowlarr
  namespace: &namespace media
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: truenas-csi
      namespace: truenas-csi
  interval: 1h
  path: ./kubernetes/apps/media/prowlarr
  # rsync-tls backups like fairy: the PVC mirrors into its own dataset under
  # store01/kubernetes/backups/atlantis-k8s01, history is ZFS snapshots.
  # First atlantis app moved off restic (C-38).
  components:
    - ../../../components/volsync-rsync-tls
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_UID: "1000"
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_SCHEDULE: "6 * * * *"
  patches:
    # The live PVC was created by the restic component, which restores from a
    # bootstrap ReplicationDestination via dataSourceRef. The rsync-tls PVC has
    # none, and PVC spec is immutable, so dropping it would fail the apply.
    # Keep it as it is on the bound PVC; it does nothing after binding.
    - patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${APP}${VOLSYNC_PVC_SUFFIX:=}
        spec:
          dataSourceRef:
            apiGroup: volsync.backube
            kind: ReplicationDestination
            name: ${APP}${VOLSYNC_PVC_SUFFIX:=}-bootstrap
