---
# Every PV democratic-csi provisioned (nas-garage's) names these Secrets in its
# CSI spec, and kubelet refuses to stage or publish the volume when one is
# missing. The chart used to render them, empty, from the old `truenas-iscsi`
# StorageClass entry; dropping that class (#2673) deleted them, and garage's
# next pod restart couldn't mount its volume. They carry no data: the driver
# reads its config from the driver-config secret. Remove them once no PV uses
# org.democratic-csi.freenas-iscsi.
apiVersion: v1
kind: Secret
metadata:
  name: node-stage-secret-truenas-iscsi-democratic-csi
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: node-publish-secret-truenas-iscsi-democratic-csi
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: controller-publish-secret-truenas-iscsi-democratic-csi
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: controller-expand-secret-truenas-iscsi-democratic-csi
type: Opaque
