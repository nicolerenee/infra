---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homebox
  namespace: &namespace homebox
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  path: ./kubernetes/apps/homebox/homebox
  # Include the private source reference without publishing its identifier.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: k8s-cluster-info
      - kind: Secret
        name: k8s-cluster-secrets
      - kind: Secret
        name: namespace-post-build-secrets
        optional: true
      - kind: ConfigMap
        name: homebox-secret-source
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
