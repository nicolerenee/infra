---
# k8s SA + GCP Secret Manager SecretStore for kube-system on atlantis. Used by
# the Hubble OIDC client secret (pocket-id client tofu-managed; GSM key
# atlantis-k8s01-kube-system-hubble-oidc). The IAM grant is the oidc_eso module
# in the private repo's pocketid.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-atlantis-k8s01
  namespace: kube-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-sm
  namespace: kube-system
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/atlantis-k8s01
          serviceAccountRef:
            name: external-secrets-atlantis-k8s01
            namespace: kube-system
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/atlantis-k8s01
