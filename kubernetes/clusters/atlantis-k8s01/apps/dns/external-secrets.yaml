---
# k8s SA + GCP Secret Manager SecretStore for the dns namespace on atlantis.
# The IAM grant (tofu eso-namespace module, internal-dns.tf in the private
# repo) scopes it to secrets named atlantis-k8s01-dns-*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-atlantis-k8s01
  namespace: dns
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-sm
  namespace: dns
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/atlantis-k8s01
          serviceAccountRef:
            name: external-secrets-atlantis-k8s01
            namespace: dns
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/atlantis-k8s01
