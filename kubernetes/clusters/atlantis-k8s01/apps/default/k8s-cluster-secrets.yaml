---
# The only substitution variable that genuinely has to stay out of a public
# repo. Every other domain we run — freckle.chat, freckle.media,
# freckle.services, freckle.id, freckle.systems — is already committed here in
# plaintext (hostnames, Gateway listeners, Certificate SANs) and published in
# Certificate Transparency logs besides, so routing them through a Secret only
# obscured them from us. They are now written literally where they are used.
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-cluster-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      data:
        TAILNET_DOMAIN: "{{ .tailnet_domain }}"
  dataFrom:
    - extract:
        key: domains
