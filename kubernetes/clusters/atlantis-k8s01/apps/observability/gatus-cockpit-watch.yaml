---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Gatus here watches cockpit on fairy and pushes to ntfy if it stops
# answering (see the app dir); the gatus Kustomization mounts what this
# makes. Atlantis only: a watch on the other cluster survives fairy's
# cockpit going down.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus-cockpit-watch
  namespace: &namespace observability
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/observability/gatus-cockpit-watch
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
