---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus
  namespace: &namespace observability
  labels:
    infra.freckle.systems/post-build-variables: enabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: gatus-cockpit-watch
  targetNamespace: *namespace
  path: ./kubernetes/apps/observability/gatus
  # The cockpit watch (gatus-cockpit-watch.yaml): one more file in Gatus's
  # config dir, and the ntfy token it reads as NTFY_TOKEN.
  patches:
    - target:
        kind: HelmRelease
        name: gatus
      patch: |-
        - op: add
          path: /spec/values/persistence/cockpit-watch
          value:
            type: configMap
            name: gatus-cockpit-watch
            globalMounts:
              - path: /config/cockpit-watch.yaml
                subPath: cockpit-watch.yaml
                readOnly: true
        - op: add
          path: /spec/values/controllers/gatus/containers/app/envFrom
          value:
            - secretRef:
                name: gatus-ntfy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30s
  retryInterval: 1m
  timeout: 5m
