---
# Cluster Mesh routes this name only to the Atlantis ops-mcp instance.
apiVersion: v1
kind: Service
metadata:
  name: ops-mcp-atlantis
  annotations:
    service.cilium.io/global: "true"
spec:
  type: ClusterIP
  selector:
    app: ops-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
