---
# yaml-language-server: $schema=https://k8s-schemas.freckle.systems/external-secrets.io/clustersecretstore_v1.json
# Cluster-scoped GSM store for atlantis (fairy has the same one). For
# cluster-infra credentials that live outside any app namespace, e.g. the
# TrueNAS CSI API key (atlantis-k8s01-truenas-csi). Authenticates via Workload
# Identity Federation as the flux-system ESO SA external-secrets-atlantis-k8s01;
# each secret's IAM grant lives next to it in the private tofu.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-sm-cluster
spec:
  provider:
    gcpsm:
      projectID: freckle-secrets-db8d4f
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/atlantis-k8s01
          serviceAccountRef:
            name: external-secrets-atlantis-k8s01
            namespace: flux-system
            audiences:
              - //iam.googleapis.com/projects/305363951351/locations/global/workloadIdentityPools/k8s-clusters/providers/atlantis-k8s01
