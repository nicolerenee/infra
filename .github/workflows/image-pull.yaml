---
name: Image Pull

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            .github/workflows/image-pull.yaml
            .github/workflows/image-pull-extract-pull.yaml
            scripts/test-image-pull-retry.py
            scripts/prepare-image-pull-root.py
            scripts/test-image-pull-scope.py
            scripts/pull-private-image.sh
            scripts/test-private-image-pull.py
            kubernetes/**/*
            apps/**/*

  retry-tests:
    name: Image Pull - Retry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/test-image-pull-retry.py
      - run: python3 scripts/test-private-image-pull.py
      - uses: home-operations/flate/action@2e5aa3f729477baa631486ce9b92a5df197286c2 # main
        with:
          base: ""
          version: "0.4.12"
      - run: python3 scripts/test-image-pull-scope.py

  clusters:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Cluster List
    runs-on: ubuntu-latest
    outputs:
      cluster-list: ${{ steps.list.outputs.clusters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: Get Cluster List
        working-directory: ./kubernetes/clusters
        run: |
          echo "clusters=$(ls -d * | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')" >> ${GITHUB_OUTPUT}

  pull:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: [filter, clusters]
    name: Cluster
    strategy:
      matrix:
        cluster: ${{ fromJSON(needs.clusters.outputs.cluster-list) }}
      fail-fast: false
    uses: ./.github/workflows/image-pull-extract-pull.yaml
    with:
      cluster: ${{ matrix.cluster }}
      runner: ${{ matrix.cluster }}-infra-runner

  success:
    if: ${{ !cancelled() }}
    needs: [pull, retry-tests]
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
