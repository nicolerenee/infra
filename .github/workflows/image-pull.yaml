---
name: Image Pull

on:
  pull_request:
    branches: ["main"]
  # The merge queue tests each group (main plus the PRs ahead of it) before
  # merging. "Image Pull - Success" is a required check, so it must report on
  # the group's commit or the queue waits forever.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files || steps.merge-group-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        if: ${{ github.event_name == 'pull_request' }}
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            .github/workflows/image-pull.yaml
            .github/workflows/image-pull-extract-pull.yaml
            scripts/test-image-pull-retry.py
            scripts/prepare-image-pull-root.py
            scripts/test-image-pull-scope.py
            kubernetes/**/*
            apps/**/*

      # action-changed-files only knows pull_request and push: on merge_group
      # it warns and returns [], which would skip the render and pull for
      # every group. Diff the group against the main it was built on instead,
      # with the same patterns as above (keep the two lists in step).
      - name: Get Changed Files (merge queue)
        id: merge-group-files
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" \
              --jq '.files[] | select(.status != "removed") | .filename' > files.txt
          cat files.txt
          pattern='^(kubernetes/|apps/|\.github/workflows/image-pull(-extract-pull)?\.yaml$'
          pattern="${pattern}|scripts/(test-image-pull-retry|prepare-image-pull-root|test-image-pull-scope)\.py$)"
          # grep exits 1 on no match, which pipefail would turn into a failure.
          files=$({ grep -E "${pattern}" files.txt || true; } \
              | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')
          echo "changed_files=${files}" >> "${GITHUB_OUTPUT}"

  retry-tests:
    name: Image Pull - Retry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/test-image-pull-retry.py
      - uses: home-operations/flate/action@2e5aa3f729477baa631486ce9b92a5df197286c2 # main
        with:
          base: ""
          version: "0.4.12"
      - run: python3 scripts/test-image-pull-scope.py

  clusters:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Cluster List
    runs-on: ubuntu-latest
    outputs:
      cluster-list: ${{ steps.list.outputs.clusters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: Get Cluster List
        working-directory: ./kubernetes/clusters
        run: |
          echo "clusters=$(ls -d * | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')" >> ${GITHUB_OUTPUT}

  pull:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: [filter, clusters]
    name: Cluster
    strategy:
      matrix:
        cluster: ${{ fromJSON(needs.clusters.outputs.cluster-list) }}
      fail-fast: false
    uses: ./.github/workflows/image-pull-extract-pull.yaml
    with:
      cluster: ${{ matrix.cluster }}
      runner: ${{ matrix.cluster }}-infra-runner

  success:
    if: ${{ !cancelled() }}
    needs: [pull, retry-tests]
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
