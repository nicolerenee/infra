---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Talos machine configs are managed with topf (https://postfinance.github.io/topf/).
# Each cluster has `kubernetes/clusters/<cluster>/talos/topf.yaml` plus a patch
# tree (all/, control-plane/, worker/); the secrets bundle is served from
# 1Password by resources/topf-secrets-provider, so nothing secret is on disk.
#
# Every task takes CLUSTER=<name>; most also take NODES=<regex> to act on a
# subset (matched against the node host names), e.g. NODES='^dgx0[4-7]$'.
# Extra flags go after `--`, e.g. `CLUSTER=fairy-k8s01 task talos:apply -- --mode=staged`.

vars:
  TALOS_RESOURCES_DIR: "{{.ROOT_DIR}}/.taskfiles/talos/resources"
  TALOS_DIR: "{{.CLUSTER_ROOT}}/talos"
  NODES_FILTER: '{{if .NODES}}--nodes-filter="{{.NODES}}"{{end}}'

tasks:
  render:
    desc: Render the machine configs to the (git-ignored) output/ dir for review
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf render {{.NODES_FILTER}} {{.CLI_ARGS}}
      - echo "Rendered configs contain the cluster secrets - delete {{.TALOS_DIR}}/output when done."
    requires:
      vars: ["CLUSTER"]
    preconditions: &clusterValidPrecondition
      - &clusterExistsCheck sh: test -f "{{.TALOS_DIR}}/topf.yaml"
        msg: "cluster {{.CLUSTER}} has no talos/topf.yaml"

  diff:
    desc: Show what an apply would change on the running nodes (dry run)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf apply --dry-run {{.NODES_FILTER}} {{.CLI_ARGS}}
    requires:
      vars: ["CLUSTER"]
    preconditions: *clusterValidPrecondition

  apply:
    desc: Apply the machine config to the running nodes (prompts before each change)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf apply {{.NODES_FILTER}} {{.CLI_ARGS}}
    requires:
      vars: ["CLUSTER"]
    preconditions: *clusterValidPrecondition

  upgrade:
    desc: Upgrade Talos on the nodes to the talosVersion in topf.yaml (drains, one CP at a time)
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf upgrade {{.NODES_FILTER}} {{.CLI_ARGS}}
    requires:
      vars: ["CLUSTER"]
    preconditions: *clusterValidPrecondition

  nodes:
    desc: List the cluster's nodes and their current state
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf nodes {{.NODES_FILTER}} {{.CLI_ARGS}}
    requires:
      vars: ["CLUSTER"]
    preconditions: *clusterValidPrecondition

  schematic-ids:
    desc: Print the Image Factory schematic ID each node's installer resolves to
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf schematic-ids {{.CLI_ARGS}}
    requires:
      vars: ["CLUSTER"]
    preconditions: *clusterValidPrecondition

  talosconfig:
    desc: Generate a talosconfig for the cluster from the secrets bundle and merge it into ~/.talos/config
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf talosconfig {{.CLI_ARGS}}
    requires:
      vars: ["CLUSTER"]
    preconditions: *clusterValidPrecondition
